id: T418
title: "P5 rehearsal world (test-only) - a local stand-in for the P3/P4 exit artifacts (P3-style Cards and a JEV model from the synthetic set, a P4-style te attribution in a store, minimal hash-chained P3/P4 ledgers citing them), the rt_family retrain target, local pins, a socket-guarded worker entry, reader stubs and answer files"
depends_on: [T208, T213, T214, T218, T313, T317, T321, T404, T412]
files:
  - tests/helpers/p5_rehearsal.py
  - tests/test_p5_rehearsal_world.py
route: opus
spec_complete: true
interface: |
  tests/helpers/p5_rehearsal.py (test-only):
    @dataclass(frozen=True)
    class World:
        root: pathlib.Path; cards_p3: pathlib.Path; store_p4: pathlib.Path; model: pathlib.Path; manifest: pathlib.Path
        pins_p3_file: pathlib.Path; ledgers: dict[str, pathlib.Path]          # {"p3", "p4"}
        pins: dict[str, dict]                                                  # {"p5", "p3", "p4"}: repo-or-path -> key sha
        retrain_target: dict; report_targets: tuple[dict, ...]; rt: dict[str, pathlib.Path]
        ack: pathlib.Path                                                      # root/"p5_ack.json" (D99 stand-in)
    def build_world(root: pathlib.Path) -> World                # cached: returns at once when root/"WORLD_DONE" exists
    p5_world: a pytest fixture (scope "session") -> build_world(tmp_path_factory.getbasetemp() / "p5_world")
    def guarded_worker_main(argv: list[str]) -> int            # socket guard, then scout.jobs.worker.main(argv)
    # `python -m tests.helpers.p5_rehearsal guarded-worker [worker args]` -> sys.exit(guarded_worker_main(args))
    def finding_worker_main(argv: list[str]) -> int            # guard + the base-copy patch (behavior 2b), then worker.main
    # `python -m tests.helpers.p5_rehearsal finding-worker [worker args]` -> sys.exit(finding_worker_main(args))
    def answers_from_key(key: dict, questions: list[dict], titles: dict[str, str]) -> dict[str, str]
        # answers in the form the report PRINTS (titles from reader.printed_titles(bundle)); they must score correct
    def make_reader_stub(keys_by_subject: dict[str, tuple[dict, dict[str, str]]], *, wrong: dict[str, str] | None = None,
                         canary_mode: str = "detect") -> StubS2Client     # subject title -> (key, titles)
    def write_human_answers(path: pathlib.Path, keys_by_label: dict[str, tuple[dict, list[dict], dict[str, str]]],
                            neutral: dict[str, str],
                            *, blind: bool = True, wrong: dict[str, dict[str, str]] | None = None,
                            canary_mode: str = "detect") -> None
behavior: |
  1. build_world(root):
     a. rt = retrain_fixtures.write_family(root / "rt") (T404: base, derived, control, redrawn, data).
     b. P3 stand-in: the T208 SYNTH_REPOS written as local repos exactly as the P3 offline rehearsal does, plus the rt
        base, derived, control and redrawn folders; all scanned with scout.scan.scan(..., sample=True, tokenizer=True,
        anchors=True, gate threshold 0 with the exact-pair confirmer from a plan-only pass) into cards_p3 (P1 layout; an
        rt model whose vocabulary lacks the anchor words gets no anchor Gram, which is allowed). The labeled set is the
        T208 synthetic labeled set; the JEV model = scripts.p3_train.train_from_files(labeled, pins, cards_p3, model,
        allow_synthetic=True). manifest = a library.v1 YAML listing the T208 base repos and the rt base and control
        (local paths as repo ids, as the P3 rehearsal does); pins_p3 = {path: key sha} for every scanned repo, written
        to pins_p3_file.
     c. P3 ledger (root/"ledger_p3.jsonl", scripts.p3_ledger.append with default kinds): one SCAN entry, mode
        "confirm", card_files for every Card in cards_p3 (sha256 of the JSON and Parquet files), then one FREEZE_MODEL
        with the model's sha256 (other payload fields filled with the real key names and plausible values; the P5
        reports only cite these two kinds).
     d. P4 stand-in: T313 TE family (write_te_pipeline of derive(TE_BASE), TE_BASE st repo, CONTROL); scout.attribute.
        attribute(te_dir + "#text_encoder", [te_base], controls=[control], store=CardStore(store_p4),
        backend=InProcessBackend(root / "scratch_p4"), gate_threshold_bytes=0, confirm pair from a plan_only call);
        P4 ledger (root/"ledger_p4.jsonl", kinds P4_KINDS): one P4_EXIT entry {passed: true, targets: {"te": {"object":
        entry.object}}} (other keys present with plausible values). pins_p4 = {te_dir: its key sha}.
     e. pins_p5 = {rt derived, rt base, rt control, rt data folder: their key shas} (the three model shas equal pins_p3).
     f. retrain_target = {"label": "retrain", "subject": derived path, "base": base path, "controls": (control path,),
        "blocks": tuple(retrain_fixtures.RT_FLAGGED), "budget": "rehearsal", "data": {"repo": data path, "train_file": "data/train.parquet",
        "eval_file": "data/test.parquet"}, "max_wall_s": 1800, "max_compute_s": 1200, "gate_threshold_bytes": 0}.
     g. report_targets = ({"label": "retrain", "subject": derived path, "component": None, "pins": "p3", "run": ("system1",
        "attribution", "retrain"), "not_run": ("system2",)}, {"label": "te", "subject": te_dir, "component":
        "text_encoder", "pins": "p4", "run": ("attribution",), "not_run": ("system1", "system2", "retrain")},
        {"label": "negative", "subject": <the T208 repo 'fb/base' local path>, "component": None, "pins": "p3",
        "run": ("system1",), "not_run": ("system2", "attribution", "retrain")}).
     g1. ack = root/"p5_ack.json" = {"decision": "D99", "by": "rehearsal", "date": "2026-09-29"} (the rehearsal's
        stand-in for the human acknowledgement that E5 requires, T417).
     g2. Write root/"WORLD_DONE".
  2. guarded_worker_main: socket.socket.connect and socket.create_connection are replaced by functions raising
     OSError("network disabled in the P5 rehearsal") before scout.jobs.worker.main runs; every rehearsal target is a
     local folder, so a passing job proves COMPUTE (torch/transformers included) made no network attempt.
  2b. finding_worker_main (D100; a correct loop on a model whose retraining recreates the base's neurons): the guard of
     behavior 2, then scout.retrain.loop.run_loop is wrapped so that it captures inp.provider and patches
     scout.retrain.train.Trainer.step: after each real step, for every flagged block b and role in (gate, up), the
     model parameter is overwritten in place with provider.tensor(1, <the same tensor name>) (the BASE's tensor; same
     architecture in rt_family) with its rows permuted by numpy.random.default_rng(b).permutation. The loop and every
     check run unchanged, so the run yields outcome signal_persists or neither (the flagged blocks are attributed), with
     every gating row ok (retrained_digest != reinit_digest; the flagged z differ from the baseline's).
  3. answers_from_key answers in the PRINTED form (validation r2 major 2: the rehearsal must exercise the normaliser on
     what a reader copies from the report, never on bare repos): Q1 -> titles[subject repo] verbatim (for the te
     subject "<te_dir>@<sha12> / text_encoder"); repo items of Q2, Q3, Q4 and Q5 -> titles[repo] (e.g.
     "<repo>@<sha12>: 8 of 8" for Q4, "<repo>@<sha12>: low confidence" for Q3); sets -> ", ".join(sorted); yes/no ->
     "Yes."/"No."; "not run"/"none" literal; section names as "System 1", "block attribution", ... . make_reader_stub:
     a StubS2Client whose responder finds which subject title occurs in the user message's report_text and returns
     {"answers": [...], "required_edits": [], "optional_edits": []} built by answers_from_key over that report's
     questions and titles, overriding question ids in `wrong`. The canary is recognised by
     READER_PARAMS["canary"]["licence_sentence"] in the report_text: canary_mode "detect" answers Q8 "Yes, the report
     says this is permitted." and adds the required edit {quote: that sentence, reason: "contradicts_report"} (a reader
     that reads: failed_as_required); canary_mode "ignore" answers from the clean key with no edits (a reader that
     answers from priors: detected [] and the canary row must FAIL); canary_mode "careful" answers what the canary text
     says, with no edits: Q4 the edited #attribution count of the base, Q8 "Yes.", Q9 "not stated", every other
     question from the clean key (validation r2 major 3: detected D1, D2 and D3, failed_as_required). make_canary
     comes from scripts.p5_canary (T412). Every call of the stub is
     deterministic, so the three llm samples of a file are equal.
     write_human_answers writes the plan.md 4.7 YAML keyed by the neutral file names (reader id "rehearsal", date
     "2026-09-29"), answers in the printed form as above, the canary entry built as in canary_mode.
  4. Attribution reference Cards (validation r2 major 5): the P4 stand-in's attribute() call stores the header-scan
     Cards of te_base and control in store_p4 (P4 T317 cached scans); the world asserts it, so T417 populate_store can
     import them and the te report cites them through the attribution Card (plan.md 3.6).
acceptance:
  tests:
    - "test_world_builds: build_world on a fresh dir -> every path exists; CardStore(store_p4) has the te entry with has.attribution; p3_ledger.verify(ledgers['p3']) == [] and verify(ledgers['p4'], kinds=P4_KINDS) == []; pins_p5 model shas equal pins_p3; the JEV model file loads with scout.jev.load"
    - "test_world_cited: for every Card in cards_p3 the SCAN entry's card_files match its file hashes; FREEZE_MODEL sha256 equals the model file; the P4_EXIT object equals the store entry"
    - "test_guarded_worker: `python -m tests.helpers.p5_rehearsal guarded-worker hello --scratch-root tmp` prints a hello line and exits 0; inside guarded_worker_main a socket.create_connection attempt raises OSError"
    - "test_answers_roundtrip: for report bundles built by T409 from the world (the retrain-style subject and the te subject), score(answers_from_key(key, qs, reader.printed_titles(bundle)), key, qs, [], ...) passes; the te Q1 answer ends with ' / text_encoder' and every repo answer contains '@'; with wrong={'Q6': 'none'} it fails"
    - "test_world_reference_cards: for every reference and control card_key in the te attribution Card's stats.attribution.references, CardStore(store_p4).find(...) returns an entry"
    - "test_canary_stub: for make_canary of that report, the 'detect' stub's answer gives canary_detection failed_as_required True (detected includes D2); the 'careful' stub's gives detected ['D1', 'D2', 'D3'] and True; the 'ignore' stub's gives detected [] and False"
    - "test_world_runtime: build_world on a fresh dir finishes within 600 s on 4 CPU cores"
  commands:
    - pytest -q tests/test_p5_rehearsal_world.py
    - pytest -q
out_of_scope:
  - the exit runner itself (T417) and the end-to-end rehearsal tests (T419)
invariants_touched: []
decisions: [D94, D97]
