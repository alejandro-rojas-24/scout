id: T408
title: "Retrain client - retrain(): store-cached header scans, dataset resolve and licence, retrain plan displayed in full (DATA, RECIPE, licence question), exact confirmation, job submission with live ingest, Card v4 (baseline attribution + retrain.v1) into the store, format_retrain text with every caveat"
depends_on: [T309, T317, T407]
files:
  - scout/retrain/client.py
  - tests/test_retrain_client.py
route: opus
spec_complete: true
interface: |
  scout/retrain/client.py:
    @dataclass(frozen=True)
    class RetrainResult:
        subject_key: dict; entry: StoreEntry | None; card: dict | None; plan: dict | None; decision: dict | None
        job: dict | None; outcome: str | None; text: str
    def retrain(subject: str, *, base: str, controls: list[str], blocks: list[int], data: DataSpec,
                budget_name: str = "exit", store: CardStore, backend: Backend | None,
                confirm_plan: str | None = None, confirm_bytes: int | None = None, plan_only: bool = False,
                display: Callable[[str], None] = <print to stderr, flush>, client: httpx.Client | None = None,
                endpoint: str | None = None, token: str | None = None,
                gate_threshold_bytes: int = DEFAULT_GATE_THRESHOLD_BYTES, wire_audit: bool = False,
                hello: dict | None = None, out_dir: pathlib.Path | None = None,
                git_commit: str | None = None) -> RetrainResult
    def licenses_of(subject_card: dict, reference_cards: list[tuple[str, dict]], data_license: str | None) -> dict
        # {"subject": str|None, "references": [{"title", "license"}], "data": str|None}; license = model_card.license, or
        # model_card.license_name when license == "other"
    def format_retrain(card: dict) -> str
    def parent_entry(store: CardStore, key: dict) -> StoreEntry | None
        # the subject's header-scan Card used as the lineage parent (validation r1 major 5): among store.entries(repo,
        # sha) with component == key.component, params_digest == scout.store.params_digest(), schema_version != "card.v4",
        # has["tokenizer"] True and has["attribution"] False, the newest (P4 find order: created_at, then object id)
behavior: |
  1. controls empty -> ValueError("retraining needs >= 1 independent control"); blocks empty -> ValueError.
  2. Header scans exactly as P4 T317 step 1 (store.cached_scan with tokenizer=True, a fresh ByteLog each, one unit per
     target), for [base] + controls; pinning of targets as P4 T317 step 2. The SUBJECT is different (validation r1
     major 5: after a retrain, cached_scan(tokenizer=True) returns the newer card.v4, whose parent would be wrong and
     which with_retrain refuses): parent = parent_entry(store, subject key); None -> scan.scan(subject target, tmp,
     ByteLog(), tokenizer=True, ...) (header scan, 0 weight bytes) and store.put_files of its Card, then parent =
     parent_entry again. The subject's LoadedModel, plan and with_retrain all use this parent Card (card.v0-v3,
     e.g. the P3 card.v2 at the exit), never a card.v4 or an attribution Card.
  3. log = ByteLog(); log.stage(RESOLVE); dsrc = data_source(data, log, client=client, endpoint=endpoint, token=token);
     dsrc.resolve() (a Hub data spec without a 40-hex revision is pinned to dsrc.revision_sha); files = resolve_data(
     dsrc.files(), data, sha); log.stage(META); lic = data_license(dsrc). No data file body is read on the client.
  4. rp = plan_retrain(subject, base, controls=..., blocks=..., data_files=files, budget_name=budget_name,
     data_license=lic, threshold_bytes=gate_threshold_bytes, host/scratch_root/disk_free_bytes from hello (or
     worker_hello(backend) when hello is None and backend is given)). Any RetrainRefused propagates (exit 10; no job).
  5. log.stage(FULL_DOWNLOAD). text = format_retrain_plan(rp, licenses=licenses_of(...)). plan_only -> display(text +
     "\n" + confirm_line(rp)); log.note("gate", text); return RetrainResult(plan=rp.to_dict(), text=..., others None).
  6. display the DATA/RECIPE/licence part of text (everything after the format_full_plan block) and log it as a gate
     note; d = run_full_gate(rp.plan, log, flag_confirmer(confirm_plan, confirm_bytes), display=display) (P4: displays the
     full plan before the decision). Not approved -> display("NOT CONFIRMED. " + confirm_line(rp)); GateDeclined; no job.
  7. parent = the entry chosen in step 2; spec = make_retrain_spec(rplan=rp, decision=d,
     subject_target, base_target, control_targets, blocks, budget_name, data=DataSpec(repo, pinned sha, train, eval),
     parent_object=parent.object, endpoint=endpoint or DEFAULT_ENDPOINT, scratch_root=hello scratch_root, wire_audit,
     client_hostname=socket.gethostname(), git_commit). outcome = run_job_via(backend, spec, log, display=display).
     Failed -> as P4 T317 step 7 (JobError with the worker's bytes; exit 7, or 8/9/10 re-raised as PurgeError /
     DiskSpaceError / RetrainRefused from the worker's error type).
  8. Success: att = result["attribution"] | {"job": {job_id, host, plan_id}}; rt = result["retrain"] | {"job": same};
     log.stage(REPORT); extra_log as P4 T317 step 8; built = card.with_retrain(parent Card, parent table (step 2), att, rt,
     extra_log, tmp); entry = store.put_files(...); optional export to out_dir; log.stage(PURGE); log.note("purge",
     "PURGE check: client holds no weights; worker: " + purge summary). Return RetrainResult(entry, card=built.card,
     plan, decision, job=outcome.record, outcome=rt["outcome"], text=format_retrain(built.card)).
  9. format_retrain(card) exact lines (r = card.stats.retrain):
     f"RETRAIN EXPERIMENT: {title} blocks {','.join(blocks)} of {stack_prefix} (recipe {recipe_id}, budget {budget})";
     f"  outcome: {outcome}" + (f" at step {stop_step}" if stop_step else "") + (f" ({reason})" if reason else "");
     f"  baseline: ppl {ppl:.2f}; flagged blocks attributed to the base {k}/{K}" (ppl '-' when None);
     f"  after re-initialisation: ppl_ratio {r:.3f}  top1 {a:.3f}" (omitted when reinit is None);
     one line per trace row f"  step {step:>5}: ppl_ratio {ppl_ratio:.3f}  top1 {top1_agreement:.3f}  flagged attributed
     {n}/{K}  max z_adj {m:.1f} (crit {c:.1f})" + ("  <- stop" if step == stop_step else "") (m = max flagged z_adj,
     '-' when all None); f"  data: {repo}@{sha[:12]} {train_file} / {eval_file}";
     f"  retrained digest {retrained_digest or '-'}; weights kept: no";
     "  licences: subject {s}; " + "; ".join(f"{title} {lic}") + f"; data {d}" ('unknown' for None);
     then LICENSE_QUESTION, RETRAIN_CAVEAT, ATTRIBUTION_CAVEAT and the three DISCLAIMERS, each on its own line.
  10. Nothing here reads a weight byte or a data file body on the client (asserted in tests).
acceptance:
  tests:
    - "fixtures: T404 rt_family as local folders (subject derived, base, control, data); LocalBackend and InProcessBackend with tmp scratch roots; tmp store; budget 'rehearsal'; gate_threshold_bytes 0"
    - "test_plan_only: plan_only=True -> text has 'FULL DOWNLOAD GATE', 'DATA (meta class', 'RECIPE ', LICENSE_QUESTION and the CONFIRM WITH line; no job; client totals.weight == 0; no data file body read (Source.read_file spy)"
    - "test_decline_no_job: wrong confirm bytes -> GateDeclined after the plan was displayed (spy order); backend.open never called"
    - "test_retrain_end_to_end_local_backend: exact confirmation -> RetrainResult outcome 'success'; the stored Card is card.v4 with stats.attribution (baseline: flagged blocks attributed) and stats.retrain (validate_retrain == [], lineage.parent_object == the subject header-scan entry's object, job set); fetch_log.jobs has 1 succeeded record and origin-tagged worker events; scratch audit 0 files"
    - "test_format_retrain: the text has the header, one line per trace row, the '<- stop' marker on the stop row, 'weights kept: no', LICENSE_QUESTION, RETRAIN_CAVEAT, ATTRIBUTION_CAVEAT and the 3 DISCLAIMERS verbatim"
    - "test_refused_before_job: subject with selector -> RetrainRefused (exit 10) before any backend call"
    - "test_worker_refusal_mapped: a worker error message of type RetrainRefused (fake worker scenario) -> RetrainRefused raised on the client with the worker's message"
    - "test_licenses_of: license 'other' + license_name 'llama3.1' -> 'llama3.1'; missing -> None"
    - "test_retrain_twice (validation r1 major 5): two complete retrains of the same subject (InProcessBackend, rehearsal budget, the second with blocks [RT_FLAGGED[0]] only) -> both succeed and store a card.v4; both have lineage.parent_object == the same header-scan entry's object; neither run's plan used a card.v4 (spy on plan_retrain's subject card schema_version)"
    - "test_parent_from_p3_card: a store holding only a P3-style card.v2 Card of the subject (sample+tokenizer+anchors, imported with import_tree) -> parent_entry returns it, no rescan happens (scan spy not called) and the retrain stores a card.v4 built from it"
    - "test_parent_entry_rules: a store with a header-scan v3, an attribution v3 and a v4 of the same key -> parent_entry returns the header-scan v3; with only the attribution v3 and the v4 -> None (the client then rescans)"
  commands:
    - pytest -q tests/test_retrain_client.py
    - pytest -q
out_of_scope:
  - CLI flags (T414); UI (T413); exit checks (T416-T418)
invariants_touched: [1, 2, 5]
decisions: [D81, D83, D84]
