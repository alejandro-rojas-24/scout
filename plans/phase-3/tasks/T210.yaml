id: T210
title: JEV System 1 - L2 logistic (Newton), family-disjoint OOF logits, Platt calibration, frozen threshold rule, abstention, jev_model.v1 file
depends_on: [T201, T209]
files:
  - scout/jev.py
  - tests/test_jev.py
route: opus
spec_complete: true
interface: |
  scout/jev.py:
    JEV_PARAMS: dict            # EXACTLY the plan.md 4.8 literal
    MODEL_SCHEMA = "jev_model.v1"; RESULT_SCHEMA = "jev.v1"

    @dataclass(frozen=True)
    class Example:
        id: str; families: frozenset[str]; y: int; x: dict[str, float | None]   # x keys == JEV_FEATURES
        hard: bool = False            # labeled hard_negative flag; reporting only, never a feature or a fit input

    def fit_logistic(X: numpy.ndarray, y: numpy.ndarray, lam: float, max_iter: int, tol: float) -> tuple[numpy.ndarray, float]
        # standardized X (n, d); returns (w, b); penalty lam/2 * ||w||^2, intercept unpenalized
    def fit_platt(f: numpy.ndarray, y: numpy.ndarray) -> tuple[float, float]       # (A, B); ValueError if A <= 0
    def thresholds(p: numpy.ndarray, y: numpy.ndarray, hard: numpy.ndarray | None = None) -> dict
        # {"hi","lo","max_neg_p","min_pos_p","n_pool_neg_hard","max_neg_hard_p","warnings"}

    @dataclass(frozen=True)
    class JevModel:
        mean: numpy.ndarray; sd: numpy.ndarray; impute: numpy.ndarray; w: numpy.ndarray; b: float
        A: float; B: float; hi: float; lo: float; doc: dict      # doc = the full jev_model.v1 dict
        sha256: str                                              # of the canonical JSON bytes written by save()
        def predict(self, feats: "PairFeatures | dict") -> dict   # jev.v1 result (plan.md 3.3)

    def train(train: list[Example], calibration: list[Example], *, labeled_sha256: str,
              card_keys: dict[str, list[dict]], git_commit: str | None = None) -> JevModel
    def save(model: JevModel, path: pathlib.Path) -> str        # writes canonical JSON (sort_keys, indent 1, "\n"); returns sha256
    def load(path: pathlib.Path) -> JevModel                    # validates schema, params == JEV_PARAMS, features == JEV_FEATURES
behavior: |
  1. Feature matrix: rows in the given order, columns JEV_FEATURES order.
  2. Standardization (train only): for each feature j, mean_j / sd_j over the train examples where x_j is not None
     (sd ddof 0, floored at sd_floor). impute_j = mean of x_j over train examples with y == 0 and x_j not None; if none,
     the mean over all train examples with x_j; if no train example has x_j -> ValueError(f"feature {j} missing in all
     training pairs").
     transform(x): v_j = x_j if not None else impute_j; z_j = (v_j - mean_j) / sd_j.
  3. fit_logistic: Newton-Raphson from w = 0, b = log((n1+0.5)/(n0+0.5)) on the SUM (not mean) log-loss
     L = sum(-y log p - (1-y) log(1-p)) + lam/2 ||w||^2; Hessian = X~^T diag(p(1-p)) X~ + diag(0, lam, ..., lam)
     (X~ = [1, X]); step solved by numpy.linalg.solve; stop when max|step| < tol or max_iter. Deterministic.
  4. OOF: for each train example e: fold = [t for t in train if t.families.isdisjoint(e.families)]; if fold has < oof_min_per_class
     of either class -> oof entry {id, logit: None, skipped_reason: "fold has too few examples of a class"}; else fit
     standardization + logistic on the fold (steps 2-3 on the fold only) and record logit of e.
  5. Final model: steps 2-3 on all train examples.
  6. Pool = OOF entries with a logit (source "oof") + final-model logits of calibration examples (source "calibration").
     Each class needs >= pool_min_per_class, else ValueError. (A, B) = fit_platt(pool logits, pool y): minimise
     sum(-t log q - (1-t) log(1-q)), q = sigmoid(A f + B), targets t = (N+ + 1)/(N+ + 2) for y=1 and 1/(N- + 2) for y=0;
     Newton from (A, B) = (1, 0); A <= 0 -> ValueError("calibration inverted").
     pool p = sigmoid(A * logit + B).
  7. thresholds(p, y): max_neg = max p over y==0; min_pos = min p over y==1;
     hi = min(t_hi_cap, max(t_hi_floor, max_neg + t_margin)); lo = max(t_lo_floor, min(t_lo_cap, min_pos - t_margin));
     lo = min(lo, hi - min_band); warnings: "pool negative at p >= hi" if max_neg >= hi; "pool positive at p <= lo" if
     min_pos <= lo. Values rounded to 6 decimals. hard (bool array, None -> all False): n_pool_neg_hard = #(y==0 and hard);
     max_neg_hard_p = max p over those (None if 0). The hard subset never changes hi/lo (the rule is frozen); it is reported
     in threshold_inputs and, by T214, in the FREEZE-model line.
  8. predict(feats) -> {"schema": "jev.v1", "p_derived", "verdict", "abstain_reason", "logit", "features": values,
     "missing": missing, "model_sha256", "thresholds": {"hi", "lo"}}:
     a. if values["r_med"] is None and values["cka"] is None -> verdict abstain, reason "no weight evidence", p_derived None, logit None.
     b. z from transform; if any AVAILABLE feature has |z| > ood_abs_z -> abstain "out of training range" (p and logit still reported).
     c. logit = w.z + b; p = sigmoid(A logit + B); p >= hi -> "derived"; p <= lo -> "not_derived"; else abstain "low confidence".
     p_derived and logit rounded to 6 decimals.
  9. Model doc = plan.md 4.3 exactly (train_pairs = ids of train, oof list, calibration_pool with id/source/logit/p/y/hard, card_keys,
     labeled_sha256, trained_at UTC Z, scout_version, git_commit). No held-out information is accepted by train() (its
     arguments are only train and calibration examples).
  10. load(): recompute sha256 of the file bytes; params/features must equal the module literals (ValueError otherwise).
acceptance:
  tests:
    - "test_params_literal: JEV_PARAMS == plan.md 4.8 literal"
    - "test_fit_logistic_known: a separable 1-D set with lam=1 gives finite w > 0; compare with an independent scipy-free gradient-descent solution in the test within 1e-6"
    - "test_platt_targets: pool of 3 pos / 3 neg well separated -> A > 0; an inverted pool -> ValueError('calibration inverted')"
    - "test_thresholds_rule: max_neg 0.30, min_pos 0.95 -> hi 0.80, lo 0.20; max_neg 0.97 -> hi 0.99 with no warning and lo = min(lo, 0.89); max_neg 0.995 -> hi 0.99 and warning; min_pos 0.03 -> lo 0.01 and warning"
    - "test_thresholds_hard: p [0.1, 0.5, 0.9, 0.95], y [0, 0, 1, 1], hard [True, False, False, False] -> n_pool_neg_hard 1, max_neg_hard_p 0.1; hi/lo identical to the call with hard=None; the model doc's calibration_pool entries carry 'hard'"
    - "test_oof_family_disjoint: 4 families with synthetic Examples; spy on fit_logistic inputs -> for every OOF fit, no example sharing a family with the scored example is in the fold; examples whose fold lacks a class are skipped with the reason"
    - "test_missing_imputation: a feature missing in one test example is imputed with the train not_derived mean (z equals that mean's standardization); missing in all train -> ValueError"
    - "test_no_evidence_abstains: r_med and cka None -> abstain 'no weight evidence', p None"
    - "test_ood: a value 100 sd away -> abstain 'out of training range'"
    - "test_band: p between lo and hi -> abstain 'low confidence'; p >= hi -> derived; p <= lo -> not_derived"
    - "test_save_load_roundtrip: save -> load -> identical predictions; sha256 == hashlib of the file; a file with JEV_PARAMS changed -> ValueError"
    - "test_end_to_end_synthetic (Examples from hand-made feature dicts; no T208 dependency): 8 derived / 8 not_derived over 4 families + calibration 3/3 -> trains, pool size >= 6 per class minus skips, thresholds within [0.01, 0.99]"
  commands:
    - pytest -q tests/test_jev.py
    - pytest -q
out_of_scope:
  - loading Cards / labeled file (T214)
  - held-out evaluation (T216/T217)
invariants_touched: [3, 4, 5]
decisions: [D37, D38, D39, D40]
