id: T217
title: P3 exit runner (pre-flight, one-shot ledger gate, EVAL_ATTEMPT before any held-out feature, EXIT entry; S1 held-out eval + sweep, optional S2) and the offline synthetic end-to-end rehearsal
depends_on: [T208, T213, T214, T216, T218]
files:
  - scripts/exit_check_p3.py
  - tests/test_exit_check_p3_offline.py
  - tests/test_exit_p3_network.py
route: opus
spec_complete: true
interface: |
  scripts/exit_check_p3.py:
    def build_static(*, pins_path, labeled_path, manifest_path, cards_dir, model_path, ledger_path,
                     allow_synthetic: bool = False, repo_root: Path,
                     git_state: Callable[..., dict] = p3_common.git_code_state) -> P3Inputs
        # everything the pre-flight needs; computes NO pair feature and NO verdict (heldout/sweep/reports/s1_requests stay None)
        # git_exit = git_state(repo_root, <payload.git_commit of the last FREEZE_MODEL after the last FREEZE_LABELED, or None>,
        #                      track=<ledger_path relative to repo_root if inside it, else str(absolute ledger_path)>)
        # (a ledger outside the repo is never tracked, so the real git_code_state returns tracked_head None -> C4 FAIL;
        #  the rehearsal's FAKE_CLEAN returns "" for any track)
    def evaluate_heldout(inp: P3Inputs) -> None        # fills heldout, sweep, reports, report_texts, s1_requests
    def run_s2(inp: P3Inputs, *, client: S2Client, config: S2Config) -> None   # fills s2, s2_inputs, s2_requests, s2_hosts
    def main(argv=None, *, s2_client_factory: Callable[[], S2Client] | None = None, sizes: Sizes | None = None,
             s2_expected_hosts: frozenset[str] | None = None,
             git_state: Callable[..., dict] | None = None) -> int
      # flags: --pins (exit/pins_p3.json) --labeled (groundtruth/labeled_v1.yaml) --manifest (library/manifest.yaml)
      #        --cards (cards/p3) --model (models/jev_v1.json) --ledger (exit/ledger_p3.jsonl) [--s2] [--s2-model ID]
      #        [--allow-synthetic]   (tests only; the real exit never passes it; C1 then requires synthetic false)
      # s2_client_factory / sizes / s2_expected_hosts / git_state are keyword-only for tests (no CLI flags); defaults:
      # AnthropicS2Client(), Sizes(), S2_HOSTS, p3_common.git_code_state
      # exit codes: 0 all evaluated checks ok; 1 ledger broken, PRE-FLIGHT FAIL, or any check FAIL; 5 one-shot refusal
  tests/test_exit_p3_network.py: @pytest.mark.network; skipped unless SCOUT_P3_EXIT=1; runs main([... "--s2"]) == 0
behavior: |
  1. main, in this order (plan.md 2.1 step 6; D54):
     a. HF_ENDPOINT foreign -> 1 (P1 message; the exit reads only local Cards, but the rule is kept for evidence consistency).
     b. problems = p3_ledger.verify(ledger); non-empty -> print "LEDGER BROKEN" and each problem; return 1 (nothing appended).
     c. inp = build_static(...). pre = preflight_checks(inp, sizes). Any pre row not ok -> print the table, then
        "PRE-FLIGHT FAIL: held-out not evaluated (no attempt recorded)"; return 1. Nothing is appended and no held-out
        feature has been computed, so the held-out set is not burned.
     d. stage = "s2" if --s2 else "s1". (ok, msg) = p3_ledger.eval_gate(inp.ledger, stage=stage, labeled_sha256=
        file_sha256(labeled), model_sha256=inp.model.sha256, heldout_repos=<held-out repos>). Not ok -> print
        "HELD-OUT EVALUATION REFUSED: " + msg; return 5; nothing appended.
     e. att = p3_ledger.append(ledger, "EVAL_ATTEMPT", {"stage", "labeled_sha256", "model_sha256", "heldout_repos",
        "heldout_pair_ids", "git_commit": inp.git_exit.commit, "code_dirty": inp.git_exit.code_dirty}) BEFORE step f.
     f. Inside try: evaluate_heldout(inp); rows = s1_checks(inp, sizes); with --s2: run_s2(...) and rows += s2_checks(inp,
        expected_hosts). An exception -> error = f"{type(e).__name__}: {e}", rows so far, passed False.
     g. Append "EXIT" with the plan.md 4.9 payload: stage, attempt_seq = att.seq, passed = (error is None and every row
        ok), failed = names of failing rows, error, per-pair rows, sweep {n, derived}, metrics (S1 and, with --s2, S2;
        including acc_by_family), nulls (for the train and calibration splits separately: median r_med and median cka over
        their not_derived pairs, computed with features.pair_features on the Cards; reported only), thresholds (the
        exit_expectations_p3 constants), model_sha256, labeled_sha256, s2 {requested_model, served_models, usage totals,
        n_available, unavailable: {pair_id: reason}, request_hosts} or null, git_commit, git_dirty, code_dirty and
        code_changed_since_freeze (from inp.git_exit). Always appended, even after an exception, so an attempt never
        stays without a result.
     h. Print the table `target | check | expected | actual | PASS/FAIL`, then "EXIT CHECK (S1): PASS|FAIL" (and
        "EXIT CHECK (S2): PASS|FAIL" with --s2), then {"step": "EXIT", "phase": 3, "ledger_seq": exit seq, **payload}
        (for the orchestrator's log.jsonl pointer). Return 0 iff passed (so any unavailable S2 pair makes --s2 non-zero).
  2. build_static:
     a. pins = json; labeled via load_labeled (errors captured into labeled_error); targets = p3_set.p3_targets(...).
     b. ledger_problems = p3_ledger.verify(ledger_path); ledger = read_ledger(...) if no problems else []; ledger_bytes =
        file bytes or b"".
     c. cards[repo] = LoadedCard(*load_card(card_paths(cards_dir, repo, pins[repo], None).json_path)) or None on any error;
        card_hashes[repo] = p3_set.card_file_hashes(cards_dir, repo, pins[repo]).
     d. model = jev.load(model_path) (errors captured).
     e. import_violations = static_import_violations(repo_root); git_exit as in the interface.
     f. No call of features.pair_features, model.predict or analysis.analyze happens here (asserted by a test spy).
  3. evaluate_heldout (runs only after the EVAL_ATTEMPT entry exists):
     a. Guard the network: for the whole call, monkeypatch httpx.HTTPTransport.handle_request (class attribute) with a
        function that increments a counter and raises RuntimeError("network disabled during S1 evaluation"); restore in
        finally. s1_requests = the counter.
     b. For each held-out pair (file order): feats = features.pair_features(ref, subj); r = model.predict(feats);
        report = analysis.analyze(subj, [ref], model) (its pairs[0].system1 equals r by construction); rows as
        P3Inputs.heldout. A pair whose Card is missing cannot reach this point (C3 is in the pre-flight).
     c. For each (a, b) in labeled.sweep_pairs("heldout"): reference a, subject b; predict -> sweep rows.
  4. run_s2: rec = system2.RecordingS2Client(client). For each held-out report k (heldout order): out =
     system2.run_system2(report_k, subj, [ref], rec, config); s2[k] = out; s2_inputs[k] = system2.build_input(report_k,
     subj, [ref]). After the loop: s2_requests = [raw.request_body for raw in rec.calls]; s2_hosts = [raw.request_host for
     raw in rec.calls] (a raising call records nothing, so the lengths no longer match heldout and C12 FAILs). In main the
     client is s2_client_factory() if given, else system2.AnthropicS2Client() (default anthropic.Anthropic(); no custom
     http_client, no event hooks: hosts and bodies come from the SDK's raw response, plan.md 3.4). The HF network guard
     of step 3a (a patch on httpx) is NOT active here and would not see SDK traffic anyway (the SDK uses httpx2); no
     Source is ever constructed. With --s2, S1 verdicts are recomputed deterministically inside the s2 attempt (same
     frozen model; FREEZE model is refused after any attempt).
  5. Offline rehearsal (tests/test_exit_check_p3_offline.py), end to end through the real scripts with FakeHub and a tmp
     ledger. Every p3_freeze and main call passes git_state=FAKE_CLEAN (lambda root, since=None, track=None: {"commit":
     "0"*40, "code_dirty": False, "code_changed_since": [] if since else None, "tracked_head": "" if track else None}) so
     a developer's working tree cannot affect the result. A module-scoped fixture builds steps a-f ONCE; every test copies
     the ledger file to its own tmp path, because each test consumes its own attempt. A test that mutates a Card, the
     model or the labeled file also works on its own copy of that file or directory (shutil.copytree / copy2), never on
     the shared fixture.
     a. hub = FakeHub(); repos = p3_fixtures.write_synth_set(tmp/"repos", hub); labeled = p3_fixtures.synth_labeled_yaml(tmp/
        "labeled.yaml"); manifest = a tmp library.v1 file with 2 entries: {repo: fa/base, family: qwen} and {repo: fg/base,
        family: llama} (family names are labels only; both repos are already in the labeled set, so targets == the 24
        synthetic repos).
     b. pins = {repo: sha} from write_synth_set; pins file written to tmp.
     c. p3_set.scan_set(pins, cards, mode="plan", client_factory=hub.client, endpoint=HUB, ledger_path=ledger) -> plans
        (SCAN plan entry appended by the script).
     d. p3_freeze main(["labeled", ..., "--allow-synthetic", "--ledger", ledger], git_state=FAKE_CLEAN) -> 0
        (FREEZE_LABELED appended; ts earlier than the scans in e). (The synthetic repos all have >= 8 layers and an anchor
        tokenizer, so no plan is zero-read.)
     e. p3_set.scan_set(..., mode="confirm", confirm_plans={id: cap of every plan}, ledger_path=ledger) -> 24 Cards; SCAN
        confirm entry with card_files appended.
     f. p3_train.train_from_files(..., allow_synthetic=True) -> model; p3_freeze main(["model", ..., "--ledger", ledger],
        git_state=FAKE_CLEAN) -> 0 (FREEZE_MODEL appended). If it returns 4 (threshold warning) the rehearsal FAILs: the
        frozen fixture must train cleanly.
     g. main([... all tmp paths ..., "--allow-synthetic"], sizes=Sizes(sweep_min=20), git_state=FAKE_CLEAN) -> 0 (S1),
        then main([... "--allow-synthetic", "--s2"], s2_client_factory=lambda: StubS2Client(agree), sizes=Sizes(sweep_min=20),
        s2_expected_hosts=frozenset({"stub.invalid"}), git_state=FAKE_CLEAN) -> 0 (S2). Overrides are test-only: sweep_min
        (the synthetic held-out has 16 pairs, 6 derived, 10 not_derived, 10 hard, 9 same-shape, and 20 sweep pairs), the
        expected S2 host and the git state; every threshold is the frozen one.
     h. Every S2 test runs the S1 main on its own ledger copy first (the s2 gate requires an s1 attempt).
acceptance:
  tests:
    - "test_rehearsal_pass: the full flow of behavior 5 -> both mains return 0; C0..C12 all ok; S1 metrics fd == 0, acc >= 0.90, abstain <= 0.30; the ledger now has SCAN, FREEZE_LABELED, SCAN, FREEZE_MODEL, EVAL_ATTEMPT(s1), EXIT, EVAL_ATTEMPT(s2), EXIT with an intact chain and both EXIT entries passed true; the lying-claim pair S29 is not derived and its report claim status for fh/ft vs fg/base is 'contradicted' (checked in the same test via analysis.analyze(fh/ft, [fg/base], model))"
    - "test_rehearsal_second_attempt_refused (validation r2 major 1): after a PASSING or FAILING S1 run, main S1 again -> returns 5, 'HELD-OUT EVALUATION REFUSED' printed, the ledger bytes are unchanged, and a spy on features.pair_features records 0 calls"
    - "test_rehearsal_refreeze_after_attempt_refused: after one S1 attempt, retrain to a new model path and p3_freeze model on it (with and without --refreeze-reason) -> returns 5 and appends nothing; main S1 with the originally frozen model -> 5"
    - "test_rehearsal_fail_edit_rerun_loop_blocked: monkeypatch model.predict so one held-out not_derived pair is called derived -> main S1 returns 1 (C6 FAIL) and the EXIT entry has passed false; then the 'fix' loop: undo the patch, retrain to a NEW model path, p3_freeze model on it with --refreeze-reason 'fix' -> 5; main S1 with the frozen model -> 5 (one-shot gate); main S1 with the retrained model -> 1 (PRE-FLIGHT: C4 model file / ledger model); in every case the ledger bytes are unchanged after the first EXIT"
    - "test_rehearsal_preflight_burns_nothing: delete one held-out Card -> main returns 1, 'PRE-FLIGHT FAIL' printed, no EVAL_ATTEMPT in the ledger, pair_features spy 0 calls; restore the Card files -> main returns 0"
    - "test_rehearsal_ledger_tampered: flip one byte inside the FREEZE_LABELED line -> main returns 1 with 'LEDGER BROKEN' and the file is unchanged"
    - "test_rehearsal_card_edited: rewrite one held-out Card parquet after the confirm scan (same schema, one stat value changed) -> PRE-FLIGHT FAIL with 'C3 card files' FAIL; no attempt recorded"
    - "test_rehearsal_s2_retry_only_if_unanswered: an S2 run whose stub raises RuntimeError (n_available 0) -> returns non-zero; a second S2 run with the agree stub -> allowed and 0; a third S2 run -> 5"
    - "test_rehearsal_leak: in a copy of the synthetic labeled file, change family fi's split from heldout to train and delete the pairs that would then cross splits (S30, S31, S33, S34, S35, S36); p3_freeze labeled on the copy (FREEZE_LABELED appended: no attempt exists yet), train_from_files on the copy (fi/base, fi/ft and S26 are now training data), p3_freeze model; then main with the ORIGINAL labeled file -> PRE-FLIGHT FAIL with C1 FAIL (labeled sha != last FREEZE_LABELED) and C4 FAIL (ledger labeled, model labeled_sha256 mismatch, and the model file contains the held-out repo string 'fi/base'); returns 1; no attempt recorded"
    - "test_rehearsal_labeled_changed_after_freeze: edit a note in the labeled file after FREEZE -> PRE-FLIGHT FAIL (C1)"
    - "test_rehearsal_model_changed: rewrite the model file after its FREEZE_MODEL -> PRE-FLIGHT FAIL (C4)"
    - "test_rehearsal_s2_upgrade_is_blocked: stub always answers 'derived' -> finals never 'derived' where S1 was not; C12 ok (blocked, not violated)"
    - "test_rehearsal_s2_violation_detected: monkeypatch run_system2 to return an out with a final 'derived' for an S1 abstain -> C12 FAIL"
    - "test_rehearsal_s2_unavailable: stub raising RuntimeError -> every S2 final == S1 and every out available False with 'error:RuntimeError'; the 'C12 available' row FAILs (and the hosts/requests rows FAIL: 0 recorded calls); 'EXIT CHECK (S2): FAIL'; main returns non-zero; the EXIT entry has s2.n_available 0"
    - "test_rehearsal_s2_max_tokens: stub returning S2Raw(text='{\"pairs\": [', stop_reason='max_tokens', served_model='claude-opus-5-5', request_host='stub.invalid', request_body=<valid body>) for one pair and agree for the rest -> that out has unavailable_reason 'max_tokens'; C12 available FAIL naming the pair; main non-zero"
    - "test_rehearsal_s2_request_leak: a stub whose request_body user JSON carries an extra 'stat_fro_norm' key -> 'C12 request no weights' FAIL"
    - "test_rehearsal_s2_foreign_host: stub request_host 'evil.example' -> 'C12 hosts' FAIL"
    - "test_rehearsal_code_changed: main with git_state returning code_changed_since ['scout/jev.py'] -> PRE-FLIGHT FAIL with 'C4 code frozen' FAIL; with code_dirty True -> same; no attempt recorded"
    - "test_s1_network_guard: monkeypatch features.pair_features to perform httpx.get('https://huggingface.co') -> caught; s1_requests == 1; 'C10 network' FAIL; the EXIT entry is appended with passed false"
    - "test_build_static_computes_nothing: spies on features.pair_features, JevModel.predict and analysis.analyze -> 0 calls during build_static and preflight_checks"
    - "test_real_files_c0: with the committed exit/pins_p3.json (UNPINNED), the real labeled/manifest files and a tmp --ledger (never the real exit/ledger_p3.jsonl) -> PRE-FLIGHT FAIL with C0 ok (51 targets) and C1 FAIL (no FREEZE_LABELED); returns 1 without raising; the tmp ledger is still absent/empty"
    - "tests/test_exit_p3_network.py is deselected by default"
  commands:
    - pytest -q tests/test_exit_check_p3_offline.py
    - pytest -q
    - "at EXIT only: python scripts/exit_check_p3.py (E6) and python scripts/exit_check_p3.py --s2 (E7); the script appends EVAL_ATTEMPT and EXIT to exit/ledger_p3.jsonl itself; commit the ledger"
out_of_scope:
  - scanning (T213), training/freezing (T214), the ledger rules (T218)
  - changing thresholds or sizes for the real exit (Sizes overrides are test-only keyword arguments)
invariants_touched: [1, 2, 3, 4, 5, 6]
decisions: [D42, D45, D51, D52, D54]
