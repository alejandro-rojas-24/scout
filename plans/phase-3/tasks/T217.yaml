id: T217
title: P3 exit runner (S1 held-out eval + sweep, optional S2) and the offline synthetic end-to-end rehearsal
depends_on: [T208, T213, T214, T216]
files:
  - scripts/exit_check_p3.py
  - tests/test_exit_check_p3_offline.py
  - tests/test_exit_p3_network.py
route: opus
spec_complete: true
interface: |
  scripts/exit_check_p3.py:
    def build_inputs(*, pins_path, labeled_path, manifest_path, cards_dir, model_path, log_path,
                     allow_synthetic: bool = False, repo_root: Path,
                     git_state: Callable[[Path, str | None], dict] = p3_common.git_code_state) -> P3Inputs
        # S1 part (s2 fields None); git_exit = git_state(repo_root, <git_commit of the last FREEZE-model line or None>)
    def run_s2(inp: P3Inputs, *, client: S2Client, config: S2Config) -> None   # fills s2, s2_inputs, s2_requests, s2_hosts
    def main(argv=None, *, s2_client_factory: Callable[[], S2Client] | None = None, sizes: Sizes | None = None,
             s2_expected_hosts: frozenset[str] | None = None,
             git_state: Callable[[Path, str | None], dict] | None = None) -> int
      # flags: --pins (exit/pins_p3.json) --labeled (groundtruth/labeled_v1.yaml) --manifest (library/manifest.yaml)
      #        --cards (cards/p3) --model (models/jev_v1.json) --log (plans/phase-3/log.jsonl) [--s2] [--s2-model ID]
      #        [--allow-synthetic]   (tests only; the real exit never passes it; C1 then requires synthetic false)
      # s2_client_factory / sizes / s2_expected_hosts / git_state are keyword-only for tests (no CLI flags); defaults:
      # AnthropicS2Client(), Sizes(), S2_HOSTS, p3_common.git_code_state
  tests/test_exit_p3_network.py: @pytest.mark.network; skipped unless SCOUT_P3_EXIT=1; runs main([... "--s2"]) == 0
behavior: |
  1. main: HF_ENDPOINT foreign -> 1 (P1 message; the exit reads only local Cards, but the rule is kept for evidence
     consistency). Load everything with build_inputs; run s1_checks(inp, sizes). If --s2: run_s2 and s2_checks.
     Print the table `target | check | expected | actual | PASS/FAIL`, then "EXIT CHECK (S1): PASS|FAIL" (and
     "EXIT CHECK (S2): PASS|FAIL" with --s2), then one JSON line plan.md 4.9 EXIT (stage "s2" when --s2, else "s1") with
     per-pair rows, sweep {n, derived}, metrics (S1 and, with --s2, S2; including acc_by_family), nulls (for the train and calibration splits
     separately: median r_med and median cka over their not_derived pairs, computed with features.pair_features on the
     Cards; reported only), thresholds (the exit_expectations_p3 constants), model_sha256, labeled_sha256,
     s2 {requested_model, served_models, usage totals, n_available, unavailable: {pair_id: reason}, request_hosts} or
     null, git_commit, git_dirty, code_dirty and code_changed_since_freeze (from inp.git_exit), hostname. Return 0 iff
     every evaluated check is ok (so any unavailable S2 pair makes --s2 return non-zero).
  2. build_inputs (S1):
     a. Guard the network: for the whole of build_inputs, monkeypatch httpx.HTTPTransport.handle_request (class attribute)
        with a function that increments a counter and raises RuntimeError("network disabled during S1 evaluation"); restore
        in finally. s1_requests = the counter.
     b. pins = json; labeled via load_labeled (errors captured into labeled_error); targets = p3_set.p3_targets(...).
     c. cards[repo] = LoadedCard(*load_card(card_paths(cards_dir, repo, pins[repo], None).json_path)) or None on any error.
     d. model = jev.load(model_path) (errors captured).
     e. For each held-out pair (file order): feats = features.pair_features(ref, subj); r = model.predict(feats);
        report = analysis.analyze(subj, [ref], model) (its pairs[0].system1 equals r by construction); rows as
        P3Inputs.heldout. A pair whose Card is missing gets verdict "abstain" with abstain_reason "card missing" (and C3
        already fails for that repo).
     f. For each (a, b) in labeled.sweep_pairs("heldout"): reference a, subject b; predict -> sweep rows.
     g. import_violations = static_import_violations(repo_root); log_lines = parsed JSON lines of log_path (non-JSON lines
        skipped).
  3. run_s2: rec = system2.RecordingS2Client(client). For each held-out report k (heldout order): out =
     system2.run_system2(report_k, subj, [ref], rec, config); s2[k] = out; s2_inputs[k] = system2.build_input(report_k,
     subj, [ref]). After the loop: s2_requests = [raw.request_body for raw in rec.calls]; s2_hosts = [raw.request_host for
     raw in rec.calls] (a raising call records nothing, so the lengths no longer match heldout and C12 FAILs). In main the
     client is s2_client_factory() if given, else system2.AnthropicS2Client() (default anthropic.Anthropic(); no custom
     http_client, no event hooks: hosts and bodies come from the SDK's raw response, plan.md 3.4). The HF network guard
     of step 2a (a patch on httpx) is NOT active here and would not see SDK traffic anyway (the SDK uses httpx2); no
     Source is ever constructed.
  4. Offline rehearsal (tests/test_exit_check_p3_offline.py), end to end through the real scripts with FakeHub. Every
     p3_freeze and main call passes git_state=FAKE_CLEAN (lambda root, since: {"commit": "0"*40, "code_dirty": False,
     "code_changed_since": [] if since else None}) so a developer's working tree cannot affect the result:
     a. hub = FakeHub(); repos = p3_fixtures.write_synth_set(tmp/"repos", hub); labeled = p3_fixtures.synth_labeled_yaml(tmp/
        "labeled.yaml"); manifest = a tmp library.v1 file with 2 entries: {repo: fa/base, family: qwen} and {repo: fg/base,
        family: llama} (family names are labels only; both repos are already in the labeled set, so targets == the 24
        synthetic repos).
     b. pins = {repo: sha} from write_synth_set; pins file written to tmp.
     c. p3_set.scan_set(pins, cards, mode="plan", client_factory=hub.client, endpoint=HUB) -> plans; the rehearsal writes the
        SCAN(plan) line into tmp log.
     d. p3_freeze labeled (allow_synthetic) -> FREEZE line appended to tmp log (ts earlier than the scans in e).
        (The synthetic repos all have >= 8 layers and an anchor tokenizer, so no plan is zero-read.)
     e. p3_set.scan_set(..., mode="confirm", confirm_plans={id: cap of every plan}) -> 24 Cards; SCAN(confirm) line appended.
     f. p3_train.train_from_files(..., allow_synthetic=True) -> model; p3_freeze model (git_state=FAKE_CLEAN) -> FREEZE
        line appended. If it returns 4 (threshold warning) the rehearsal FAILs: the frozen fixture must train cleanly.
     g. main([... all tmp paths ..., "--allow-synthetic", "--s2"], s2_client_factory=lambda: StubS2Client(agree),
        sizes=Sizes(sweep_min=20), s2_expected_hosts=frozenset({"stub.invalid"}), git_state=FAKE_CLEAN) -> 0. Overrides are
        test-only: sweep_min (the synthetic held-out has 16 pairs, 6 derived, 10 not_derived, 10 hard, and 20 sweep pairs),
        the expected S2 host and the git state; every threshold is the frozen one.
acceptance:
  tests:
    - "test_rehearsal_pass: the full flow of behavior 4 -> exit 0; C0..C12 all ok; S1 metrics fd == 0, acc >= 0.90, abstain <= 0.30; the lying-claim pair S29 is not derived and its report claim status for fh/ft vs fg/base is 'contradicted' (checked in the same test via analysis.analyze(fh/ft, [fg/base], model))"
    - "test_rehearsal_leak: in a copy of the synthetic labeled file, change family fi's split from heldout to train and delete the pairs that would then cross splits (S30, S31, S33, S34, S35, S36); p3_freeze labeled on the copy (FREEZE line appended), train_from_files on the copy (fi/base, fi/ft and S26 are now training data), p3_freeze model; then main with the ORIGINAL labeled file -> C1 FAIL (labeled sha != last FREEZE-labeled line) and C4 FAIL (model labeled_sha256 mismatch, and the model file contains the held-out repo string 'fi/base'); main returns non-zero"
    - "test_rehearsal_labeled_changed_after_freeze: edit a note in the labeled file after FREEZE -> C1 FAIL"
    - "test_rehearsal_model_changed: rewrite the model file after its FREEZE -> C4 FAIL"
    - "test_rehearsal_s2_upgrade_is_blocked: stub always answers 'derived' -> finals never 'derived' where S1 was not; C12 ok (blocked, not violated)"
    - "test_rehearsal_s2_violation_detected: monkeypatch run_system2 to return an out with a final 'derived' for an S1 abstain -> C12 FAIL"
    - "test_rehearsal_s2_unavailable: stub raising RuntimeError -> every S2 final == S1 and every out available False with 'error:RuntimeError'; the 'C12 available' row FAILs (and the hosts/requests rows FAIL: 0 recorded calls); 'EXIT CHECK (S2): FAIL'; main returns non-zero"
    - "test_rehearsal_s2_max_tokens: stub returning S2Raw(text='{\"pairs\": [', stop_reason='max_tokens', served_model='claude-opus-5-5', request_host='stub.invalid', request_body=<valid body>) for one pair and agree for the rest -> that out has unavailable_reason 'max_tokens'; C12 available FAIL naming the pair; main non-zero"
    - "test_rehearsal_s2_request_leak: a stub whose request_body user JSON carries an extra 'stat_fro_norm' key -> 'C12 request no weights' FAIL"
    - "test_rehearsal_s2_foreign_host: stub request_host 'evil.example' -> 'C12 hosts' FAIL"
    - "test_rehearsal_code_changed: main with git_state returning code_changed_since ['scout/jev.py'] -> 'C4 code frozen' FAIL; with code_dirty True -> FAIL"
    - "test_s1_network_guard: monkeypatch features.pair_features to perform httpx.get('https://huggingface.co') -> caught; s1_requests == 1; C10 FAIL"
    - "test_real_files_c0: with the committed exit/pins_p3.json (UNPINNED) and real labeled/manifest -> C0 ok (46 targets) and C1 FAIL (no FREEZE); returns non-zero without raising"
    - "tests/test_exit_p3_network.py is deselected by default"
  commands:
    - pytest -q tests/test_exit_check_p3_offline.py
    - pytest -q
    - "at EXIT only: python scripts/exit_check_p3.py (E6) and python scripts/exit_check_p3.py --s2 (E7); append the JSON lines to plans/phase-3/log.jsonl"
out_of_scope:
  - scanning (T213), training (T214)
  - changing thresholds or sizes for the real exit (Sizes overrides are test-only keyword arguments)
invariants_touched: [1, 2, 3, 4, 5, 6]
decisions: [D42, D45, D51, D52]
