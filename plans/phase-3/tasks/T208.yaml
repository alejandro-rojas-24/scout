id: T208
title: P3 synthetic fixtures - anchor vocab + ByteLevel tokenizer, shared-semantic embeddings, linear merges, lying claim, synthetic labeled set (labeled.v1, synthetic true)
depends_on: [T103, T201, T203, T205]
files:
  - tests/helpers/p3_fixtures.py
  - tests/test_p3_fixtures.py
route: sonnet
spec_complete: true
interface: |
  tests/helpers/p3_fixtures.py (test-only; numpy, yaml; imports weights_fixtures and scout.anchors):
    # FROZEN constants (plan.md 2.1: changing them to make a test pass is hand-tuning; test_frozen asserts the literals)
    P3_VOCAB: int = 512
    SEMANTIC_SEED: int = 424242
    SEMANTIC_RANK: int = 16
    SEMANTIC_WEIGHT: float = 0.3

    def anchor_vocab(seed: int) -> list[str]
        # ["Ġ" + w for w in anchor_words()] + [f"tok_{seed}_{i}" for i in range(P3_VOCAB - 256)]
    def p3_tokenizer_json_bytes(vocab: list[str]) -> bytes
    def p3_family_weights(spec: FamilySpec) -> dict[str, numpy.ndarray]
    def p3_family_config(spec: FamilySpec, n_layers: int | None = None) -> dict
    def merge_linear(w1: dict, w2: dict, t: float = 0.5) -> dict
    def write_p3_repo(root: pathlib.Path, w: dict, config: dict, vocab: list[str], *, base_model: list[str] | None = None,
                      n_shards: int = 2) -> dict

    @dataclass(frozen=True)
    class SynthRepo:
        repo: str; family: str; kind: str; spec: FamilySpec; params: tuple; base_model: tuple[str, ...]
    SYNTH_REPOS: tuple[SynthRepo, ...]       # table below, in order
    SYNTH_FAMILIES: dict[str, str]           # family -> split
    SYNTH_PAIRS: tuple[tuple[str, str, str, str, bool, bool], ...]   # (id, reference, subject, label, hard_negative, same_shape)
    def synth_weights(r: SynthRepo, cache: dict) -> dict[str, numpy.ndarray]
    def write_synth_set(root: pathlib.Path, hub: FakeHub | None = None) -> dict[str, tuple[pathlib.Path, str]]
        # writes every SYNTH_REPOS repo (in order) to root/<repo with "/" -> "__"> with write_p3_repo; sha =
        # hashlib.sha1(repo.encode()).hexdigest() (40 hex, distinct per repo); if hub is given, also
        # hub.add_repo(repo, dir, sha=sha) (P1 T003 FakeHub API). Returns {repo: (dir, sha)}
    def synth_labeled_yaml(path: pathlib.Path) -> pathlib.Path    # writes a labeled.v1 file with synthetic: true
behavior: |
  1. p3_tokenizer_json_bytes(vocab): json.dumps({"version": "1.0", "added_tokens": [{"id": len(vocab), "content":
     "<|endoftext|>", "special": True}], "pre_tokenizer": {"type": "ByteLevel"}, "decoder": {"type": "ByteLevel"},
     "model": {"type": "BPE", "vocab": {tok: i for i, tok in enumerate(vocab)}, "merges": []}}).encode().
  2. p3_family_weights(spec): w = weights_fixtures.family_weights(dataclasses.replace(spec, vocab=P3_VOCAB)); hidden =
     spec.hidden; Z = default_rng(SEMANTIC_SEED).standard_normal((256, SEMANTIC_RANK));
     P = default_rng(spec.seed + 50_000).standard_normal((SEMANTIC_RANK, hidden));
     N = default_rng(spec.seed + 60_000).standard_normal((256, hidden));
     E = w["model.embed_tokens.weight"].copy(); E[:256] = 0.02 * (sqrt(SEMANTIC_WEIGHT) * (Z @ P) / sqrt(SEMANTIC_RANK) +
     sqrt(1 - SEMANTIC_WEIGHT) * N); w["model.embed_tokens.weight"] = E.astype(float32). Key order unchanged.
     (Planner measurement, scratch numpy: debiased CKA of two independent families ~0.42-0.48 at hidden 128-160;
     a 2 % fine-tune ~1.0; eps 1.0 ~0.62.)
  3. p3_family_config: weights_fixtures.family_config(spec, n_layers) with "vocab_size" = P3_VOCAB.
  4. merge_linear: same keys in the same order required (else ValueError); ((1-t)*a + t*b).astype(float32).
  5. write_p3_repo: weights_fixtures.write_family_repo(root, w, config, n_shards=n_shards, vocab=None,
     readme=(f"---\nbase_model:\n" + "".join(f"- {b}\n" for b in base_model) + "---\n# synthetic\n") if base_model else
     "# synthetic\n"); then write root/"tokenizer.json" = p3_tokenizer_json_bytes(vocab). Return write_family_repo's dict.
  6. SYNTH_REPOS (repo, family, kind, spec, params, base_model). Specs are FamilySpec(seed=s) (qwen2 style) or
     FamilySpec(seed=s, style="llama"); every spec n_layers 16, hidden 128, trend_seed 0, vocab P3_VOCAB.
     kind/params: "base" (); "ft" (base_repo, eps, seed) = weights_fixtures.finetune(base weights, eps, seed);
     "up" (base_repo,) = upscale(base, 16, 12, 4); "merge" (base_repo, eps, seed_a, seed_b) =
     merge_linear(finetune(base, eps, seed_a), finetune(base, eps, seed_b)). vocab = anchor_vocab(<family base seed>).
       fa/base   fa  base  seed 11 qwen2
       fa/ft     fa  ft    (fa/base, 0.02, 101)                   base_model [fa/base]
       fa/ft-hard fa ft    (fa/base, 0.30, 102)                   base_model [fa/base]
       fb/base   fb  base  seed 12 qwen2
       fb/ft     fb  ft    (fb/base, 0.05, 103)                   base_model [fb/base]
       fb/merge  fb  merge (fb/base, 0.05, 104, 105)              base_model [fb/base]
       fc/base   fc  base  seed 13 llama
       fc/ft     fc  ft    (fc/base, 0.02, 106)                   base_model [fc/base]
       fc/up     fc  up    (fc/base,)                             base_model [fc/base]
       fd/base   fd  base  seed 14 llama
       fd/ft     fd  ft    (fd/base, 0.10, 107)                   base_model [fd/base]
       fe/base   fe  base  seed 15 qwen2
       fe/ft     fe  ft    (fe/base, 0.05, 108)                   base_model [fe/base]
       fe/ft-hard fe ft    (fe/base, 0.30, 109)                   base_model [fe/base]
       ff/base   ff  base  seed 16 llama
       ff/ft     ff  ft    (ff/base, 0.02, 110)                   base_model [ff/base]
       fg/base   fg  base  seed 17 qwen2
       fg/ft     fg  ft    (fg/base, 0.02, 111)                   base_model [fg/base]
       fg/up     fg  up    (fg/base,)                             base_model [fg/base]
       fg/merge  fg  merge (fg/base, 0.05, 112, 113)              base_model [fg/base]
       fh/base   fh  base  seed 18 llama
       fh/ft     fh  ft    (fh/base, 0.05, 114)                   base_model [fg/base]      # LYING claim
       fi/base   fi  base  seed 19 qwen2
       fi/ft     fi  ft    (fi/base, 0.10, 115)                   base_model []
     SYNTH_FAMILIES = {fa: train, fb: train, fc: train, fd: train, fe: calibration, ff: calibration, fg: heldout,
     fh: heldout, fi: heldout}.
  7. SYNTH_PAIRS (id, reference, subject, label, hard, same_shape): every not_derived pair here is hard (all hidden 128).
     same_shape = label not_derived and neither repo has kind "up" (every spec has k/v (64, 128) and 16 layers; an "up"
     repo has 24 layers): true for S08, S09, S10, S12, S13, S14 (train, 6), S18, S19, S20 (calibration, 3) and every
     held-out not_derived pair except S32 (9); false for S11, S32 and every derived pair.
       train derived:   S01 fa/base fa/ft; S02 fa/base fa/ft-hard; S03 fb/base fb/ft; S04 fb/base fb/merge;
                        S05 fc/base fc/ft; S06 fc/base fc/up; S07 fd/base fd/ft
       train not:       S08 fa/base fb/base; S09 fa/ft fc/base; S10 fb/merge fd/base; S11 fa/base fc/up;
                        S12 fb/ft fd/ft; S13 fc/ft fd/base; S14 fa/ft-hard fd/ft
       calib derived:   S15 fe/base fe/ft; S16 fe/base fe/ft-hard; S17 ff/base ff/ft
       calib not:       S18 fe/base ff/base; S19 fe/ft ff/ft; S20 fe/ft-hard ff/base
       heldout derived: S21 fg/base fg/ft; S22 fg/base fg/up; S23 fg/base fg/merge; S24 fg/ft fg/merge (siblings);
                        S25 fh/base fh/ft; S26 fi/base fi/ft
       heldout not:     S27 fg/base fh/base; S28 fg/ft fh/ft; S29 fg/base fh/ft (the lying claim); S30 fg/base fi/base;
                        S31 fh/base fi/ft; S32 fg/up fh/base; S33 fg/merge fi/base; S34 fh/ft fi/ft; S35 fg/merge fi/ft;
                        S36 fh/base fi/base
     heldout: 16 pairs (6 derived, 10 not_derived, 10 hard); sweep_pairs("heldout") = 4*2 + 4*2 + 2*2 = 20.
  8. synth_weights(r, cache): memoised by repo in `cache`; base -> p3_family_weights(spec); others built from the base's
     weights as in 6.
  9. synth_labeled_yaml(path): writes schema labeled.v1 with synthetic: true; one evidence entry {id: FX, kind: fixture,
     url: "fixture://p3", quote: "synthetic fixture", retrieved: "2026-09-29", verify: false}; families from SYNTH_FAMILIES
     with independence_evidence [FX]; repos from SYNTH_REPOS (verify false); pairs from SYNTH_PAIRS with relation
     (derived: "fine_tune" for ft, "depth_upscale" for up, "merge" for merge, "fine_tune" for siblings; not_derived:
     "independent"), hard_negative and same_shape from SYNTH_PAIRS, evidence [FX], verify false, note "". It must pass scout.groundtruth.load_labeled(path,
     allow_synthetic=True).
acceptance:
  tests:
    - "test_frozen: P3_VOCAB 512, SEMANTIC_SEED 424242, SEMANTIC_RANK 16, SEMANTIC_WEIGHT 0.3; len(SYNTH_REPOS) == 24; len(SYNTH_PAIRS) == 36"
    - "test_anchor_vocab: anchor_vocab(3)[:2] == ['Ġthe', 'Ġof']; length 512; scout.anchors.vocab_ids('tokenizer.json', p3_tokenizer_json_bytes(v)) is byte-level and anchor_ids(..., 512) gives 256 present with ids 0..255"
    - "test_semantic_rows: rows 0..255 of the embedding differ from weights_fixtures.family_weights(...) and rows 256.. are identical; all other tensors identical (numpy.array_equal)"
    - "test_cka_levels (uses scout.cka): debiased CKA of the anchor Grams: fa/base vs fb/base in [0.30, 0.60]; fa/base vs fa/ft >= 0.99"
    - "test_merge_linear: mismatched keys -> ValueError; merge of identical dicts equals the input"
    - "test_synth_labeled_valid: synth_labeled_yaml -> load_labeled(allow_synthetic=True) ok; heldout counts (6, 10); hard 10; same_shape per split train 6, calibration 3, heldout 9; sweep 20; load_labeled without allow_synthetic raises"
    - "test_write_hub: write_synth_set(tmp, hub=FakeHub()) -> every repo resolves through HubSource at its returned sha (24 distinct shas)"
    - "test_write_local: write_synth_set(tmp) creates 24 dirs, each with config.json (vocab_size 512), tokenizer.json, index + 2 shards; fh/ft README claims fg/base"
  commands:
    - pytest -q tests/test_p3_fixtures.py
    - pytest -q
out_of_scope:
  - any scout/ production code
  - the rehearsal itself (T217)
invariants_touched: [4, 5]
decisions: []
