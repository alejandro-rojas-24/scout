id: T211
title: Analysis report (analysis.v1) - S1 verdict per reference, claimed-vs-detected, unclaimed detections, config consistency, disclaimers, text rendering
depends_on: [T210]
files:
  - scout/analysis.py
  - tests/test_analysis.py
route: opus
spec_complete: true
interface: |
  scout/analysis.py:
    ANALYSIS_SCHEMA = "analysis.v1"
    VERDICT_SEMANTICS: str = ("derived = shared weight lineage (one model was initialised from the other's weights, or both "
        "from a common checkpoint); direction is not determined by weights. not_derived = weights consistent with "
        "independent initialisation (distillation and shared tokenizers remain possible). abstain = System 1 does not commit.")

    @dataclass(frozen=True)
    class LoadedCard:
        card: dict; table: pyarrow.Table
        @property key -> dict           # suggest.card_key(card)
        @property title -> str          # f"{repo}@{sha[:12]}" (+ " / component")

    def config_consistency(lc: LoadedCard) -> dict        # {"ok": bool, "issues": [str]}
    def analyze(subject: LoadedCard, references: list[LoadedCard], model: JevModel) -> dict   # plan.md 4.6
    def format_analysis(report: dict) -> str
behavior: |
  1. For each reference (in the given order; a reference with the same card_key as the subject is skipped):
     feats = features.pair_features(ref.card, ref.table, subject.card, subject.table); s1 = model.predict(feats);
     structure from features.structure_alignment summary when the sigma stacks paired, else from align.pair_stacks on
     stacks[0] of each Card (kind, mode, width_changed, depths; nulls if no stacks); context = {"tokenizer_jaccard":
     suggest.tokenizer_jaccard(ref, subj), "config_score": suggest.config_match(...)["score"]}.
  2. claims: for each c in subject.card["model_card"]["base_model"] (in order): ref index = the first reference whose
     key.repo equals c exactly, else case-insensitive equal, else None. status: None -> "no_card"; S1 derived ->
     "confirmed"; not_derived -> "contradicted"; abstain -> "undetermined". The claim is never passed to features or the model.
  3. unclaimed_detections: references with S1 verdict derived whose repo is not in the claims (case-insensitive), with p_derived.
  4. config_consistency(lc): raw = config.raw (text_config merged for missing keys, as suggest.config_value does); issues:
     - num_hidden_layers present and stacks exist and no stack whose prefix ends with "layers" has depth == it ->
       f"num_hidden_layers {n} != stack depth {d}" (d = stacks[0].depth)
     - embedding (cka.find_embedding over the Parquet rows' name/shape/dtype) exists: hidden_size present and != shape[1] ->
       f"hidden_size {h} != embedding width {w}"; vocab_size present and != shape[0] -> f"vocab_size {v} != embedding rows {r}"
     - first stack block 0 has a `self_attn.k_proj.weight` row and num_key_value_heads present: head_dim (or
       hidden_size // num_attention_heads) * kv != rows -> f"k_proj rows {r} != num_key_value_heads x head_dim {e}"
     ok = issues == []. Informational only; never changes a verdict.
  5. report = {"schema", "subject": {card_key, title}, "verdict_semantics": VERDICT_SEMANTICS, "pairs": [...], "claims",
     "unclaimed_detections", "config_consistency": {"subject": ..., "references": [...]}, "disclaimers":
     list(scout.view.DISCLAIMERS)}. json.dumps must work.
  6. format_analysis: exact layout:
     "LINEAGE ANALYSIS: {subject title}"
     one block per pair: "  vs {ref title}: {VERDICT}" where VERDICT is DERIVED / NOT DERIVED / ABSTAIN (reason);
       then "    p_derived {p:.2f} (coarse; 45-pair calibration)" when p is not None; "    features: " + comma list of
       name=value (3 decimals) or name=missing; "    structure: {kind} ({mode})".
     "  claims:" then one line per claim "    {claimed_base}: {status}" (or "    (none)").
     "  unclaimed detections:" lines or "    (none)".
     "  config consistency: ok" or one line per issue.
     "  meaning: " + VERDICT_SEMANTICS
     then the 3 disclaimers, each on its own line prefixed "  NOTE: ".
  7. Pure; no IO; no network; imports no scout.hub/sources/scan/gate.
acceptance:
  tests:
    - "Cards: small local scans as in T209 tests (base seed 1, finetune, independent seed 2); a JevModel trained in the test on hand-made Examples (T210 API) so that the related pair is derived and the unrelated is not_derived"
    - "test_report_keys: top-level keys exactly plan.md 4.6; disclaimers == DISCLAIMERS; json.dumps ok"
    - "test_lying_claim: subject = finetune of seed 1 whose card claims base_model ['org/other'] (the seed-2 repo) -> claims[0].status == 'contradicted'; the related base (unclaimed) appears in unclaimed_detections; the S1 results are identical to the run with the claim removed"
    - "test_no_card: claim of a repo not among references -> 'no_card', reference_index None"
    - "test_self_reference_skipped: passing the subject itself as a reference -> not in pairs"
    - "test_config_consistency: a card whose config.raw hidden_size is changed to 999 -> issue 'hidden_size 999 != embedding width 128'; num_hidden_layers 17 -> depth issue; untouched card -> ok"
    - "test_format: text contains 'LINEAGE ANALYSIS', 'DERIVED' for the related pair, 'NOT DERIVED' for the unrelated pair, 'p_derived', and each disclaimer prefixed 'NOTE: '; no probability printed with more than 2 decimals"
    - "test_no_network_imports: ast-parse scout/analysis.py, scout/features.py, scout/jev.py -> no import of scout.hub, scout.sources, scout.scan, scout.gate"
  commands:
    - pytest -q tests/test_analysis.py
    - pytest -q
out_of_scope:
  - System 2 (T212); CLI (T215)
  - persisting reports (never; recomputable from Cards)
invariants_touched: [1, 3, 5]
decisions: [D34, D40, D47]
