id: T207
title: Scan integration - `anchors` option (tokenizer ids -> gated anchor reads), COMPUTE with tensor stats + anchor Gram, Card v2 fill
depends_on: [T108, T202, T204, T205, T206]
files:
  - scout/scan.py
  - tests/test_scan_p3.py
  - tests/test_scan_p2.py
route: opus
spec_complete: true
interface: |
  scout/scan.py (changes to P2 T108):
    def scan(target, out_dir, log, *, client=None, endpoint=None, token=None, max_workers=8, tokenizer=False, sample=False,
             confirmer=None, gate_threshold_bytes=DEFAULT_GATE_THRESHOLD_BYTES, gate_display=None,
             anchors: bool = False) -> ScanResult
    # anchors=True requires tokenizer=True and sample=True, else ValueError("anchors requires tokenizer and sample")
behavior: |
  P2 steps are unchanged when anchors is False, except build_card now receives options with "anchors": False and, when
  sample ran, the tensor stats (step D'). Additions in order:
  A'. (META, in P2 step A) when anchors: keep the raw tokenizer bytes per unit (already read once per path). For each
      unit with a tokenizer file: try v = scout.anchors.vocab_ids(path, raw) except ValueError as e:
      notes.append(f"anchors: {path}: {e}"); no AnchorUnit. Else find the embedding (scout.cka.find_embedding over the
      unit's headers); none -> notes.append("anchors: no input embedding tensor with a supported dtype") (plan_anchor_unit
      will also report it); rows = embedding shape[0] (0 if none); (present, ids) = anchor_ids(v, rows);
      AnchorUnit(component, headers_u, present, ids, path, v.normalization). Units without a tokenizer get no AnchorUnit and
      a note "anchors: no tokenizer for {component or 'model'}".
  B'. plan = plan_sample(..., anchors=anchor_units if anchors else None). Skipped anchor entries become notes
      "sigma: ..." as in P2 (the reason text already starts with "anchors: "). If plan.reads is empty, skip C-E as in P2.
  C'. SAMPLED_READ is unchanged (the anchor reads are in plan.reads, so they are displayed, confirmed and granted with the
      sigma reads; fetch_one stores each read under r.tensor).
  D'. COMPUTE: sigma_specs = [(r.tensor, r.dtype, r.shape) for r in plan.reads if r.role != ANCHOR_ROLE];
      cr = compute_with_stats(buffers, sigma_specs). Then for each AnchorPlan ap (in order): rows = [];
      for r in ap.reads: raw = buffers.pop(r.tensor); released += len(raw); rows.append(decode_tensor(raw, r.dtype, r.shape));
      del raw. X = numpy.concatenate(rows) (rows in ascending token-id order); reorder X to the ap.present order
      (row for token id ap.token_ids[j] is at its position in the sorted-id order); gram = anchor_gram(X); del X, rows.
      Any exception: buffers.clear() and re-raise. Then the single purge note as in P2:
      f"released {released} weight bytes; resident={buffers.resident_bytes}" (released includes sigma and anchor bytes).
  E'. Per unit: stats_by_tensor_u = {name: cr.stats[name] for the unit's sigma reads}; (tensor_stats_u, spectral_topk_u) =
      stats_slots(stats_by_tensor_u) when non-empty else (None, None). anchor_embedding_u = {"version": "anchor.v1",
      "anchor_set": ANCHOR_SET, "anchor_sha256": ANCHOR_SHA256, "tensor": ap.tensor, "file": ap.file, "dtype": ap.dtype,
      "vocab_rows": ap.vocab_rows, "hidden": ap.hidden, "tokenizer_file": ap.tokenizer_file, "normalization":
      ap.normalization, "present": ap.present, "token_ids": ap.token_ids, "n_present": len(ap.present),
      "gram_scale": "1/hidden", "gram_layout": "upper-row-major-incl-diag", "plan_id": plan.plan_id,
      "bytes_read": sum(end-start of ap.reads)} and anchor_gram_u = gram, for the unit whose component matches.
  F'. build_card(..., options={"sample": sample, "tokenizer": tokenizer, "anchors": anchors}, tensor_stats=...,
      spectral_topk=..., stats_by_tensor=..., anchor_embedding=..., anchor_gram=...).
  G'. PURGE check unchanged (it covers anchor buffers too).
  H'. Update tests/test_scan_p2.py::test_plain_unchanged: options == {"sample": False, "tokenizer": False, "anchors": False};
      no other P2 test changes.
acceptance:
  tests:
    - "fixtures: tests/helpers/p3_fixtures (T208 is NOT a dependency; this test file builds its own minimal repo: weights_fixtures.write_family_repo(FamilySpec(seed=1, vocab=512)) plus a tokenizer.json written in the test with pre_tokenizer {'type':'ByteLevel'} and vocab {'Ġ'+w: i for i, w in enumerate(anchor_words())} + filler tokens up to 512); FakeHub and LocalSource as in T108"
    - "test_anchors_approved_hub: scan(sample=True, tokenizer=True, anchors=True, gate_threshold_bytes=0, confirmer=approve_exact) -> card.v2; stats.anchor_embedding.n_present == 256; the stat_anchor_gram row has 256*257/2 values; equals anchor_gram(decode of rows 0..255 read directly from the fixture file) within 1e-12; stats.tensor_stats.n_tensors == 32; stat_fro_norm non-null for exactly the 32 sampled rows; totals.weight == plan.bytes_planned; every cdn weight range equals a planned read"
    - "test_anchor_reads_gated: confirmer=flag_confirmer(None, None), threshold 0 -> GateDeclined; no cdn_reads range inside the embedding tensor's data; totals.weight == 0; out_dir empty"
    - "test_anchor_order: a tokenizer mapping anchors to non-monotone ids (anchor k -> id 300 - k for k < 200, others absent) -> present [0..199], stored token_ids follow present order, and the Gram equals the one computed from rows reordered to present order (1e-12)"
    - "test_anchor_too_few: a tokenizer containing only 100 anchor words -> Card written, anchor_embedding None, notes contain 'anchors: only 100 anchor words'; sigma still present"
    - "test_anchors_requires_flags: anchors=True with tokenizer=False -> ValueError before any request"
    - "test_p2_plan_unchanged: the same repo scanned with sample+tokenizer and anchors=False -> plan_id and reads identical to the P2 plan (plan_sample(..., anchors=None)), anchor_embedding None, stat_anchor_gram all null"
    - "test_purge_covers_anchors: monkeypatch anchor_gram to raise -> exception propagates, resident 0, out_dir empty"
    - "test_plain_scan_v2: default flags -> all 6 stats slots None, all stat_* columns null (P1 C7 still holds)"
    - "P2 tests/test_scan_p2.py (with the one updated assertion) and P1 tests/test_scan.py pass"
  commands:
    - pytest -q tests/test_scan_p3.py tests/test_scan_p2.py tests/test_scan.py
    - pytest -q
out_of_scope:
  - CLI/HTTP flags (T215; the server is unchanged in P3)
  - comparing Cards (T209)
invariants_touched: [1, 2, 4, 6]
decisions: [D35, D36, D48]
