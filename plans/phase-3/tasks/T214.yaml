id: T214
title: Freeze + train scripts - FREEZE_LABELED / FREEZE_MODEL appended to the ledger by the scripts with one-shot gates, code-freeze git state, p3_train on train+calibration only, null diagnostics (e=1 vs e=2)
depends_on: [T210, T211, T213, T218]      # T211: LoadedCard lives in scout/analysis.py; T218: scripts/p3_ledger.py
files:
  - scripts/p3_common.py
  - scripts/p3_freeze.py
  - scripts/p3_train.py
  - models/.gitkeep
  - tests/test_p3_train.py
route: opus
spec_complete: true
interface: |
  scripts/p3_common.py:
    from scout.analysis import LoadedCard                                # T211
    CODE_PATHS: tuple[str, ...] = ("scout", "scripts", "pyproject.toml")
    def git_code_state(repo_root: Path, since: str | None = None, *, track: str | None = None) -> dict
        # {"commit": str|None, "code_dirty": bool|None, "code_changed_since": list[str]|None, "tracked_head": str|None}; never raises
        # commit = `git rev-parse HEAD`; code_dirty = `git status --porcelain -- *CODE_PATHS` non-empty;
        # code_changed_since = sorted `git diff --name-only <since> HEAD -- *CODE_PATHS` lines when since is given, else None;
        # tracked_head = stdout of `git show HEAD:<track>` when track is given (the committed ledger), else None;
        # any git failure -> the affected field None (subprocess.run with cwd=repo_root, check=False, text=True)
    def load_pair_cards(ls: LabeledSet, pins: dict[str, str], cards_dir: Path, repos: list[str]) -> dict[str, LoadedCard]
        # repo -> LoadedCard at card_paths(cards_dir, repo, pins[repo], None) for the given repos; missing -> ScoutError naming the repo
    def examples_for(ls: LabeledSet, pairs: list[Pair], cards: dict[str, LoadedCard]) -> tuple[list[Example], dict[str, list[dict]]]
        # Example(id, frozenset({family_of(ref), family_of(subj)}), y = 1 if derived else 0, x = pair_features(...).values,
        #         hard = pair.hard_negative, same_shape = pair.same_shape)
        # and card_keys {pair_id: [ref key, subj key]}
    def git_info(repo_root: Path) -> tuple[str | None, bool | None]     # (commit, dirty); never raises
    def heldout_ids(ls: LabeledSet) -> tuple[list[str], list[str]]      # (sorted held-out repos, held-out pair ids in file order)
    TRAIN_MIN_SAME_SHAPE = 2; CAL_MIN_SAME_SHAPE = 1                    # plan.md D53 (YAML-flag gate before training)

  scripts/p3_freeze.py:
    def main(argv=None, *, git_state: Callable[..., dict] = git_code_state) -> int
      # p3_freeze.py labeled --labeled PATH --pins PATH [--ledger PATH] [--allow-synthetic]
      # p3_freeze.py model --model PATH --labeled PATH [--ledger PATH] [--ack-warnings TEXT] [--refreeze-reason TEXT]
      #                    [--code-change-reason TEXT]
      # --ledger default exit/ledger_p3.jsonl; git_state is keyword-only for tests (the rehearsal passes a fake clean state)
      # exit codes: 0 ok (entry appended, or "exists"); 1 validation / dirty code / unreasoned code change / leak / sha
      #             mismatch / broken ledger; 2 bad pins; 4 threshold warning without --ack-warnings; 5 one-shot rule refusal
  scripts/p3_train.py:
    def train_from_files(labeled: Path, pins: Path, cards: Path, out: Path, *, allow_synthetic: bool = False) -> dict
    def diagnostics(ls, cards) -> dict
    def main(argv=None) -> int
      # --labeled --pins --cards --out [--diagnostics] [--allow-synthetic]
behavior: |
  0. Ledger: every entry is written with scripts.p3_ledger.append(ledger, kind, payload) (T218) by THIS script; a
     LedgerError (broken chain) prints the problems and returns 1 with nothing written. The script also prints
     {"step": "FREEZE", "phase": 3, "what": "labeled"|"model", "ledger_seq": seq, **payload} as its last line (for the
     orchestrator's log.jsonl pointer). Nobody appends ledger lines by hand.
  1. p3_freeze labeled: ls = load_labeled(path, allow_synthetic=flag). u = unresolved(ls); non-empty -> print each and
     "FREEZE REFUSED: resolve every verify:true entry first", return 1. pins: every value 40-hex and set(pins) ⊇ repos of ls,
     else return 2. (hrepos, hids) = heldout_ids(ls). entries = read_ledger(ledger).
     (action, msg) = p3_ledger.freeze_labeled_gate(entries, sha256=file_sha256(labeled), heldout_repos=hrepos):
     "exists" -> print msg, return 0, nothing appended; "refuse" -> print "FREEZE REFUSED: " + msg, return 5.
     Payload {"sha256": file_sha256(labeled), "pins_sha256": file_sha256(pins), "counts": {split: {"derived",
     "not_derived", "hard", "same_shape"}}, "synthetic": ls.synthetic, "heldout_repos": hrepos, "heldout_pair_ids": hids,
     "git_commit": git_state(repo_root)["commit"]}; append "FREEZE_LABELED". Return 0.
  2. p3_freeze model: m = jev.load(model) (validates params/features); ls = load_labeled(labeled, allow_synthetic=True if
     the file says synthetic else False); m.doc["labeled_sha256"] must equal file_sha256(labeled) (else 1); heldout ids and
     heldout repos must not occur anywhere in json.dumps(m.doc) (else 1, naming them). entries = read_ledger(ledger).
     a. L = p3_ledger.last(entries, "FREEZE_LABELED"); L is None or L.payload.sha256 != file_sha256(labeled) -> print
        "FREEZE REFUSED: freeze the labeled file first (p3_freeze labeled)" and return 1. Then (ok, msg) =
        p3_ledger.freeze_model_gate(entries, labeled_sha256=file_sha256(labeled), refreeze_reason=--refreeze-reason);
        not ok -> print "FREEZE REFUSED: " + msg and return 5 (one-shot rule).
     b. L = last FREEZE_LABELED. g = git_state(repo_root, L.payload.git_commit) with repo_root =
        Path(__file__).resolve().parents[1]; g["code_dirty"] is not False -> print "FREEZE REFUSED: commit scout/,
        scripts/ and pyproject.toml first (plan.md 2.1 step 5)" and return 1.
        changed = g["code_changed_since"]; changed is None (unknown) or non-empty, and --code-change-reason empty -> print
        "FREEZE REFUSED: code under CODE_PATHS changed since the labeled freeze: <paths or 'unknown'>; give
        --code-change-reason \"<human reason>\"" and return 1.
     c. pool_hard = {"n_neg_hard": threshold_inputs.n_pool_neg_hard, "max_neg_hard_p": threshold_inputs.max_neg_hard_p,
        "n_neg_hard_ge_hi": #(calibration_pool entries with y 0, hard true, p >= thresholds.hi),
        "n_neg_sameshape": threshold_inputs.n_pool_neg_sameshape, "max_neg_sameshape_p": threshold_inputs.max_neg_sameshape_p}.
     d. threshold_inputs.warnings non-empty and no --ack-warnings -> print every pool row (id, source, y, hard, same_shape,
        p), the warnings and "FREEZE STOPPED: threshold warning; a human decides before the held-out run (re-run with
        --ack-warnings \"<reason>\")", return 4, nothing appended.
     e. Payload {"sha256": m.sha256, "labeled_sha256", "thresholds": {"hi", "lo"}, "warnings": threshold_inputs.warnings,
        "pool_hard", "ack_warnings": TEXT or null, "refreeze_reason": TEXT or null, "code_changed_since_labeled": changed,
        "code_change_reason": TEXT or null, "git_commit": g["commit"], "code_dirty": g["code_dirty"]}; append
        "FREEZE_MODEL". Return 0.
  3. train_from_files: ls = load_labeled(...); unresolved(ls) non-empty -> ScoutError (never train on unverified labels).
     Same-shape gate (YAML flags; C2 re-checks from Cards): #(train pairs with same_shape) < TRAIN_MIN_SAME_SHAPE or
     #(calibration pairs with same_shape) < CAL_MIN_SAME_SHAPE -> ScoutError("train needs >= 2 same-shape negatives and
     calibration >= 1 (plan.md D53)").
     cards = load_pair_cards(ls, pins, cards_dir, ls.repos_in("train", "calibration")) ONLY (held-out Cards are never loaded here).
     train_ex = examples_for(ls, ls.pairs_in("train"), cards); cal_ex = examples_for(ls, ls.pairs_in("calibration"), cards).
     model = jev.train(train_ex, cal_ex, labeled_sha256=file_sha256(labeled), card_keys=..., git_commit=git_info(...)[0]);
     sha = jev.save(model, out). Print a summary: per train/calibration pair id, label, hard, same_shape, oof or
     calibration p, thresholds, warnings; last line JSON {"step": "TRAIN", "phase": 3, "model_sha256": sha, "thresholds",
     "warnings", "n_train", "n_calibration", "n_pool"}. Return the dict. (Training writes no ledger entry.)
  4. diagnostics(ls, cards) (only --diagnostics; train and calibration not_derived pairs only): per family pair
     (sorted family ids) the median over its pairs of r_med computed twice: with the frozen statistic (edge 1, as in
     features) and at edge 2: rebuild R2 per side with layercorr.role_matrix -> residuals(..., edge=2) -> layer_vectors ->
     pearson_matrix, then in_run_null(R2, a, edge=2) on the same structure-only alignment a; plus the median
     participation ratios and median cka. Printed as a table and as {"step": "DIAG", ...}. It never changes the model
     (plan.md D49).
  5. main (p3_train) returns 0 on success, 1 on ScoutError/ValueError (printing the message).
acceptance:
  tests:
    - "tests/test_p3_train.py builds Cards with scan(sample, tokenizer, anchors) on LocalSource repos and a tiny labeled.v1 file (synthetic: true) written in the test: 6 families x (base, ft) of identical FamilySpec dimensions, with 2 train, 2 calibration, 2 heldout families and cross-family not_derived pairs, all marked hard_negative and same_shape (identical shapes and depth); train has 2 and calibration 1 such pair at least; ByteLevel anchor tokenizer as in T207 tests (T208 is not a dependency). Every test uses a tmp ledger path"
    - "every p3_freeze model call in these tests passes git_state=<fake clean state> ({'commit': '0'*40, 'code_dirty': False, 'code_changed_since': [] if since else None, 'tracked_head': ''}) unless the test is about git"
    - "test_freeze_labeled_refuses_verify: a file with one verify:true -> exit 1, 'FREEZE REFUSED' printed, ledger unchanged"
    - "test_freeze_labeled_ok: resolved file -> exit 0; read_ledger has 1 FREEZE_LABELED whose payload sha256 == file_sha256, counts per split incl. same_shape, heldout_repos sorted; a second identical call -> exit 0 and still 1 entry ('exists')"
    - "test_freeze_labeled_after_attempt (one-shot rule): append (via p3_ledger.append) an EVAL_ATTEMPT naming the held-out repos; edit a note in the labeled file (new sha, same held-out) -> exit 5, 'FREEZE REFUSED', nothing appended; a copy whose held-out families are replaced by two unused families (disjoint held-out) -> exit 0 and appended"
    - "test_train_never_loads_heldout: delete the held-out Cards from the cards dir -> training still succeeds; a spy on load_card sees no held-out repo"
    - "test_train_output: model file loads with jev.load; train_pairs == train ids; calibration_pool sources in {oof, calibration} with hard and same_shape keys; no held-out id or repo string in the file"
    - "test_train_requires_same_shape: the tiny file with same_shape false on every train pair -> ScoutError mentioning D53"
    - "test_freeze_model_leak: inject a held-out repo string into the model doc (and re-save) -> p3_freeze model returns 1 naming it"
    - "test_freeze_model_sha_mismatch: labeled file edited after training -> p3_freeze model returns 1"
    - "test_freeze_model_dirty_code: git_state fake returning code_dirty True (and None) -> returns 1, 'FREEZE REFUSED'; clean fake -> 0 and the FREEZE_MODEL payload has git_commit and code_dirty false"
    - "test_freeze_model_code_change: fake code_changed_since ['scout/features.py'] -> 1 without --code-change-reason; 0 with --code-change-reason 'fix before any held-out run' and the payload records both the paths and the reason; code_changed_since None -> 1 without a reason"
    - "test_freeze_model_refreeze: second p3_freeze model under the same FREEZE_LABELED -> 5 without --refreeze-reason; 0 with it (payload refreeze_reason set); after appending an EVAL_ATTEMPT under that freeze -> 5 even with --refreeze-reason"
    - "test_freeze_model_warning_stops: a model doc whose threshold_inputs.warnings is non-empty (re-saved) -> returns 4, nothing appended, pool rows printed; with --ack-warnings 'reviewed' -> 0 and ack_warnings == 'reviewed'; pool_hard present with the five keys"
    - "test_freeze_broken_ledger: flip one byte of the tmp ledger -> both subcommands return 1 and the file is unchanged"
    - "test_examples_flags: examples_for sets Example.hard and Example.same_shape from the labeled flags"
    - "test_git_code_state (skipped if the git binary is missing): a tmp git repo with scout/a.py committed -> code_dirty False, commit 40-hex; editing scout/a.py -> code_dirty True; committing it -> code_changed_since(first commit) == ['scout/a.py']; editing models/x.json only -> code_dirty False; track='exit/l.jsonl' committed with 'a\\n' -> tracked_head == 'a\\n', untracked path -> None; a non-repo dir -> all None, no exception"
    - "test_diagnostics: runs and prints one row per family pair with r_med_e1 and r_med_e2 keys; the model file is unchanged (sha)"
    - "test_unresolved_blocks_training: train_from_files on a file with verify:true -> ScoutError"
  commands:
    - pytest -q tests/test_p3_train.py
    - pytest -q
    - "at EXIT only: python scripts/p3_freeze.py labeled ...; python scripts/p3_train.py ...; python scripts/p3_freeze.py model ... (the scripts append to exit/ledger_p3.jsonl themselves; commit it)"
out_of_scope:
  - held-out evaluation (T216/T217)
  - the ledger format and gate logic (T218; this task only calls them)
invariants_touched: [3, 4]
decisions: [D37, D38, D49, D52, D53, D54]
