id: T312
title: FULL_DOWNLOAD to scratch - chunked ranged reads (64 MiB, 4 threads) through Source.read_range under the FULL_DOWNLOAD grant, written to ScratchDir with disk accounting
depends_on: [T301, T310, T311]
files:
  - scout/jobs/download.py
  - tests/test_download.py
route: opus
spec_complete: true
interface: |
  scout/jobs/download.py:
    @dataclass(frozen=True)
    class DownloadReport:
        n_reads: int; n_chunks: int; bytes_written: int; elapsed_s: float
        def to_dict(self) -> dict
    def chunk_ranges(start: int, end_exclusive: int, chunk: int) -> list[tuple[int, int]]
    def download_plan(plan: FullPlan, sources: dict[int, Source], scratch: ScratchDir, log: ByteLog, *,
                      chunk_bytes: int = JOB_PARAMS["chunk_bytes"], workers: int = JOB_PARAMS["download_workers"],
                      clock: Callable[[], float] = time.monotonic) -> DownloadReport
behavior: |
  1. Preconditions (else JobError, before any request): log.current_stage == Stage.FULL_DOWNLOAD; log.grant_active;
     log.grant_stage == Stage.FULL_DOWNLOAD; every planned model has a source; each source's log is a LogView with
     prefix f"m{model}:" (the grant ranges use those prefixes, T310 grant_ranges).
  2. chunk_ranges(s, e, c) = [(x, min(x + c, e)) for x in range(s, e, c)]; c > 0; s < e.
  3. For each read r (plan order): scratch.allocate(r.model, r.tensor, r.end_exclusive - r.start). Then a
     ThreadPoolExecutor(workers) runs one task per chunk (in plan order): data = sources[r.model].read_range(r.path, cs,
     ce - cs) (logged, preflighted and grant-checked by the Source; P1/P2 retries with recheck happen inside);
     len(data) != ce - cs -> JobError(f"short read {r.path} [{cs}, {ce})"); scratch.write(r.model, r.tensor, cs - r.start, data).
     Chunk callables take (r, cs, ce) as arguments (no late-binding lambdas).
  4. On the first exception: cancel pending futures, wait for running ones, re-raise (the caller purges; this function
     never deletes).
  5. After all chunks: for every read, the file size == its planned size (else JobError "incomplete tensor").
  6. Returns DownloadReport(n_reads, n_chunks, bytes_written = scratch.bytes_written, elapsed_s).
  7. Memory: at most `workers` chunk buffers alive (each released after its write).
acceptance:
  tests:
    - "fixtures: plans from T310 over T313 write_st_repo(BASE) and write_st_repo(CONTROL) as local folders; sources = LocalSource(root, log.view('m{i}:')); log.stage(FULL_DOWNLOAD); log.grant(plan.plan_id, plan.grant_ranges(), plan.bytes_cap, stage=FULL_DOWNLOAD)"
    - "test_chunk_ranges: (0, 10, 4) -> [(0,4),(4,8),(8,10)]; c=0 -> ValueError"
    - "test_download_local: chunk_bytes 4096 -> every scratch tensor equals the file bytes of its range; totals.weight == bytes_planned; n_chunks == sum(ceil(size/4096)); log.disk_resident == bytes_planned"
    - "test_download_hub: same via FakeHub HubSource (CDN redirects) -> identical bytes; every CDN request Range lies inside a planned read"
    - "test_preconditions: wrong stage, no grant, grant in SAMPLED_READ -> JobError with 0 requests"
    - "test_retry_within_cap: FakeHub resets once mid-chunk -> success; totals.weight <= bytes_cap"
    - "test_fail_propagates: a source that raises NetworkError on the 3rd chunk -> the exception propagates, no later chunk starts after it is observed (spy), scratch not deleted by download_plan"
    - "test_outside_grant_refused: a plan whose read was altered after the grant (one byte past the granted range) -> WeightReadRefused from preflight, 0 bytes of that range fetched"
  commands:
    - pytest -q tests/test_download.py
    - pytest -q
out_of_scope:
  - purging (T311, T316); plan construction (T310)
invariants_touched: [1, 2]
decisions: [D58, D60]
