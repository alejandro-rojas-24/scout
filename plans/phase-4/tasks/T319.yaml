id: T319
title: CLI P4 - scout attribute, scout jobs {worker,hello,sweep,audit}, scout store {import,ls}, scout scan --store, scout serve --store, TARGET#selector everywhere
depends_on: [T215, T309, T311, T316, T317, T318]
files:
  - scout/cli.py
  - tests/test_cli_p4.py
route: sonnet
spec_complete: true
interface: |
  scout/cli.py (additions to P3 T215; main signature unchanged, plus a test-only keyword backend_factory):
    def main(argv=None, *, client_factory=None, s2_client_factory=None,
             backend_factory: Callable[[str], Backend] | None = None) -> int
    scout attribute SUBJECT --base TARGET [--base TARGET ...] [--backend local|ssh:HOST] [--store DIR]
                    [--plan-only | --confirm-plan PLAN_ID --confirm-bytes N] [--gate-threshold-bytes N]
                    [--out DIR] [--json] [--endpoint URL]
      defaults: --backend = env SCOUT_BACKEND or "local"; --store = env SCOUT_STORE or "cards/store"
    scout jobs worker [--scratch-root DIR] [--wire-audit]       # delegates to scout.jobs.worker.main
    scout jobs hello|sweep|audit [--scratch-root DIR] [--dry-run (sweep)] [--json]   # delegates to scout.jobs.worker.main
    scout store import DIR [--store DIR]
    scout store ls [--store DIR] [--stale] [--json]
    scout scan TARGET ... [--store DIR]                         # with --store: cached_scan; prints hit/scanned + keys
    scout serve ... [--store DIR]                               # passes store_dir to serve()
behavior: |
  1. attribute: backend = backend_factory(text) if given else parse_backend(text). Calls scout.attribute.attribute(...)
     with display = stderr printer. --plan-only prints the plan and the CONFIRM WITH line to stderr, exit 0.
     --confirm-plan without --confirm-bytes (or the reverse) -> argparse error exit 2 "--confirm-plan and
     --confirm-bytes go together". Success: stdout = result.text (or JSON {"card_key", "object", "cached", "attribution"}
     with --json), exit 0. GateDeclined -> exit 6 with the P2 message and the CONFIRM WITH line on stderr. JobError 7,
     PurgeError 8, DiskSpaceError 9, other ScoutError -> their exit codes with the message on stderr.
  2. jobs subcommands forward argv to scout.jobs.worker.main unchanged and return its exit code.
  3. store import DIR -> prints f"imported {n} Cards into {store}" and exit 0; store ls -> one line per entry
     "{key_string}  {object[:12]}  {flags}  {created_at}" (flags = has keys that are true, comma-joined, or "-"),
     --stale lists only stale entries, --json a JSON list of entry dicts.
  4. scan --store DIR: (entries, hit) = cached_scan(target, store, log, tokenizer=, sample=, anchors=, confirmer=...,
     gate args as for scan); stdout JSON adds {"store": str(dir), "hit": bool, "objects": [...]}; without --store the P3
     behaviour is unchanged.
  5. Targets with "#selector" are accepted by scan, attribute and --base (scan() and cached_scan handle them).
  6. Disclaimers: attribute's text output already contains the DISCLAIMERS and ATTRIBUTION_CAVEAT (T317); nothing is
     removed.
acceptance:
  tests:
    - "test_attribute_plan_only: backend_factory -> InProcessBackend over T313 local repos; `scout attribute <gguf dir> --base <base dir> --base <control dir> --plan-only --store tmp` -> exit 0, stderr has FULL DOWNLOAD GATE and CONFIRM WITH, stdout empty"
    - "test_attribute_confirmed: copy the plan_id/cap from the plan-only stderr, run with --confirm-plan/--confirm-bytes and --gate-threshold-bytes 0 -> exit 0, stdout contains 'BLOCK ATTRIBUTION' and the caveat; a second run prints the same text with 0 jobs (cached)"
    - "test_attribute_declined: wrong bytes -> exit 6, stderr has NOT CONFIRMED and the CONFIRM WITH line"
    - "test_confirm_flags_together: only --confirm-plan -> exit 2"
    - "test_jobs_cli: `scout jobs hello --scratch-root tmp` prints a hello JSON; `scout jobs sweep --json --scratch-root tmp` prints a SweepReport JSON; exit 0"
    - "test_store_cli: store import of a P1-layout dir with 2 Cards -> 'imported 2'; store ls lists 2 lines; --json parses"
    - "test_scan_store: scan <st dir> --store tmp twice -> second stdout JSON has hit true"
    - "test_p1_p3_cli_unchanged: the P1/P2/P3 CLI test modules still pass (run in the full suite)"
  commands:
    - pytest -q tests/test_cli_p4.py
    - pytest -q
out_of_scope:
  - new behaviour behind the commands (T309, T311, T316, T317)
invariants_touched: [2, 5]
decisions: [D56, D64]
