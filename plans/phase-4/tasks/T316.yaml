id: T316
title: Worker - run_job (validate, worker lock + sweep, inspect_all, re-plan and exact-pair check, disk check, gated FULL_DOWNLOAD to scratch, COMPUTE attribution, purge in finally, PURGE check, result) and the scout.jobs.worker entrypoint (job, hello, sweep, audit)
depends_on: [T307, T310, T311, T312, T314, T315]
files:
  - scout/jobs/runner.py
  - scout/jobs/worker.py
  - tests/test_jobs_runner.py
route: opus
spec_complete: true
interface: |
  scout/jobs/runner.py:
    class ScratchProvider:            # scout.attrib.TensorProvider over a ScratchDir and a FullPlan
        def __init__(self, scratch: ScratchDir, plan: FullPlan, block_sizes: dict[int, tuple[int, int] | None]) -> None
            # block_sizes: model -> weights.quant.block_size (FP8) or None
        def tensor(self, model: int, name: str) -> numpy.ndarray
        def rows(self, model: int, name: str, rows: Sequence[int]) -> numpy.ndarray
    def resolve_token() -> str | None   # env HF_TOKEN (non-empty) else ~/.cache/huggingface/token (stripped) else None
    def hello(scratch_root: pathlib.Path) -> dict                  # plan.md 4.5 hello fields (job_id None)
        # git_commit/git_dirty: repo_root = Path(scout.__file__).resolve().parent.parent; if (repo_root / ".git") exists:
        # `git -C repo_root rev-parse HEAD` and bool(`git -C repo_root status --porcelain -- scout scripts pyproject.toml`);
        # else (or on any error) None and None. machine/system from platform; mem_total_bytes from
        # os.sysconf("SC_PAGE_SIZE") * os.sysconf("SC_PHYS_PAGES"); disk_free_bytes = shutil.disk_usage(scratch_root
        # or its nearest existing parent).free; has_hf_token = resolve_token() is not None (the token itself is never sent)
    def run_job(spec: dict, *, scratch_root: pathlib.Path, emit: Callable[[dict], None],
                client_factory: Callable[[], httpx.Client] | None = None, endpoint: str | None = None,
                token: str | None = None, disk_usage: Callable[[str], Any] = shutil.disk_usage,
                wall_clock: Callable[[], float] = time.time) -> dict   # JobResult (plan.md 4.5)
  scout/jobs/worker.py:
    def main(argv: list[str] | None = None, *, stdin: BinaryIO | None = None, stdout: BinaryIO | None = None,
             client_factory: Callable[[], httpx.Client] | None = None, endpoint: str | None = None,
             token: str | None = None) -> int
      # python -m scout.jobs.worker [--scratch-root DIR] [--wire-audit]            -> job spec on stdin, jobproto on stdout
      # python -m scout.jobs.worker hello [--scratch-root DIR]                      -> one hello line, exit 0
      # python -m scout.jobs.worker sweep [--dry-run] [--json] [--scratch-root DIR] -> SweepReport JSON line
      # python -m scout.jobs.worker audit [--json] [--scratch-root DIR]            -> audit JSON line
    if __name__ == "__main__": sys.exit(main())
behavior: |
  run_job, in order (every emitted message goes through emit(protocol dict); a BrokenPipeError/OSError from emit is
  re-raised as BackendError and still runs every finally below):
  1. problems = validate_spec(spec) -> JobError listing them. spec["params_digest"] != params_digest() -> JobError
     ("worker code differs from client"). endpoint: spec["endpoint"] must equal the given endpoint or
     scout.hub.DEFAULT_ENDPOINT when none is given (tests pass FakeHub's endpoint explicitly).
  2. log = ByteLog(threshold_bytes=DEFAULT_THRESHOLD_BYTES, on_event=lambda e: emit({"type": "event", "event": e.to_dict()})).
     A heartbeat thread emits {"type": "heartbeat", "ts", "stage", "disk_resident_bytes", "rss_bytes"} every
     JOB_PARAMS["heartbeat_s"] until the job ends.
  3. with WorkerLock(scratch_root): sweep_before = sweep(scratch_root) (reported in the result; log.note("job", ...)).
  4. token = token or resolve_token(); client = client_factory() if given else httpx.Client(timeout=10.0), wrapped when
     spec["wire_audit"] is true: the worker imports scripts.exit_check.CountingTransport (ImportError -> JobError
     "wire audit needs a repo checkout"), and builds the client over CountingTransport(httpx.HTTPTransport()).
  5. insp = scan.inspect_all([subject target] + reference targets, log, client=client, endpoint=endpoint, token=token)
     (stages RESOLVE, HEADERS, META). Each Inspection must yield exactly one Card (selectors are in the targets).
  6. hello_disk = disk_usage(scratch_root). plan = fullplan.plan_attribution(LoadedModel(card, table, target) for
     subject and references, threshold_bytes=spec["plan"]["threshold_bytes"], host=socket.gethostname(),
     scratch_root=str(scratch_root), disk_free_bytes=hello_disk.free).
     plan.plan_id != spec.plan.plan_id or plan.bytes_cap != spec.plan.bytes_cap -> log.note("gate", format_full_plan(plan))
     then PlanMismatch(f"worker plan {plan.plan_id}/{plan.bytes_cap} != confirmed {..}/{..}") (0 weight bytes).
  7. hello_disk.free < plan.disk_bytes + JOB_PARAMS["disk_reserve_bytes"] -> DiskSpaceError(needed, free, root) (0 weight bytes).
  8. log.stage(FULL_DOWNLOAD); d = run_full_gate(plan, log, spec_confirmer(spec["confirmation"]), display=<stderr>);
     emit({"type": "gate", "decision": d.to_dict()}); not approved -> GateDeclined. log.grant(plan.plan_id,
     plan.grant_ranges(), plan.bytes_cap, stage=FULL_DOWNLOAD). scratch = ScratchDir.create(scratch_root,
     spec["job_id"], log). try: download_plan(plan, {i: insp[i].source}, scratch, log); log.stage(COMPUTE) (revokes the
     grant); attribution = attrib.attribute(plan, models, vocabs, ScratchProvider(scratch, plan, block_sizes))
     finally: report = scratch.purge(); log.note("purge", f"released {report.bytes_removed} weight bytes from disk;
     disk_resident={log.disk_resident} files={report.files_removed if not report.dir_absent else 0}"). The finally runs
     on every exception path (download error, compute error, BackendError from emit).
     report.ok false -> PurgeError (after the attempt, naming the dir).
  9. log.stage(PURGE); check: not (scratch_root / job_id).exists(), sweep(scratch_root, dry_run=True, only_job=job_id)
     finds no orphan, log.disk_resident == 0 -> log.note("purge", "PURGE check: disk_resident=0 files=0 scratch=absent");
     otherwise PurgeError.
  10. result (plan.md 4.5): attribution (job None), purge report, disk {peak_bytes: log.disk_peak, bytes_written,
      bytes_removed, resident_after, free_before: hello_disk.free, free_after: disk_usage(...).free}, totals, n_events =
      len(log.events), stage_s from stage_start timestamps, wall_s, rss_peak_bytes (resource.getrusage(RUSAGE_SELF).
      ru_maxrss * 1024 on Linux, as-is on macOS), wire (CountingTransport: n_requests, body_bytes, hosts sorted, and
      the per-request {path, range} list as "requests") or None, git_commit and scout_version, sweep_before.
  11. ScratchProvider.tensor: raw = scratch.read(model, name); r = the FullRead of that tensor; arr =
      dequant.decode(raw, r.dtype, r.shape, out="float32"); FP8 -> multiply by the decoded scale tensor
      (roles_by_block gate_scale/up_scale; dequant.apply_scale with block_sizes[model]); returns (out, in) or (n,).
      rows: decode_rows on the embedding.
  12. worker.main: prints hello first for jobs; runs run_job with emit writing protocol lines to stdout (flush each);
      on success emits result then bye 0 and returns 0; on ScoutError e emits {"type": "error", "error": {"type",
      "message", "exit_code"}, "purge": report or None} then bye e.exit_code and returns it; on any other exception exit
      code 1 likewise. hello/sweep/audit subcommands print one JSON line and return 0. Logs of human text go to stderr.
acceptance:
  tests:
    - "fixtures: T313 local repos (BASE, CONTROL, GGUF Q4_K of derive(BASE), FP8 of derive(BASE), TE pipeline of derive(TE_BASE) + TE_BASE st repo); client plans built with T310 from Cards scanned into a tmp dir; specs via T315 make_spec with gate_threshold_bytes 0 and an exact cli-flag decision"
    - "test_run_job_gguf_subject: InProcessBackend-free direct call run_job(spec, emit=collector) with subject GGUF, refs BASE and CONTROL -> result attribution: BASE 16/16 attributed, CONTROL 0; purge report ok; scratch root audit 0 files; totals.weight within [bytes_planned, bytes_cap]; events contain the COMPUTE purge note before the PURGE check note; exactly 1 gate message via job-spec"
    - "test_run_job_fp8_and_te: FP8 subject vs BASE -> 16/16; TE pipeline subject '#text_encoder' vs TE reference -> 12/12, other_stacks has the vision stack"
    - "test_plan_mismatch_zero_weight: spec with plan_id altered -> PlanMismatch; 0 weight bytes; no scratch dir created"
    - "test_spec_cap_widened_refused: spec.plan.bytes_cap + 1 (and the confirmation bytes_confirmed matching it) -> PlanMismatch, 0 weight bytes"
    - "test_disk_space: disk_usage stub with free = disk_bytes -> DiskSpaceError, 0 weight bytes"
    - "test_purge_on_compute_error: monkeypatch attrib.attribute to raise -> error propagates, scratch dir absent, purge note emitted, audit 0 files"
    - "test_broken_pipe_purges: emit raises BrokenPipeError after the first FULL_DOWNLOAD fetch event -> BackendError; scratch dir absent afterwards"
    - "test_worker_main_local_backend: T315 LocalBackend (default argv, real subprocess) + run_job_via on the GGUF subject job -> succeeded, n_ingested == result n_events, client log totals.weight == worker totals.weight"
    - "test_inprocess_backend: T315 InProcessBackend with FakeHub hub targets (write repos into FakeHub, pinned shas) -> succeeded"
    - "test_hello_sweep_audit_cli: `python -m scout.jobs.worker hello --scratch-root tmp` prints one hello JSON with params_digest; sweep/audit print reports"
    - "test_worker_lock_serial: two concurrent run_job calls on the same scratch root -> the second waits for the first (lock_wait monkeypatched; both succeed, timestamps ordered)"
  commands:
    - pytest -q tests/test_jobs_runner.py
    - pytest -q
out_of_scope:
  - the client orchestration and Card write (T317); CLI wrappers (T319)
