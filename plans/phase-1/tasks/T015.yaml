id: T015
title: Exit check runner with independent wire counting (CountingTransport), pins file, network-marked test
depends_on: [T012, T013, T016]
files:
  - scripts/exit_check.py
  - exit/pins.json
  - tests/test_exit_network.py
  - tests/test_exit_check_offline.py
route: opus
spec_complete: true
interface: |
  exit/pins.json (committed as):
    {"Qwen/Qwen3-8B": "UNPINNED", "Qwen/Qwen3-30B-A3B": "UNPINNED", "Qwen/Qwen-Image": "UNPINNED"}
  scripts/exit_check.py:
    class CountingTransport(httpx.BaseTransport):
        def __init__(self, inner: httpx.BaseTransport) -> None
        records: list[dict]     # {method,url,orig_path,range,status,location,body_bytes}; guarded by a lock
        def handle_request(self, request: httpx.Request) -> httpx.Response
    def run(pins: dict[str, str], out_dir: Path, *, endpoint: str | None = None,
            inner_transport_factory: Callable[[], httpx.BaseTransport] = httpx.HTTPTransport,
            expectations: dict[str, Callable[[TargetResult], list[Check]]] | None = None,   # default DEFAULT_EXPECTATIONS
            budget_s: float = 10.0) -> list[Check]
    def main(argv: list[str] | None = None) -> int
      # flags: --pins PATH (default <repo>/exit/pins.json), --out DIR (default: tempfile.mkdtemp()), --budget-s FLOAT (default 10.0)
  tests/test_exit_network.py:
    ROOT = Path(__file__).resolve().parents[1]
    @pytest.mark.network
    def test_exit_check(): subprocess.run([sys.executable, str(ROOT/"scripts"/"exit_check.py"), "--pins", str(ROOT/"exit"/"pins.json")], cwd=ROOT).returncode == 0
behavior: |
  1. CountingTransport.handle_request: resp = inner.handle_request(request). Wrap resp.stream in a SyncByteStream that
     yields the inner chunks and adds len(chunk) to this record's body_bytes as they are yielded (bytes the client never
     consumes are not counted, matching the ByteLog definition). Return a new httpx.Response with the same status, headers,
     stream and extensions. The record's orig_path:
       - URL path matching "/{owner}/{name}/resolve/{sha}/{path}" -> that path (unquoted);
       - otherwise, if this URL equals a Location seen in an earlier 3xx record -> that record's orig_path;
       - else None.
     location = the resolved absolute Location header for 3xx, else None. range = request.headers.get("range").
  2. run: one CountingTransport per target, created from inner_transport_factory(). client_factory = lambda:
     httpx.Client(transport=counting, timeout=10.0). make_server(port=0, out_dir=out_dir, endpoint=endpoint,
     client_factory=client_factory) runs in a daemon thread. Per (repo, sha) in pins order: target f"{repo}@{sha}";
     t0 = monotonic; POST /api/scans; poll every 0.1 s until done/error or 60 s; elapsed = monotonic - t0. The control
     requests to the local server use a separate plain httpx.Client (not counted). Then GET with since=0 for all events,
     load the cards under out_dir/repo_slug(repo)/sha/ via load_card, build a TargetResult (T016) with wire = counting.records,
     and extend checks with common_checks(r, budget_s) + expectations[repo](r) (an unknown repo gets only the common checks).
     Shut the server down at the end.
  3. main: if any pin value does not match ^[0-9a-f]{40}$, print "pins not set: run `scout resolve <repo>` and commit
     exit/pins.json" and return 2. Otherwise print a table with one row per Check: target | check | expected | actual |
     PASS/FAIL, then "EXIT CHECK: PASS" iff all ok, else "EXIT CHECK: FAIL"; return 0 iff all ok. When run as a file,
     insert the repo root into sys.path (for `scout` and `scripts.exit_expectations`).
  4. After a real run, the operator appends to plans/phase-1/log.jsonl a line with step "EXIT", the pins, hostname and the
     full stdout (plan.md §2 phase status rule). The script prints a one-line JSON summary {"hostname","pins","passed","failed"}
     as its last stdout line to make that easy.
acceptance:
  tests:
    - "tests/test_exit_check_offline.py uses FakeHub: inner_transport_factory=hub.transport, endpoint=HUB"
    - "test_offline_pass: pins={'org/dense': 'a'*40} on a write_dense_repo(n_shards=2) FakeHub repo, expectations={'org/dense': lambda r: []} -> every common Check (C1..C11) ok; C10 saw >= 2 safetensors records via the redirect mapping"
    - "test_unlogged_read_fails_c11: monkeypatch scout.hub.HubSource.read_file to also do an unlogged self.client.get(<the config.json resolve url>) and read its body -> C11 not ok, everything else still runs"
    - "test_range_ignored_fails: inject('ignore_range') on a shard -> C1 not ok (status error) and the overall result is FAIL"
    - "test_main_unpinned: main(['--pins', <tmp file with UNPINNED>]) == 2"
    - "tests/test_exit_network.py is deselected by default (pytest -q reports it as deselected)"
  commands:
    - pytest -q tests/test_exit_check_offline.py
    - pytest -q
    - "at EXIT only (network): scout resolve Qwen/Qwen3-8B; scout resolve Qwen/Qwen3-30B-A3B; scout resolve Qwen/Qwen-Image -> write exit/pins.json -> python scripts/exit_check.py --pins exit/pins.json -> append the evidence to log.jsonl"
