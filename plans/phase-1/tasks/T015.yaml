    - "test_target_set_renamed: main with 'Qwen/Qwen3-8b' (wrong case) instead of 'Qwen/Qwen3-8B' -> 1"
    - "test_endpoint_env_refused: monkeypatch HF_ENDPOINT='https://mirror.example.com' -> main([...valid 3-repo pins...]) == 1 and no server started"
