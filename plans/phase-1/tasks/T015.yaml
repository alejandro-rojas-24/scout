    - "test_summary_line: the last stdout line of a (monkeypatched run) main parses as JSON with keys endpoint, budget_s == 10.0, hosts, git_commit, git_dirty, hostname"
    - "test_transport_per_target: pins with two FakeHub repos 'org/a' and 'org/b' (distinct file names, expectations for both) -> no wire record of target A (any URL containing '/org/a/' or an orig_path of org/a's files) appears in target B's TargetResult.wire and vice versa; the two CountingTransport instances are distinct objects; make_server was called exactly twice (spy) with distinct client_factory objects, and the first server's shutdown() was called before the second make_server call"
    - "test_run_c0: run(pins={'org/a':'a'*40}, expectations={'org/b': ...}) returns exactly one Check, C0, not ok"
