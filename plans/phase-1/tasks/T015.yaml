    - "test_offline_pass: pins={'org/dense': 'a'*40} on a write_dense_repo(n_shards=2) FakeHub repo added with meta_redirect='relative307', endpoint=HUB, allowed_hosts={'hub.test','cdn.test'}, expectations={'org/dense': lambda r: []} -> C0 and every common Check (C1..C12) ok; C10 saw >= 2 safetensors records via the absolute-Location mapping; C11 includes the 18-byte relative-307 bodies"
    - "test_target_set_missing: main(['--pins', <file with only 2 of the 3 required repos, 40-hex values>]) == 1; output contains 'C0 target set'; no server started (monkeypatch make_server to raise if called)"
