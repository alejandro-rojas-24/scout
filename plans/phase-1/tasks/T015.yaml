    - pytest -q tests/test_exit_check_offline.py
    - pytest -q
    - pytest -q tests/test_pin_exit.py
    - "at EXIT only (network): python scripts/pin_exit.py --pins exit/pins.json (append its JSON line to log.jsonl, commit the pins) -> python scripts/exit_check.py --pins exit/pins.json -> append the evidence to log.jsonl"
out_of_scope:
  - changing expected constants to make the check pass (a FAIL goes to the human)
  - browser automation (E5 is a manual check)
  - expectation logic (T016)
  - any fallback target or flag to select alternative expectations (replacing a target is a human decision + plan revision)
decisions:
  - "D1 orig_path (coordinator, from the T016 review): orig_path is the FULL unquoted URL path of the originating resolve request, /{owner}/{name}/resolve/{sha}/{file} (unquote(urlsplit(url).path), query dropped), never the bare file name. Redirect hops inherit it through a map from each 3xx record's resolved absolute Location (request.url.join(Location)) to its orig_path, so chains (resolve -> CDN/Xet -> ...) and relative Locations (FakeHub relative307) map back. The Hub API call /api/models/{repo}/revision/{pin} keeps orig_path None. test_c10_passes_on_real_counting_records feeds real CountingTransport records from a FakeHub run through T016 common_checks and asserts that every C10 Check passes. It also asserts that bare file-name orig_paths would fail C10."
  - "D2 CountingTransport is a transport wrapper (httpx.BaseTransport), not an event hook. It returns a new httpx.Response whose stream is a SyncByteStream wrapper, which counts chunks as the client pulls them. close() is forwarded to the inner stream, and CountingTransport.close() closes the inner transport. HubSource accepts the client (no response hooks; test_counting_transport_is_not_an_event_hook)."
  - "D3 The record is appended (under the lock) BEFORE the inner transport is called. A transport exception therefore leaves a record with status None and body_bytes 0, and the exception propagates. C12 still sees the attempted host, and T016's fail-closed _is_2xx treats the None status as 2xx."
  - "D4 _scan_target wire = counting.snapshot(), a copy of the records taken under the lock after the server shuts down. A scan thread left running after a timeout cannot mutate the TargetResult later."
  - "D5 (amended per orchestrator follow-up 5) Results handoff: no module global. _run_with_results(pins, out_dir, **same kwargs as run) -> (checks, results) does the work. run() is a thin wrapper that returns [0], so its interface is unchanged. main() calls _run_with_results and takes the summary's sorted distinct wire hosts from the returned TargetResults."
  - "D6 Polling: each poll uses since=<last seen seq> (since is a seq, not an index). The clock stops when status == 'error', or when status == 'done' and views is not None. After 60 s the status becomes 'timeout after 60 s (...)'. Collection afterwards pages since=0 -> since=last seq until a poll returns no events (POLL_EVENTS_MAX). final = that last (empty-page) GET response. It carries the same status/totals/views."
  - "D7 Exceptions in the control path (POST not 202, malformed JSON, connection errors) are caught inside _scan_target. They become status 'runner error: <Type>: <msg>' (C1 FAIL), and the run continues with the next target. Server shutdown/server_close/join always run in finally. The server thread starts before the try, so shutdown() can never block on a serve_forever that never ran. The control client is a separate httpx.Client(trust_env=False), so env proxies never touch the 127.0.0.1 traffic. Overlap note (follow-up 6): server.shutdown() stops the HTTP server, not a running daemon scan thread. If a target hits the 60 s SCAN_TIMEOUT_S, its scan can keep running while the next target scans. That target already has a C1 FAIL (the phase stays open), and each target has its own CountingTransport and server, so its wire records never leak into the next target. Scans can therefore overlap only after a C1 FAIL."
  - "D8 Cards are loaded from out_dir/repo_slug(repo)/sha/*.card.json (sorted), using scout.card.load_card and repo_slug. parquet path = json dir / card['tensors_parquet']. If a card fails to load, its json path is still listed and the card is skipped, so C6's equal-count check fails (fail closed). An exception raised by an expectation function becomes one failing 'expectations' Check."
  - "D9 main ordering: argparse (errors exit 2; there is no --budget-s or --endpoint) -> HF_ENDPOINT check (an exact match, ignoring one trailing '/', is allowed) -> load pins (unreadable or not a str->str object: message + return 1) -> C0 -> 40-hex check (return 2). The JSON summary line is printed only when run() actually ran, i.e. not on the C0/endpoint/unpinned early exits, which run no scans and produce no evidence. The table has a header row 'target | check | expected | actual | result'. --out defaults to tempfile.mkdtemp(prefix='scout-exit-'), and its path is printed to stderr so stdout stays table + verdict + JSON."
  - "D10 _git_info runs `git rev-parse HEAD` and `git status --porcelain` with cwd=ROOT and a 30 s timeout. An exception or non-zero exit yields 'unknown' / None. The tests monkeypatch subprocess.run, so the suite never invokes git."
  - "D11 pin_exit: the default run_cmd is subprocess.run(check=True, capture_output=True, text=True, cwd=ROOT, env=os.environ minus HF_ENDPOINT, plus GIT_TERMINAL_PROMPT=0) for both commands. cwd=ROOT lets `python -m scout` import without an install. GIT_TERMINAL_PROMPT=0 makes a gated or missing repo fail instead of prompting. CalledProcessError and OSError -> 'PIN ERROR ...' + return 1, and nothing is written. SHAs are checked with re.fullmatch. git_main_sha returns '' on empty output. The pins file is written via mkstemp in the same dir + os.replace (indent=2, sort_keys, trailing newline). exit/pins.json is committed in that same format with the three UNPINNED values."
  - "D12 (amended per orchestrator follow-up 1) Proxy: the default inner_transport_factory is now default_inner_transport() (not bare httpx.HTTPTransport, which ignores proxy env when passed as a transport). It returns _EnvProxyTransport, which picks per request URL an httpx.HTTPTransport(proxy=_env_proxy_for(url)), cached per proxy value. _env_proxy_for uses urllib.request.getproxies_environment() (scheme proxy, else all_proxy; lowercase vars win, as in urllib) and returns None when urllib.request.proxy_bypass_environment(host) is true (NO_PROXY), so NO_PROXY is honoured per host (huggingface.co vs *.hf.co). It sits UNDER CountingTransport, so wire records carry origin URLs and C12 checks origin hosts, never the proxy. The EXIT summary line gains 'proxy': the proxy hostname used for https://huggingface.co, or null. Tests: test_default_transport_uses_env_proxy_and_wire_has_origin_hosts and test_default_transport_honours_no_proxy (fake HTTPTransport), plus test_summary_fail_and_hosts (proxy == 'proxy.test'). The reviewer probe t015_probe_proxy.py in this container gets ProxyError 403 from the egress proxy (plan D3), and the record still shows host huggingface.co."
  - "D13 Offline rehearsal coverage beyond the listed acceptance: test_summary_fail_and_hosts (a real FakeHub run through main's summary path; hosts == ['cdn.test','hub.test']), test_counting_transport_counts_consumed_bytes_only, test_committed_pins_file_is_unpinned, pin_exit HF_ENDPOINT / default-run_cmd env tests."
  - "D14 (follow-up 2) Sparse rehearsal: test_sparse_rehearsal_real_expectations[Qwen/Qwen3-8B, Qwen/Qwen3-30B-A3B] builds full-size header-only replicas: a real safetensors header is written, then the file is truncated to full size (sparse), in 4 shards with an index. A per-instance FakeHub _cdn replacement serves only the requested Range from disk (fakehub.py itself is untouched). Each repo runs through _scan_target, then common_checks + the REAL DEFAULT_EXPECTATIONS E1/E2, and the test asserts 0 failures. Both run in about 2.5 s together, so both are kept. Qwen-Image (E3) is not rehearsed: it needs a diffusers pipeline replica, which is out of scope here."
  - "D15 (follow-up 3) test_main_fail_path runs main() on a real failing FakeHub run (ignore_range on a shard, routed through a monkeypatched _run_with_results that keeps main's fixed endpoint/budget asserts). It asserts rc 1, 'EXIT CHECK: FAIL', a C1 FAIL row, and a final JSON line with failed > 0."
  - "D16 (follow-up 4) test_header_overread_fails_c10 monkeypatches HubSource._get so the header read (Range request at start == 8) asks for one byte past 8+header_len. A patch at read_range level would instead be refused by ByteLog.preflight (weight byte) before any request, leaving no wire evidence. The over-long 206 body is logged by HubSource ('cap exceeded') and the scan errors. The test asserts the Range-within-header C10 check fails and C11 (wire bytes == ByteLog bytes) still passes."
  - "D17 (follow-up 6) pin_exit adds 'git_url_insteadof' to the PIN evidence line: the stripped output of run_cmd(['git','config','--get-urlmatch','url.insteadOf','https://huggingface.co']). It is '' when git exits 1 (no rule, CalledProcessError). An OSError -> PIN ERROR, return 1, nothing written. It runs after all pins agree and before the file is written. Test: test_insteadof_recorded."
invariants_touched: [1, 2, 6]

