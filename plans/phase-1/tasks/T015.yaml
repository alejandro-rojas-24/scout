behavior: |
  1. CountingTransport.handle_request: resp = inner.handle_request(request). Wrap resp.stream in a SyncByteStream that
     yields the inner chunks and adds len(chunk) to this record's body_bytes as they are yielded (bytes the client never
     consumes are not counted, matching the ByteLog definition). Return a new httpx.Response with the same status, headers,
     stream and extensions. The record's orig_path:
       - URL path matching "/{owner}/{name}/resolve/{sha}/{path}" -> that path (unquoted);
       - otherwise, if this URL equals a Location seen in an earlier 3xx record -> that record's orig_path;
       - else None.
     location = the resolved absolute Location header for 3xx, else None. range = request.headers.get("range").
  2. run: targets are scanned STRICTLY SEQUENTIALLY. Each target gets its OWN server and its OWN fresh CountingTransport,
     via _scan_target (see interface). For each (repo, sha) in pins order:
       - counting = CountingTransport(inner_transport_factory())
       - client_factory = functools.partial(_client_for, counting). This binds the transport at creation time, with no
         shared holder and no closure over a loop variable.
       - server = make_server(port=0, out_dir=out_dir, endpoint=endpoint, client_factory=client_factory), run in a daemon
         thread
       - target = f"{repo}@{sha}"
     After the scan reaches done or error and the results are collected, call server.shutdown() and server.server_close()
     and join the server thread, in a finally block (so it also runs on timeout or exception), BEFORE the next target's
     CountingTransport or server is created. Scans never overlap. TargetResult.wire = counting.records of that target only.
     t0 = monotonic; POST /api/scans; poll every 0.1 s until done/error or 60 s; elapsed = monotonic - t0. The control
     requests to the local server use a separate plain httpx.Client (not counted). Then GET with since=0 for all events,
     load the cards under out_dir/repo_slug(repo)/sha/ via load_card, build a TargetResult (T016) with wire = counting.records,
     and extend checks with common_checks(r, budget_s, allowed_hosts=allowed_hosts, expected_endpoint=endpoint) + expectations[repo](r).
     Each per-target server is shut down inside _scan_target.
  2a. run() FIRST computes c0 = check_target_set(pins, expectations). If not c0.ok it returns [c0] immediately: no server,
     no scans. Otherwise the result list starts with c0. There is no code path that scans a repo without an expectation
     function.
  3. main: if os.environ.get("HF_ENDPOINT") is set and != HF_ENDPOINT_URL (ignoring one trailing "/"): print
     f"HF_ENDPOINT={value} is not allowed for the exit check" and return 1. main always calls run(endpoint=HF_ENDPOINT_URL,
     allowed_hosts=ALLOWED_HOSTS, budget_s=BUDGET_S). Load pins. c0 = check_target_set(pins, DEFAULT_EXPECTATIONS). If not ok: print the C0 row and
     "EXIT CHECK: FAIL (target set must be exactly: ...)", then return 1. Then, if any pin value does not match ^[0-9a-f]{40}$, print "pins not set: run `scout resolve <repo>` and commit
     exit/pins.json" and return 2. Otherwise print a table with one row per Check: target | check | expected | actual |
     PASS/FAIL, then "EXIT CHECK: PASS" iff all ok, else "EXIT CHECK: FAIL"; return 0 iff all ok. When run as a file,
     insert the repo root into sys.path (for `scout` and `scripts.exit_expectations`).
  3a. pin_exit.main: for each target in sorted(DEFAULT_EXPECTATIONS): s = scout_sha(repo), g = git_main_sha(repo). If
     either is not 40-hex, or s != g: print f"PIN MISMATCH {repo}: scout={s} git_ls_remote={g}" and return 1 WITHOUT
     writing the pins file (and a failing run_cmd, e.g. CalledProcessError, also returns 1 without writing). Otherwise
     write {repo: s} (json indent=2, sorted keys) atomically. scout_sha runs the subprocess with env = os.environ minus
     HF_ENDPOINT, and pin_exit.main returns 1 up front if HF_ENDPOINT is set to anything other than HF_ENDPOINT_URL.
     After writing, print one JSON line {"step":"PIN","hostname":
     socket.gethostname(),"repos":{repo:{"scout":s,"git_ls_remote":g}}} and return 0.
  4. After a real run, the operator appends to plans/phase-1/log.jsonl a line with step "EXIT", the pins, hostname and the
     full stdout (plan.md §2 phase status rule). The script prints a one-line JSON summary as its last stdout line:
     {"step":"EXIT","hostname","pins","passed","failed","endpoint": HF_ENDPOINT_URL,"budget_s": BUDGET_S,
      "hosts": sorted distinct wire hosts across all targets,
      "git_commit": `git rev-parse HEAD` output or "unknown", "git_dirty": bool(`git status --porcelain` output) or null}
     (git is run via subprocess in the repo root; failure yields "unknown"/null, never an exception).
     The hostname must equal the hostname of the PIN line in log.jsonl; if not, the run is invalid and is repeated on the
     pinning host (plan.md §2).
