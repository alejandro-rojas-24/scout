id: T009
title: Card v0 - build, atomic write (JSON + Parquet), load
depends_on: [T002, T006, T007, T008]
files:
  - scout/card.py
  - tests/test_card.py
  - tests/helpers/cards.py
route: opus
spec_complete: true
interface: |
  scout/card.py:
    SCHEMA_VERSION = "card.v0"
    STATS_SLOTS: tuple[str, ...] = ("tensor_stats", "spectral_topk", "sigma_curves", "tokenizer_minhash", "attribution")
    PARQUET_SCHEMA: pyarrow.Schema   # exactly the columns and types of plan.md section 4.3, in that order
    NULL_STAT_COLUMNS: tuple[str, ...] = ("stat_mean", "stat_std", "stat_fro_norm", "stat_spectral_topk", "stat_sigma_curve")

    @dataclass(frozen=True)
    class CardPaths:
        json_path: pathlib.Path; parquet_path: pathlib.Path

    @dataclass(frozen=True)
    class BuiltCard:
        card: dict; table: pyarrow.Table; paths: CardPaths    # paths are the target locations (not yet written)

    def repo_slug(repo: str) -> str
    def component_slug(component: str | None) -> str
    def card_paths(out_dir: pathlib.Path, repo: str, revision_sha: str, component: str | None) -> CardPaths
    def build_card(*, source: Source, component: str | None, pipeline: PipelineInfo | None,
                   config: ConfigInfo, model_card: ModelCardInfo, headers: list[SafetensorsHeader],
                   file_sizes: dict[str, int | None], index_path: str | None, index_total_size: int | None,
                   structure: Structure, log: ByteLog, scanned_at: str, elapsed_s: float,
                   out_dir: pathlib.Path) -> BuiltCard
    def write_card(built: BuiltCard) -> CardPaths
    def load_card(json_path: pathlib.Path) -> tuple[dict, pyarrow.Table]
behavior: |
  1. repo_slug: for "local:<abs>" -> "local__" + re.sub(r"[^A-Za-z0-9._-]", "_", abs.strip("/")); otherwise repo.replace("/", "__").
     component_slug(None) = "_model", else the component name.
     card_paths = out_dir/repo_slug/revision_sha/f"{slug}.card.json" and f"{slug}.tensors.parquet".
  2. build_card produces a dict with EXACTLY the keys of plan.md section 4.2, in that order:
     - key {repo: source.repo, revision_sha, component}
     - source {kind, requested_revision, revision_kind, local_path, endpoint}
     - scan {scanned_at, scout_version: scout.__version__, elapsed_s}
     - model_card = model_card.to_dict(); config = config.to_dict(); pipeline = pipeline.to_dict() or None
     - weights: format "safetensors", index_path, index_total_size; files sorted by path, each
       {path, size_bytes: file_sizes.get(path), header_len, data_bytes, n_tensors, metadata};
       n_tensors, params_total, params_by_dtype (from structure); tensor_bytes_total = sum nbytes
     - structure = structure.to_dict()
     - stats = {slot: None for slot in STATS_SLOTS}
     - fetch_log = log.to_card_dict() (snapshot at build time)
     - tensors_parquet = parquet_path.name
     The card must json.dumps without a custom encoder.
  3. Table rows: one per tensor across all headers, sorted by (file, data_begin). Columns per PARQUET_SCHEMA:
     repo, revision_sha, component ("" if None), name, collapsed_name/stack_prefix/block_index/expert_index from
     structure.places[name], file, dtype, shape (list), numel, nbytes, data_begin, data_end; all stat_* are null.
     Build it with pyarrow.Table.from_pydict(..., schema=PARQUET_SCHEMA). Then replace the schema metadata with
     {b"schema_version", b"repo", b"revision_sha", b"component"} (component "" for None).
  4. write_card: mkdir parents. Temp files are created with tempfile.mkstemp(dir=json_path.parent, prefix=f".{name}.",
     suffix=".tmp") so concurrent writers (two server threads scanning the same target) never share a temp name.
     Write JSON (indent=2, ensure_ascii=False, UTF-8) to its temp file, then os.replace. Write parquet
     (pyarrow.parquet.write_table, compression "zstd") to its own mkstemp temp file, then os.replace.
     Parquet first, then JSON, so a JSON file never points at a missing parquet. On any exception, remove the temp
     files and re-raise. Write nothing else, anywhere.
  5. load_card: json.load plus pyarrow.parquet.read_table(json_path.parent / card["tensors_parquet"]). Raise ScoutError if
     schema_version != "card.v0".
decisions:
  - "PARQUET_SCHEMA list columns (shape, stat_spectral_topk, stat_sigma_curve) use a child field named 'element' (pa.list_(pa.field('element', t))). pyarrow renames list children to 'element' on a Parquet round trip, so with 'item' the loaded table would not equal the built one. The arrow types are otherwise exactly plan 4.3."
  - "Columns not marked '(nullable)' in plan 4.3 are nullable=False in PARQUET_SCHEMA; stack_prefix, block_index, expert_index and all stat_* are nullable. Parquet preserves this on round trip."
  - "Row sort key is (file, data_begin, data_end, name). The tie-breakers only matter for zero-size tensors that share data_begin, and they keep the order deterministic."
  - "card_paths raises ScoutError if the repo slug, revision_sha or component slug is '', '.', '..' or contains '/', '\\' or NUL. Component names come from model_index.json keys, which a hostile repo controls, so without this check a key such as '../x' could write outside out_dir. load_card applies the same check to card['tensors_parquet']."
  - "build_card raises ScoutError if structure.n_tensors != the total tensor count across headers, or if a header tensor is missing from structure.places. Without these checks the Card and the Parquet could silently disagree."
  - "scan.elapsed_s is coerced with float(). metadata in weights.files is copied into a new dict."
  - "(Orchestrator decision, review round 1, revised in escalation round 3.) write_card fsyncs each temp file before os.replace. Before any write it records json_existed = paths.json_path.exists(). On any exception (BaseException) it removes the temp files that have not been moved into place. If the JSON write or replace fails after the Parquet was put in place, write_card removes that Parquet only if not json_existed and not paths.json_path.exists(). So a failed first write leaves no Card files behind. A failed rescan keeps the existing JSON and the new Parquet: for a given key (repo, sha, component) the table is deterministic from the same headers, so the existing JSON still points at a valid, matching Parquet and load_card keeps working. In the single-writer case, a JSON file never points at a missing Parquet."
  - "(Orchestrator decision, review round 1) build_card first serializes and encodes the card with json.dumps(card, indent=2, ensure_ascii=False).encode('utf-8'). A UnicodeError there, for example from a lone surrogate in config.raw, a README field or safetensors __metadata__, becomes ScoutError('card contains unencodable text: ...'). The Parquet table build is wrapped so that UnicodeError and pa.ArrowException become ScoutError, which covers a lone surrogate in a tensor name. BuiltCard keeps its interface fields (card, table, paths). write_card encodes the same card again, which is deterministic, BEFORE mkdir or any temp file. After the first os.replace the only remaining failures are IO errors. The JSON is written as those pre-encoded bytes."
  - "(Escalation round 3) Known narrow window with concurrent FIRST writers of the same key: writer A places the Parquet, writer B places the same Parquet, A's JSON step fails and A sees no JSON yet, so it unlinks the Parquet. B then places its JSON, which points at a missing Parquet until the next successful write. This needs two simultaneous first scans of one key plus an IO failure in exactly one of them. load_card then raises FileNotFoundError (not a corrupt read), and a rescan repairs it. A lock or Card store is Phase 4 scope (Card cache/store is out_of_scope here)."
  - "Temp files keep mkstemp's 0600 mode. They are not chmod-ed to the umask, because reading the umask (os.umask set/restore) is not thread-safe. This tool is used by one person, and the server runs as the same user."
  - "load_card raises ScoutError if the JSON is not an object, if schema_version != card.v0, or if tensors_parquet is not a plain file name. OSError and JSON decode errors propagate unchanged."
  - "tests/helpers/cards.py::build_fixture_card reads model_index.json (if present) during RESOLVE and sets has_weights per component by trying select_weight_files. It uses scanned_at='2026-01-01T00:00:00Z' and elapsed_s=0.0 and only passes file_sizes for the selected shard files."
  - "Extra tests beyond the acceptance list: test_pipeline_component, test_atomic_json_failure_leaves_no_temp (os.replace of the JSON fails; asserts no tmp, JSON or Parquet remains), test_failed_rewrite_keeps_existing_card (write OK, then a rewrite whose JSON os.replace fails; load_card still returns the original card and table and exactly the 2 Card files remain), test_lone_surrogate_in_config_refused, test_lone_surrogate_in_tensor_name_refused, test_load_rejects_wrong_version, and in test_paths a '../evil' component that must be refused."
acceptance:
  tests:
    - "tests/helpers/cards.py: def build_fixture_card(root: Path, out_dir: Path, component: str | None = None) -> BuiltCard. It uses LocalSource + ByteLog (stages RESOLVE, HEADERS, META, REPORT) + select_weight_files/parse_index + read_header + parse_config/parse_model_card + analyze + build_card, with no scan.py. T011 reuses it."
    - "test_keys_exact: set(card) == the set from plan 4.2; key/weights/structure subkeys exact; stats values all None"
    - "test_parquet_schema: table.schema equals PARQUET_SCHEMA (ignoring metadata); rows == n_tensors; every stat column null_count == num_rows; metadata contains schema_version card.v0"
    - "test_paths: hub repo 'Org/M' + sha -> out/Org__M/<sha>/_model.card.json; a component 'vae' -> vae.card.json; local slug has no '/'"
    - "test_roundtrip: write_card then load_card gives an equal dict and an equal table"
    - "test_atomic: monkeypatch pq.write_table to raise -> no files left under out_dir (glob '**/*' has no files)"
    - "test_fetch_log_embedded: card['fetch_log']['totals']['weight'] == 0 and events non-empty, with counting 'http-body-bytes-yielded'"
    - "test_concurrent_write: 8 threads write_card the same BuiltCard at once -> no exception; final JSON and parquet load; no '*.tmp' files remain"
    - "test_only_card_files: after write_card, out_dir holds exactly 2 files"
  commands:
    - pytest -q tests/test_card.py
    - pytest -q
out_of_scope:
  - Card cache/store and dedup (Phase 4)
  - filling any stats slot
invariants_touched: [1, 2]
