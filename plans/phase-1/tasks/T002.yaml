id: T002
title: ByteLog, byte classification, error types
depends_on: [T001]
files:
  - scout/errors.py
  - scout/bytelog.py
  - tests/test_bytelog.py
route: opus
spec_complete: true
interface: |
  scout/errors.py:
    class ScoutError(Exception)                      # base; attribute exit_code: int = 1
    class WeightReadRefused(ScoutError)              # exit_code 5
    class ReadThresholdExceeded(ScoutError)          # exit_code 5; attrs requested:int, total:int, threshold:int
    class StageOrderError(ScoutError)
    class GatedRepoError(ScoutError)                 # exit_code 3
    class RepoNotFoundError(ScoutError)              # exit_code 3
    class RevisionMismatch(ScoutError)
    class NetworkError(ScoutError)                   # exit_code 4
    class RangeNotSupported(ScoutError)              # exit_code 4
    class HubAPIError(ScoutError)                    # exit_code 4; unexpected Hub API status or malformed body
    class HeaderError(ScoutError)
    class NoSafetensorsError(ScoutError)
    class AmbiguousWeightsError(ScoutError)
    class DuplicateTensorError(ScoutError)

  scout/bytelog.py:
    class Stage(enum.IntEnum): RESOLVE=1 HEADERS=2 META=3 SAMPLED_READ=4 FULL_DOWNLOAD=5 COMPUTE=6 COMPARE=7 REPORT=8 PURGE=9
    class ByteClass(str, enum.Enum): META="meta" HEADER="header" WEIGHT="weight"
    WEIGHT_EXTENSIONS: tuple[str, ...] = (".safetensors",".bin",".pt",".pth",".ckpt",".gguf",".h5",".msgpack",".onnx",".pb",".npz",".pkl")
    DEFAULT_THRESHOLD_BYTES: int = 64 * 1024 * 1024
    META_MAX_BYTES: int = 16 * 1024 * 1024      # reservation for reads of unknown length (API call, size-less files)
    COUNTING: str = "http-body-bytes-yielded"

    def classify_range(path: str, start: int, end_exclusive: int, header_len: int | None) -> dict[str, int]
        # returns {"meta":a,"header":b,"weight":c}, with a+b+c == end_exclusive-start

    @dataclass(frozen=True)
    class LogEvent:
        seq: int; ts: float; stage: str; event: str; source: str | None; path: str | None; url: str | None
        range: tuple[int, int] | None; status: int | None; bytes: int; bytes_by_class: dict[str, int]
        attempt: int; elapsed_ms: float; note: str | None; totals: dict[str, int]
        def to_dict(self) -> dict          # JSON-safe; range becomes list or None

    class ByteLog:
        def __init__(self, threshold_bytes: int = DEFAULT_THRESHOLD_BYTES,
                     on_event: Callable[[LogEvent], None] | None = None) -> None
        threshold_bytes: int
        @property current_stage -> Stage | None
        @property totals -> dict[str, int]           # copy
        @property events -> list[LogEvent]           # copy
        def events_since(self, seq: int) -> list[LogEvent]
        def stage(self, stage: Stage) -> LogEvent
        def set_header_len(self, path: str, header_len: int) -> None
        def header_len(self, path: str) -> int | None
        def preflight(self, path: str, start: int, end_exclusive: int) -> int     # returns a reservation id
        def release(self, reservation: int) -> None                               # idempotent
        @property reserved -> int                                                 # sum of open reservations
        def record(self, *, event: str, source: str | None, path: str | None, url: str | None,
                   start: int | None, nbytes: int, status: int | None, attempt: int = 1,
                   elapsed_ms: float = 0.0, note: str | None = None, release: int | None = None) -> LogEvent
        def note(self, event: str, note: str, path: str | None = None) -> LogEvent   # 0-byte events: error, refused, card_written
        def to_card_dict(self) -> dict   # {"counting": COUNTING, "threshold_bytes", "totals", "events": [e.to_dict()]}
behavior: |
  1. classify_range: let p = path.lower().
     - If p ends with ".safetensors": bytes in [0,8) are header; if header_len N is not None, bytes in [8, 8+N)
       are header and bytes >= 8+N are weight; if N is None, all bytes >= 8 are weight.
     - Else, if p ends with any other WEIGHT_EXTENSIONS entry: all bytes are weight.
     - Else: all bytes are meta (this includes "*.safetensors.index.json", "@api/revision" and README.md).
     Raise ValueError if start < 0 or end_exclusive < start.
  2. ByteLog is thread-safe: one threading.Lock guards seq, totals, events and header lens.
     seq starts at 1 and increments per event.
  3. stage(s): raise StageOrderError if current_stage is not None and s < current_stage. Otherwise set it and
     emit event "stage_start" with bytes 0. Calling it again with the same stage is allowed (no-op event
     still emitted).
  4. preflight(path, start, end): c = classify_range(path, start, end, self.header_len(path)).
     If c["weight"] > 0: emit a "refused" event with note f"weight bytes {c['weight']} in {path}[{start}:{end}]"
     and raise WeightReadRefused with the same text.
     Under the lock, atomically: t = totals.meta + totals.header + reserved. If t + (end-start) > threshold_bytes:
     emit a "refused" event with note
     f"threshold: requested={end-start} total={t} threshold={thr} disk=0 reason=non-weight read budget"
     and raise ReadThresholdExceeded(requested, t, threshold) with that message. Otherwise create a reservation of
     (end-start) bytes, keyed by an incrementing int id, and return the id.
     Preflight never records bytes. The weight check happens first and creates no reservation.
     release(id) removes the reservation if it is still open (unknown or already released ids are a no-op).
     Callers must release on every exit path (success via record(release=id), failure via release(id) in finally).
  5. record(...): the range is [start, start+nbytes), with start None treated as 0. Classify it with the
     header_len known at record time; add the result to totals; build a LogEvent with stage = current_stage.name
     (or "NONE" if no stage yet), ts = time.time(), bytes = nbytes, bytes_by_class = the classification,
     range = (start, start+nbytes) if start is not None else None, totals = a snapshot after the update.
     If release is not None, the reservation is removed in the same critical section as the totals update.
     event must be "fetch", "retry" or "error" (else ValueError). "error" with nbytes > 0 records the body bytes of a
     non-2xx response (callers use the pseudo-path "@error", so it is classified as meta). Append it and call on_event
     outside the lock.
     Exceptions raised by on_event propagate.
  6. note(event, note, path): event must be in {"error","refused","card_written"}; emits a 0-byte event.
  7. to_card_dict returns JSON-serializable data only.
decisions:
  - "ReadThresholdExceeded.__init__(requested, total, threshold, message=None): message defaults to the spec's threshold text; __reduce__ added so it pickles. Other errors use plain Exception(*args); exit_code is a class attribute (1 unless the spec says otherwise)."
  - "events_since(seq) returns events with seq strictly greater than seq (so events_since(0) is everything and polling with the last seen seq gives only new events)."
  - "totals always has exactly the three keys meta/header/weight; no aggregate key."
  - "preflight refused events (weight and threshold) are logged with source/url/range/status None, bytes 0 and path set. The threshold refusal event is appended in the same state-lock section as the budget check. The whole budget check runs under the emit lock (see next decision), so a slow on_event also delays preflight."
  - "REVISED at coordinator request (P4 validation: remote log ingest needs consecutive seq 1..n; matches T301's change to the P1 contract): on_event is called in strict seq order. There are two locks: a state threading.Lock and a separate emit threading.RLock. Lock order is always emit -> state. stage/preflight(budget)/record/note hold the emit lock from appending the event until on_event returns. The state lock is released before on_event runs, and read-only views (totals, events, reserved, header_len, current_stage) and set_header_len/release take only the state lock, so there is no lock-order inversion. Re-entrant calls from on_event on the same thread re-acquire the RLock without deadlock; a nested event gets the next seq and its callback starts before the outer one returns, so callbacks still start in strict seq order. Caveat: an on_event that blocks waiting for another thread that is itself calling record/note/stage/preflight on the same ByteLog will deadlock, so callbacks must not do that. If on_event raises, the event is already recorded and counted, and the emit lock is released."
  - "record raises ValueError for nbytes < 0 (validated before any state change, like the event-name check). path None is classified as meta (treated as '')."
  - "classify_range uses the header length as given; it does not validate header_len >= 0. The threshold budget counts meta + header + open reservations; weight bytes recorded honestly do not consume the non-weight budget."
  - "stage() accepts an int and coerces it via Stage(stage)."
acceptance:
  tests:
    - "classify_range table: safetensors with N=None: [0,8)->header 8, [0,16)-> header 8 + weight 8; with N=100: [8,108) all header, [100,120) -> header 8 + weight 12; model.bin [0,4) -> weight 4; config.json -> meta; model.safetensors.index.json -> meta; MODEL.SAFETENSORS is treated case-insensitively"
    - "preflight raises WeightReadRefused for ('a.safetensors', 8, 9) before set_header_len, and does not after set_header_len(…, 1); a refused event is logged and totals are unchanged"
    - "threshold: ByteLog(threshold_bytes=100); record 90 meta bytes; preflight of 11 bytes raises ReadThresholdExceeded with requested/total/threshold attrs; preflight of 10 passes"
    - "reservation race: ByteLog(threshold_bytes=400); 8 threads start behind a threading.Barrier and each call preflight('c.json', 0, 100) without releasing -> exactly 4 succeed, 4 raise ReadThresholdExceeded; reserved == 400; after release of all ids reserved == 0"
    - "record(release=id) frees the reservation; release is idempotent"
    - "stage order: HEADERS then RESOLVE raises StageOrderError; RESOLVE, HEADERS, META, REPORT succeeds"
    - "thread safety: 8 threads x 1000 record() calls of 1 meta byte -> totals.meta == 8000, seqs unique and contiguous 1..N"
    - "record(event='error', path='@error', nbytes=10) adds 10 to totals.meta; record(event='bogus') raises ValueError"
    - "record of a mixed range counts weight honestly (weight > 0 in totals); record never raises on weight"
    - "on_event receives every event in order; to_card_dict round-trips through json.dumps"
  commands:
    - pytest -q tests/test_bytelog.py
    - pytest -q
out_of_scope:
  - any network or file IO
  - interactive confirmation (Phase 2 download gate)
