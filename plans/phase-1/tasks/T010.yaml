id: T010
title: Scan orchestration - intake for hub/local, sharded, multi-component, MoE, with staged log and atomic output
depends_on: [T005, T009]
files:
  - scout/scan.py
  - tests/test_scan.py
route: opus
spec_complete: true
interface: |
  scout/scan.py:
    @dataclass(frozen=True)
    class ScanResult:
        cards: list[CardPaths]; totals: dict[str, int]; elapsed_s: float; revision_sha: str; repo: str

    def parse_target(target: str) -> tuple[str, str, str | None]
        # ("local", abs_path, None) | ("hub", repo_id, revision_or_None)
    def make_source(target: str, log: ByteLog, *, client: httpx.Client | None = None,
                    endpoint: str | None = None, token: str | None = None) -> Source
    def scan(target: str, out_dir: pathlib.Path, log: ByteLog, *, client: httpx.Client | None = None,
             endpoint: str | None = None, token: str | None = None, max_workers: int = 8) -> ScanResult
behavior: |
  parse_target:
    1. If os.path.isdir(target) -> ("local", str(Path(target).resolve()), None).
    2. Else split on the LAST "@": repo, rev (rev None if there is no "@" or it is empty). repo must match
       scout.hub.REPO_RE, else ValueError(f"not a directory or owner/name[@rev]: {target}").
  scan:
    1. t0 = time.monotonic(); scanned_at = UTC now, ISO-8601 with "Z". log.stage(RESOLVE); source = make_source(...); source.resolve().
       files = {f.path: f.size}.
    2. Units: if "model_index.json" in files: pipeline = parse_model_index(source.read_file("model_index.json"))
       (ValueError -> ScoutError). For each component, in order: try select_weight_files(file list, comp.name)
       -> unit (comp.name, selection) and comp.has_weights = True. On NoSafetensorsError: has_weights False, and if
       any weight-extension file exists in that dir, add warning f"{name}: non-safetensors weights skipped" to that
       pipeline's warnings list (carried into each Card's structure.warnings). AmbiguousWeightsError propagates.
       If no component has weights -> NoSafetensorsError("pipeline has no safetensors components").
       If there is no model_index.json: one unit (None, select_weight_files(files, "")) with pipeline None.
    3. For each unit with index_path: raw = source.read_file(index_path); (shard_files, total) = parse_index(raw, subdir).
       Every shard must be in files, else ScoutError(f"index lists missing file {f}"). Units without an index have
       shard_files = [single_path] and total None. Still in RESOLVE.
    4. log.stage(HEADERS). Read every header of every unit concurrently: ThreadPoolExecutor(max_workers), submit
       read_header(source, f, files[f]) for all files, and collect with as_completed. On the first exception,
       cancel the pending futures, wait for the running ones, and re-raise.
    5. log.stage(META). model_card = parse_model_card(source.read_file("README.md")), read once.
       Per unit: cfg_path = "config.json" if subdir == "" else f"{subdir}/config.json";
       config = parse_config(source.read_file(cfg_path), cfg_path).
    6. Per unit: structure = analyze(all tensors of the unit's headers); append the pipeline warnings. If total is not None
       and sum nbytes != total, append warning f"index total_size {total} != tensor bytes {s}".
    7. log.stage(REPORT). Build ALL BuiltCards in memory first (elapsed_s = monotonic - t0 at build time). Then call write_card
       for each and log.note("card_written", str(json_path)) after each. If any write fails, delete the cards already written
       by this scan (both files), then re-raise.
    8. Return ScanResult(totals=log.totals, ...). Close the HubSource if scan created its client.
    9. On any exception before step 7, no file is created under out_dir. log.note("error", f"{type(e).__name__}: {e}") is
       emitted, then re-raise. Never catch WeightReadRefused/ReadThresholdExceeded to continue.
decisions:
  - "(Coordinator rule, from the T009 review) Rescan safety: before each write_card, scan records whether that Card's JSON already existed. If a write fails, scan deletes only the JSON and Parquet of Cards whose JSON did not exist before this scan. It never deletes Cards that were already there, which on a rescan of the same key were replaced through os.replace or left as they were. Tested by test_rescan_failure_keeps_preexisting_cards."
  - "Directory cleanup: before each write, scan records the directories that write_card's mkdir(parents=True) is about to create (the missing ancestors of json_path.parent, including out_dir and any of its parents that do not exist). On failure it rmdirs them deepest first, and only while they are empty. A pre-existing out_dir and unrelated files in it are never touched (test_write_failure_keeps_preexisting_out_dir), so out_dir is left as it was before the scan."
  - "A Card's files are registered for cleanup before its write_card call, so a write that fails partway is also removed. Known limit: a concurrent scan that creates the same key's JSON between this scan's exists() check and its failure would see that JSON deleted. This is accepted for a single-user tool."
  - "Hostile component names: right after parse_model_index (still in RESOLVE, before any further read), scan runs card_paths(out_dir, repo, sha, name) on EVERY component name, including ones without weights. It is side-effect free and raises ScoutError('unsafe component ...') for '', '.', '..' or names containing '/', '\\' or NUL. Component names are otherwise used only as repo-relative lookup keys: select_weight_files string matching, plus '<name>/config.json' and the index path, which Source.read_file serves only when they are in the resolved file list. scan never builds a filesystem path from them. Card paths come from card_paths alone."
  - "Header reads: one ThreadPoolExecutor(max_workers), with futures collected through as_completed. On the first exception scan cancels every pending future, calls shutdown(wait=True, cancel_futures=True) so that running reads finish, and re-raises the original exception. Shard paths are de-duplicated across units, and headers are reassembled per unit in shard_files order."
  - "Error note: log.note('error', f'{type(e).__name__}: {e}') is emitted for ANY exception in scan (BaseException), including one in step 7 (REPORT/write), not only before step 7. HubSource may already have noted the same terminal error, so the log can hold two error events for one failure. A failure in the note itself never masks the original exception."
  - "parse_model_index ValueError becomes ScoutError(str(e)) chained from the original. The pipeline's non-safetensors warning checks for weight-extension files directly in the component dir (same parent rule as select_weight_files). Pipeline warnings are appended after the analyzer's own warnings, followed by the index total_size warning. Structure is replaced through dataclasses.replace and never mutated."
  - "scanned_at uses UTC with microseconds: '%Y-%m-%dT%H:%M:%S.%fZ'. elapsed_s in each Card is monotonic() - t0 when that Card is built; ScanResult.elapsed_s is taken at return. out_dir is used as given, not made absolute, so CardPaths are exactly what card_paths builds."
  - "scan always calls source.close() in a finally block when the source has one. HubSource.close() closes only a client it created, so a caller's client is never closed. LocalSource has no close. scan passes the caller's client through unchanged and adds no hooks; HubSource itself rejects response hooks."
  - "parse_target: 'Org/M@' gives rev None, and rpartition splits on the LAST '@'. An empty target, a nonexistent absolute path, 'a/b/c' and '@main' all raise ValueError."
  - "Extra tests beyond the acceptance list: test_parse_target_dir, test_parse_target_bad, test_make_source, test_write_failure_removes_cards_of_this_scan, test_write_failure_keeps_preexisting_out_dir, test_rescan_failure_keeps_preexisting_cards, test_no_card_written_when_later_component_fails, test_hostile_component_name_refused, test_bad_model_index_is_scout_error, test_pipeline_non_safetensors_warning, test_pipeline_without_weights, test_index_missing_shard, test_index_total_size_mismatch_warns, test_scan_closes_owned_client. test_no_extra_files also resets tempfile.tempdir, so that TMPDIR actually takes effect."
  - "(Test follow-up) test_header_failure_cancels_pending_and_waits_for_running monkeypatches scout.scan.read_header (scan imports it by name) on a 6-shard local repo, with max_workers 1 and 2. A ThreadPoolExecutor worker whose read raised can pick up the next queued item before the main thread cancels, so the test does not assert that only the first shard started. It asserts: the exception object is the original one; every read started before scan raised had finished by then; at most max_workers+1 reads started; and no read starts after scan returns (checked again after 2x the sleep). With max_workers=2, the failing read waits until a sibling has started, so there is always a running read to wait for."
  - "(Test follow-up) Zero-weight checks use the helper _assert_zero_weight(totals, events, card_paths). It checks totals['weight'] == 0, every log event's bytes_by_class['weight'] == 0, and, for each Card, fetch_log.totals.weight == 0 plus every fetch_log event's weight == 0. test_scan_closes_owned_client keeps its name and checks both halves: the caller's client stays open and usable, and with no client given (httpx.Client monkeypatched to inject the FakeHub transport) the client scan's HubSource created is closed. test_scan_threshold asserts that FakeHub saw no requests at all, because the API listing's reservation is refused at preflight. test_scan_moe_partial_body_reset cuts off the first ranged read (8-byte prefix) after 4 bytes and asserts that the retry event has bytes_by_class {meta:0, header:4, weight:0}."
acceptance:
  tests:
    - "Hub tests use FakeHub + client=hub.client(), endpoint=HUB; local tests use tmp dirs; all offline"
    - "test_scan_dense_sharded_hub: write_dense_repo(n_shards=3) -> 1 card; n_tensors/params match the fixture; totals.weight == 0; totals.header == sum(8+N); every fakehub.cdn_reads range ends <= 8+N of its file; the stage_start order is RESOLVE,HEADERS,META,REPORT"
    - "test_scan_local_folder: same repo scanned as a local path -> revision_kind local-stat-hash, key.repo startswith 'local:', weight 0"
    - "test_scan_moe: write_moe_repo -> expert_groups[0].n_experts == 4; stacks[0].block_moe all True"
    - "test_scan_pipeline: write_pipeline_repo -> exactly 3 cards (text_encoder, transformer, vae); pipeline.components has scheduler/tokenizer has_weights False; text_encoder index_path 'text_encoder/model.safetensors.index.json' and index_total_size == tensor_bytes_total; transformer stack 'transformer_blocks' depth 3; all cards share revision_sha and model_card"
    - "test_scan_no_readme: readme=None -> model_card.present False; the scan succeeds"
    - "test_scan_gated: FakeHub gated without token -> GatedRepoError; out_dir is empty; with token -> success"
    - "test_scan_network_retry: inject reset once on a shard -> success with a retry event"
    - "test_scan_network_fail: inject reset times=10 on a shard -> NetworkError; out_dir empty; an error event exists"
    - "test_scan_bin_only: a repo with config.json + pytorch_model.bin -> NoSafetensorsError; totals.weight == 0"
    - "test_scan_threshold: ByteLog(threshold_bytes=200) on the dense repo -> ReadThresholdExceeded; out_dir empty"
    - "test_no_extra_files: monkeypatch HOME and TMPDIR to empty tmp dirs; after the scan they are still empty and out_dir holds only *.card.json/*.tensors.parquet"
    - "test_parse_target: table including 'Org/M@main', 'Org/M', an existing dir, and 'bad' -> ValueError"
  commands:
    - pytest -q tests/test_scan.py
    - pytest -q
out_of_scope:
  - reuse of existing Cards/caching (Phase 4)
  - any weight read, sampled or otherwise (Phase 2)
invariants_touched: [1, 2, 6]
