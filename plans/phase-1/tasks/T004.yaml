id: T004
title: Source protocol + LocalSource (logged, preflighted local reads; stat-based key)
depends_on: [T002]
files:
  - scout/sources.py
  - tests/test_local_source.py
route: opus
spec_complete: true
interface: |
  scout/sources.py:
    @dataclass(frozen=True)
    class RepoFile:
        path: str            # repo-relative, "/" separators
        size: int | None

    class Source(typing.Protocol):
        kind: str                   # "hub" | "local"
        repo: str                   # "owner/name" or "local:/abs/path"
        revision_sha: str
        revision_kind: str          # "git" | "local-stat-hash"
        requested_revision: str | None
        local_path: str | None
        endpoint: str | None
        log: ByteLog
        def resolve(self) -> None                         # fills revision_sha + file list; logs under RESOLVE
        def files(self) -> list[RepoFile]                 # after resolve(); sorted by path
        def read_file(self, path: str) -> bytes | None    # whole non-weight file; None if not in files()
        def read_range(self, path: str, start: int, length: int) -> bytes

    class LocalSource:                                    # implements Source
        def __init__(self, root: str | os.PathLike, log: ByteLog) -> None
behavior: |
  1. __init__: root = Path(root).resolve(strict=True). Raise ScoutError if it is not a directory.
     kind="local", repo=f"local:{root}", local_path=str(root), requested_revision=None, endpoint=None,
     revision_kind="local-stat-hash". revision_sha is "" until resolve().
  2. resolve(): walk root recursively with os.walk (sorted). Skip any directory or file whose name starts with "."
     and follow no symlinked directories (os.walk followlinks=False). Files are stat'ed with os.stat(path) which FOLLOWS
     symlinks (HF-cache snapshots are symlinks into ../blobs/), so size/mtime are the target's; a broken symlink ->
     ScoutError(f"broken symlink {rel}"). Reads open the path normally (following the link). Collect RepoFile(relpath, st_size). Compute
     revision_sha = sha256("\n".join(f"{rel}\t{size}\t{st_mtime_ns}" for sorted rel).encode()).hexdigest().
     Log a "fetch" event with nbytes=0, path="@local/stat", source="local", note=f"{n} files".
     No file contents are read.
  3. read_file(path): if path is not in files() return None. Call log.preflight(path, 0, size). This raises for
     weight-extension files and for the threshold, and returns a reservation id r. Then read the whole file and
     log.record(event="fetch", source="local", path=path, url=None, start=0, nbytes=len(data), status=None,
     elapsed_ms=..., release=r). Return data. On any exception, call log.release(r) (in a finally block).
  4. read_range(path, start, length): path must be in files() (else ScoutError). Call log.preflight(path, start,
     start+length) BEFORE opening the file (reservation r). open(..., "rb"); seek(start); data = f.read(length);
     record(start=start, nbytes=len(data), release=r); log.release(r) in finally. If len(data) < length raise HeaderError(f"short read {path}").
     Return data.
  5. Never write any file. Never read a byte that preflight did not approve.
decisions:
  - "resolve() does not call log.stage(); the caller enters RESOLVE (T010 does log.stage(RESOLVE) before source.resolve()). 'logs under RESOLVE' means the @local/stat event lands in whatever stage the caller set. resolve() may be called repeatedly; each call re-walks, re-hashes and logs one more 0-byte @local/stat event (record with start=None, so range is None)."
  - "files(), read_file() and read_range() before resolve() raise ScoutError (no implicit resolve)."
  - "Symlinks (plan r3-m10): os.walk(followlinks=False) lists a symlink to a directory under dirnames, so it is silently not descended into. File symlinks are stat'ed with os.stat (follows), may point outside root (HF cache ../../blobs/), and are opened normally. Any OSError from os.stat on a path that is a symlink (missing target, ELOOP) -> ScoutError(f'broken symlink {rel}'); an OSError on a non-symlink re-raises unchanged."
  - "Non-regular files after following links (fifos, sockets, devices) are skipped from files() so a read can never block on them."
  - "Hidden filter applies at every depth (any dir or file name starting with '.', e.g. .git/, sub/.cache/, .hidden.json); hidden paths are not in files(), so read_file returns None and read_range raises ScoutError for them."
  - "Reads check that the file has not changed since resolve(): after open, os.fstat (no bytes read) must match the (st_size, st_mtime_ns) captured by resolve(), else ScoutError('<path> changed since resolve(); re-run resolve'). This keeps read bytes consistent with revision_sha and with the size preflight approved. read_file reads at most the resolved size (f.read(size)), never more than preflight approved; if fewer bytes arrive it records them and raises ScoutError('short read ...')."
  - "read_range: path not in files() -> ScoutError. The record() happens before the short-read check, so bytes actually read are logged even when HeaderError('short read {path}') is raised. Negative start/length surface as ValueError from preflight's classify_range, before any open."
  - "Both reads call log.release(r) in finally even after record(release=r); release is idempotent, so this covers every exit path (refusal raises inside preflight and creates no reservation)."
  - "Reads use the builtin open() (looked up at call time) so tests can spy/monkeypatch builtins.open. elapsed_ms is perf_counter time from just before open to after read."
  - "Source is a plain typing.Protocol (not runtime_checkable) to match the interface as written. The @local/stat pseudo-path is exposed as module constant STAT_PATH."
  - "Built against the T002 follow-ups: no LogEvent dict is mutated, and set_header_len is called once per path in tests."
acceptance:
  tests:
    - "test_resolve_no_reads: monkeypatch builtins.open to fail on anything under root during resolve(); resolve succeeds; files and sizes are correct; revision_sha is 64-hex and stable across two calls; touching a file (mtime) changes it"
    - "test_read_file_meta: config.json is read, the meta bytes are counted exactly, the event is logged"
    - "test_read_range_header: after reading 8 bytes and set_header_len, reading [8,8+N) counts header bytes only; totals.weight == 0"
    - "test_weight_refused: read_range(shard, 8+N, 4) raises WeightReadRefused and open() is never called (spy)"
    - "test_bin_refused: read_file('pytorch_model.bin') raises WeightReadRefused"
    - "test_symlinked_files: an HF-cache-shaped fixture (snapshots/<sha>/model.safetensors -> ../../blobs/<hash>) -> size equals the blob size; read_header-style reads (8 bytes, then N) succeed; a broken link raises ScoutError"
    - "test_hidden_skipped: .git/ contents are excluded from files()"
  commands:
    - pytest -q tests/test_local_source.py
    - pytest -q
out_of_scope:
  - HubSource (T005)
  - safetensors parsing (T006)
invariants_touched: [1, 2, 6]
