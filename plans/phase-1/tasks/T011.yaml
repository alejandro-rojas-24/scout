id: T011
title: View model (collapsed graph nodes + depth strips) built from a persisted Card
depends_on: [T009]
files:
  - scout/view.py
  - tests/test_view.py
route: sonnet
spec_complete: true
interface: |
  scout/view.py:
    DISCLAIMERS: tuple[str, str, str] = (
        "Distillation is invisible to weight forensics: a model trained on another model's outputs leaves no trace in its weights.",
        "Tokenizer reuse alone is not proof of derivation.",
        "Licensing is a human decision: scout shows the license claimed by the model card and does not judge compliance.",
    )
    def build_view(card: dict, table: pyarrow.Table) -> dict     # schema of plan.md section 4.4
behavior: |
  1. Segment rule: split each collapsed_name on "."; then merge every "#" or "*" segment, AND every remaining all-digit
     segment, into the previous segment as f"{prev}[#]" / f"{prev}[*]" / f"{prev}[#]"
     (e.g. ["model","layers[#]","mlp","experts[*]","up_proj","weight"];
     "decoder.up_blocks.#.resnets.2.conv1.weight" -> ["decoder","up_blocks[#]","resnets[#]","conv1","weight"]).
     While doing this, remember for each node id ending in "[#]" that came from a literal digit (an "inner stack") the set
     of distinct literal indices seen for it.
  2. Nodes: a root node id "" with kind "root", parent None, label = card.key.component or card.key.repo.
     For each row, for each prefix length L = 1..len(segs), node id = ".".join(segs[:L]) and parent = the id of L-1 ("" for L=1).
     Every node on the path adds the row's numel to params (so the root's params == the sum of all numel).
  3. kind: if the last segment ends with "[#]" -> "stack"; if it ends with "[*]" -> "expert_group"; if the id is a full row path
     (a leaf) -> "tensor"; else "module". A leaf id that is also a prefix of another row stays "module".
  4. count: a Card stack node ("#" from collapsed_name) -> the depth of the Card stack whose prefix == the row's
     stack_prefix; an inner stack node (from a literal digit) -> the number of distinct literal indices seen for that node
     id; expert_group -> the n_experts of the Card expert_group whose template equals the collapsed_name prefix up to
     and including "*"; else 1. Both kinds of "[#]" nodes have kind "stack".
  5. label: the last segment with "[#]" replaced by f" ×{count}" and "[*]" by f" ×{count}" (U+00D7).
  6. shape/dtype: for tensor nodes, the shape (list) and dtype of the first row (by table order); if rows under the same leaf
     disagree on shape, shape = None and dtype = "varies". None for non-tensor nodes.
  7. nodes are ordered by first appearance in table row order (root first). Each id appears once.
  8. depth_strips: one per card.structure.stacks entry, same order: {prefix, depth, cells: [{index: indices[i],
     params: block_params[i], signature: block_signatures[i], moe: block_moe[i], n_experts: block_n_experts[i]}]}.
  9. summary: params_total, n_tensors from weights; n_stacks, n_expert_groups from structure; weight/header/meta bytes
     from fetch_log.totals.
  10. disclaimers = list(DISCLAIMERS), always present.
  10b. card_key = card.key; model_card = card.model_card; title = f"{repo}@{revision_sha[:12]}" + (f" / {component}" if component).
  11. Pure function; the output must json.dumps.
acceptance:
  tests:
    - "build cards with tests/helpers/cards.py::build_fixture_card (from T009) on st_fixtures repos; for the scale test write a single-file repo with moe_tensors(...) via write_sharded(n_shards=1) plus a config.json"
    - "test_dense_view: a node 'model.layers[#]' with kind stack, count 4 and label 'layers ×4'; root params == params_total; no expert_group"
    - "test_moe_view: exactly 1 expert_group node with count == n_experts; node count < 40 for moe_tensors(n_layers=3,n_experts=4)"
    - "test_strips: cells length == depth; moe flags copied"
    - "test_collapse_scale: moe_tensors(n_layers=48, n_experts=128, hidden=8, moe_inter=4) -> len(nodes) <= 100 and exactly 1 expert_group with count 128"
    - "test_json: json.dumps(view) works"
    - "test_disclaimers: view['disclaimers'] == list(DISCLAIMERS) and has 3 entries mentioning 'Distillation', 'Tokenizer', 'Licensing'"
    - "test_wan_vae_bound: the write_pipeline_repo vae card -> the node 'decoder.up_blocks[#].resnets[#]' exists with kind stack and count 3; the number of nodes with kind != 'tensor' is <= 100 (and < 40 for the fixture); root params == params_total"
  commands:
    - pytest -q tests/test_view.py
    - pytest -q
out_of_scope:
  - layout/coordinates (frontend's job)
  - attribution coloring (Phase 4)
invariants_touched: [1]

amendments:
  - "2026-10-03 orchestrator (from T011 review r1): consecutive integer markers keep one origin per marker. A node's `count` is the FIRST marker's count, which is the Card stack depth when that marker is the Card '#' stack, never overridden by a literal. The label shows each marker's own count in order, e.g. `input_blocks ×12 ×2`."
  - "2026-10-03 orchestrator: a leading integer segment (root-level Card stack, prefix '') uses the root as predecessor: id '[#]', parent '', kind 'stack', count = Card depth, label '×N'."
  - "2026-10-03 orchestrator: a tensor node's dtype is 'varies' whenever the dtypes of its rows differ, independent of shape. shape is None only when shapes differ."
  - "2026-10-05 orchestrator (T011 follow-up): rule 1's 'all-digit segment' means structure.py's index rule (scout.structure._is_index), not str.isdigit."
  - "2026-10-03 orchestrator: if a Parquet stack_prefix or expert template has no matching Card structure entry, raise ScoutError (no silent count=1)."

decisions:
  - "Each merged segment carries an ordered list of marker origins (card/lit/exp), one per marker. Per node and marker position, view.py records a fixed count (Card stack depth or n_experts) and/or a set of distinct literal indices. A marker's count is the fixed count if one exists, else the number of distinct literals. Literals never override a Card count."
  - "Node count = the FIRST marker's count. Node kind also comes from the FIRST marker ('#' or literal -> stack, '*' -> expert_group), so kind and count stay consistent. This differs from rule 3 ('last segment ends with') only for the theoretical '[*][#]' case (experts.N.M); '[#][*]' cannot occur because '*' always follows a literal 'experts' segment."
  - "Label = the segment without its markers, then ' ×N' for each marker in order (e.g. 'input_blocks ×12 ×2'). With an empty base (root-level stack), the label is '×N' with no leading space."
  - "Leading marker: any leading '#', literal digit or '*' merges into an empty predecessor, so the ids are '[#]' / '[*]' with parent ''. Amendment 2 is applied to literal leading digits too, not only to the Card stack with prefix ''."
  - "Rule 6 as amended: shape = None iff the shapes differ; dtype = 'varies' iff the dtypes differ. A shape mismatch with equal dtypes now keeps the common dtype (previously it forced 'varies')."
  - "Mismatch (amendment 4): a '#' row whose stack_prefix (including None) has no Card stack, or a '*' template with no Card expert group, raises ScoutError naming the row's collapsed_name and the missing key. No count=1 fallback for Card markers. A literal-only marker with no literals cannot occur, but falls back to 1."
  - "Index rule: view.py imports scout.structure._is_index (read-only use), so a segment is a stack/literal index exactly when structure.py treats it as one (ASCII digits, 1..9 chars). Longer digit runs (e.g. '1234567890') stay plain segments. If two rows ever give one node marker different Card counts, build_view raises ScoutError; there is no max() merge (replaces the earlier max decision, which was only reachable through the >9-digit mismatch now removed)."
  - "New tests build custom repos via write_sharded(n_shards=1) + config.json + DEFAULT_README through build_fixture_card. The round-trip test uses the MoE fixture (stacks + expert group) and compares the full view dicts with ==."
