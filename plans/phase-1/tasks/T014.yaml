id: T014
title: Frontend - no-build page with live byte log, graph view and depth strips (D1)
depends_on: [T013]
files:
  - scout/web/index.html
  - scout/web/app.js
  - tests/test_web_static.py
route: opus
spec_complete: false      # visual layout choices are left to the implementer; record them in decisions
interface: |
  scout/web/index.html: a single page; the required element ids are
    #target (input), #scan (button), #status, #counter-meta, #counter-header, #counter-weight, #log (scrolling list),
    #cards (container with one section per view)
  scout/web/app.js: plain ES2020, no imports, no external URLs, no build step. Exposes nothing global except via an IIFE.
  Talks only to POST /api/scans and GET /api/scans/{id}?since=N (T013).
behavior: |
  1. Clicking Scan (or pressing Enter in #target) POSTs {"target"}. On 202 it polls GET /api/scans/{id}?since=lastSeq every 250 ms
     until status is done or error. Each new event is appended to #log using the same one-line format as the CLI's
     format_event; the log auto-scrolls. #status shows running/done/error, elapsed_s (1 decimal) and the error message.
  2. The byte counter shows totals.meta, totals.header and totals.weight from each poll. #counter-weight gets class "nonzero"
     (red) if weight > 0, else "zero" (green) and the text "weight 0 B". The counter is visible from the first poll.
  3. For each view in views (on done), render a section containing:
     a0. The view's `disclaimers` (3 strings), shown as a visible note block at the top of EVERY view section (not collapsed,
        not only in a tooltip).
     a. The title, and a "claimed by model card" box: base_model (list), license, tags, pipeline_tag; "no model card" if
        present is false.
     b. A summary line: params_total (human units: K/M/B with 2 decimals), n_tensors, number of stacks and expert groups,
        weight bytes read.
     c. Depth strips: one SVG per strip, one rect per cell. Width is proportional to the available width, with a minimum of
        4 px per cell. Fill is by signature: the most common signature is neutral grey; the others get distinct hues from a
        fixed 8-colour list. MoE cells get a hatch/marker. Tooltip (<title>): index, params, signature, n_experts. Label "prefix · depth".
     d. The graph: an SVG left-to-right tree built from nodes (parent links). x = depth * 180 px; y = the leaf order * 22 px.
        Stack and expert_group nodes are drawn with a double outline and their "×N" label. "tensor" nodes are hidden by default
        behind a "show tensors" checkbox (their shape/dtype goes in <title>). OPTIONAL polish: clicking a module node
        collapses or expands its subtree. The SVG scrolls inside its container; there is no page-level horizontal scroll.
  4. Plain CSS in index.html. Must honour prefers-color-scheme (light/dark variables). No external fonts or CDNs.
  5. All text is inserted with textContent (no innerHTML with data), because tensor names come from untrusted headers.
acceptance:
  tests:
    - "tests/test_web_static.py: index.html contains every required id; app.js contains '/api/scans' and 'since='; neither file contains 'http://' or 'https://' (except the SVG namespace 'http://www.w3.org/2000/svg'); app.js does not contain 'innerHTML'; app.js references 'disclaimers'"
    - "served through make_server (from T013) GET / -> 200 and GET /app.js -> 200 application/javascript"
  commands:
    - pytest -q tests/test_web_static.py
    - pytest -q
  manual:
    - "scout serve; scan a local write_moe_repo fixture dir; confirm: live log lines appear, weight counter 'weight 0 B' green, 'layers ×N' and 'experts ×4' nodes, one depth strip, the 3 disclaimers; then scan a write_pipeline_repo dir and confirm 3 sections; note this in log.jsonl"
out_of_scope:
  - diff view, attribution colouring, any npm/build tooling, JS unit test frameworks
invariants_touched: [2, 5]
decisions:
  - "Polling: a setTimeout loop (250 ms after each response, never overlapping) rather than setInterval. After status leaves 'running', the loop keeps calling with since=lastSeq with no delay until a poll returns zero events, because the server caps events per poll at POLL_EVENTS_MAX and the tail of the log must not be lost (T013 review note). Views are rendered once, from the first 'done' response."
  - "New scan while one is running: a runId token makes stale poll loops stop themselves. #scan is disabled while a scan is running. Starting a scan clears #log, #cards and the counter."
  - "Enter/click: #target and #scan sit in a <form id='scan-form'>; submit is prevented and both Enter and click go through the same handler. An empty target shows an error status without a request. A non-202 POST shows the server's 'error' text in #status."
  - "#status text is '<status> · <elapsed_s.toFixed(1)> s[ · <ErrorType>: <message>]', and its class is the status."
  - "Byte counter: exact byte counts with thousands separators ('meta 4,258 B', 'weight 0 B'), not human units, because exact counts are what invariant 2 audits. The counter is in the static HTML with 0 B from page load ('weight 0 B', class zero), so it is visible before and from the first poll."
  - "Log: an <ol> of one <li> per event, text = the T012 format_event line (stage padEnd 8, event padEnd 12, path or '-', +NB, totals, '  (note)'). It auto-scrolls only when the user is already at the bottom (within 24 px), so scrolling up to read is not interrupted. Lines are coloured: stage_start accent; error/refused or weight>0 red."
  - "Layout: a single column (max-width 1280px): a scan bar, a byte panel (counter + log, 13rem tall, user-resizable), then #cards with one <section class='view'> per view in server order. body has overflow-x hidden; the strips and the graph scroll inside their own containers."
  - "Disclaimers: a <ul role='note'> with a yellow note background, first child of every view section, always expanded."
  - "Claims box: a <dl> captioned 'claimed by model card' with base_model (joined, plus base_model_relation if set), license (plus license_name if set), tags and pipeline_tag. A missing value shows 'none claimed'. parse_error is shown if present. present=false shows only 'no model card'."
  - "Summary: params via K/M/B (2 decimals; values under 1000 shown as integers). The weight-bytes part is green 'weight 0 B' / red when >0. Header and meta bytes are appended for context."
  - "Depth strip colours: the most common signature (ties: first seen) uses var(--neutral). The others take the Tableau-10-derived 8-colour list in order of first appearance and cycle past 8. A legend (signature ×count + 'hatched = MoE block') sits under each strip. MoE cells get a second rect filled with a 45-degree hatch <pattern> (unique id per strip). Cell width = max(4, availableWidth/n). Strips are drawn after attach (requestAnimationFrame) and redrawn on window resize (debounced 120 ms). Fills are set via style so CSS variables resolve."
  - "Graph layout: DFS over visible nodes. Each visible leaf takes the next row (y = row*22); a parent sits at the midpoint of its first and last visible child. When tensors are hidden, a module whose children are all tensors becomes a leaf. Children keep server node order. Edges are elbow paths from the parent's right edge to 10 px before the child. Labels over 24 chars are truncated with an ellipsis; the full id is in <title>. Box width is estimated from a monospace glyph width (no DOM measuring)."
  - "Node styling: stack (blue) and expert_group (purple) get a double outline (two rects 3 px apart). The '×N' text is the server label as-is. Root is bold. Tensors are dashed and muted, and their <title> has shape (or 'varies') and dtype. Every node's <title> has id, kind, params and count."
  - "OPTIONAL collapse/expand implemented: clicking any node that has visible children toggles its subtree. A collapsed node gets a dashed outline and ' +' suffix. The 'show tensors' checkbox and the collapse state are per view section and are not persisted."
  - "Theme: CSS variables on :root, overridden in @media (prefers-color-scheme: dark), with color-scheme: light dark. --on-accent keeps the Scan button readable in both themes. System font stacks only."
  - "index.html includes <link rel='icon' href='data:,'> so the browser does not request /favicon.ico (which would 404 in the console). This is not an external URL."
  - "Static test extras beyond the spec (cheap guards): app.js also has no outerHTML/insertAdjacentHTML, no import/require; index.html loads app.js and contains prefers-color-scheme; GET / returns text/html containing id='cards'."
  - "Manual check done via Playwright (Chromium headless) against scout.server.make_server on 127.0.0.1 with st_fixtures dense/moe/pipeline dirs. Screenshots are in plans/phase-1/screens/T014-*.png. The log.jsonl note asked for in acceptance.manual is left to the orchestrator because log.jsonl is not in this task's files."
  - "Review follow-up: a missing or non-numeric byte total renders as '? B'. The weight counter and summary span get class 'unknown' (amber --warn). 'zero' (green) is used only for === 0 and 'nonzero' (red) for > 0."
  - "Review follow-up: if view.disclaimers is not an array of exactly 3 entries, the note block gets an extra red item 'disclaimers missing from view'."
  - "Review follow-up: test_no_external_urls also rejects '\"//', \"'//\", '(//' and '@import' (protocol-relative URLs and CSS imports)."
