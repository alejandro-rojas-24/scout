id: T005
title: HubSource - pinned resolve, ranged reads via redirects, retries, gated handling, honest counting
depends_on: [T002, T003, T004]
files:
  - scout/hub.py
  - tests/test_hub_source.py
route: opus
spec_complete: true
interface: |
  scout/hub.py:
    DEFAULT_ENDPOINT = "https://huggingface.co"
    API_PATH = "@api/revision"                 # the logged path for the API call (classified meta)
    SHA_RE = re.compile(r"^[0-9a-f]{40}$")
    REPO_RE = re.compile(r"^[A-Za-z0-9][\w.-]*/[\w.-]+$")

    class HubSource:                           # implements scout.sources.Source
        def __init__(self, repo_id: str, revision: str | None, log: ByteLog, *,
                     client: httpx.Client | None = None,
                     endpoint: str | None = None,          # default: env HF_ENDPOINT or DEFAULT_ENDPOINT
                     token: str | None = None,             # default: env HF_TOKEN (None if unset or empty)
                     attempts: int = 3,
                     backoff_s: tuple[float, ...] = (0.5, 1.0),
                     timeout_s: float = 10.0,
                     sleep: Callable[[float], None] = time.sleep) -> None
        kind = "hub"; repo; revision_sha; revision_kind = "git"; requested_revision; local_path = None; endpoint; log
        def resolve(self) -> None
        def files(self) -> list[RepoFile]
        def read_file(self, path: str) -> bytes | None
        def read_range(self, path: str, start: int, length: int) -> bytes
        def close(self) -> None               # closes the client only if HubSource created it
behavior: |
  1. __init__ validates repo_id against REPO_RE (else ValueError). No network. If the client is None, create
     httpx.Client(follow_redirects=True, timeout=timeout_s). Every request sends the headers
     {"User-Agent": f"scout/{__version__}", "Accept-Encoding": "identity"}, plus
     "Authorization: Bearer <token>" when a token is set. httpx strips Authorization on cross-origin redirects;
     do not re-add it.
  2. resolve(): GET f"{endpoint}/api/models/{repo}/revision/{quote(rev or 'main', safe='')}", params {"blobs": "true"}.
     The call goes through _get(..., logged_path=API_PATH, start=None); classification is meta.
     Status 401 or 404 with the body error containing "Repository Not Found" -> RepoNotFoundError(f"{repo}: not
     found or private (HF_TOKEN {'set' if token else 'not set'})"). Status 404 otherwise -> RepoNotFoundError
     (revision not found). 403 -> GatedRepoError. Parse JSON: revision_sha = body["sha"]. If requested_revision
     matches SHA_RE and differs -> RevisionMismatch. files = [RepoFile(s["rfilename"], s.get("size"))] sorted.
     Remember gated = body.get("gated") for error messages.
  3. File URL = f"{endpoint}/{repo}/resolve/{revision_sha}/{quote(path)}". Always the resolved sha, never the
     branch.
  4. read_file(path): None if path is not in files. preflight(path, 0, size or 0). GET without Range, expect 200.
     Read through _get with start=0 and expected length = size if known.
  5. read_range(path, start, length): preflight(path, start, start+length) BEFORE any request. GET with
     Range f"bytes={start}-{start+length-1}". Expect 206. If the final status is 200 (Range ignored): read at most
     `length` bytes from iter_raw, count EVERYTHING yielded (a chunk may overshoot; count the whole chunk,
     classified by position), close the response, raise RangeNotSupported. Retries must not apply to this.
     If 206: accumulate iter_raw chunks until the stream ends; count every yielded byte.
     If len(body) != length it is a short read (retryable).
  6. _get(url, *, logged_path, start, expected_len, headers) implements attempts:
     for attempt in 1..attempts: t0 = monotonic; try client.stream("GET", ...) as r:
       - r.status_code in (401, 403) on a file URL -> GatedRepoError(f"{repo} is gated or private: accept the terms at
         {endpoint}/{repo} and set HF_TOKEN (HF_TOKEN {'set' if token else 'not set'})"). Log a note error; no retry.
       - 404 on a file -> ScoutError(f"missing file {path}"); no retry.
       - 429 or >= 500 -> retryable.
       - else stream the body counting bytes; if Content-Encoding is present and not "identity": count raw bytes,
         then gzip-decode when it is "gzip", else NetworkError.
       httpx.TransportError (ConnectError, ReadError, RemoteProtocolError, TimeoutException) -> retryable.
     On a retryable failure: log.record(event="retry", start=start, nbytes=<bytes received this attempt>,
     status=..., attempt=attempt, note=str(err)); sleep(backoff_s[min(attempt-1, len-1)]) if attempts remain.
     On success: log.record(event="fetch", ..., url=str(final response url)).
     When attempts run out: log.note("error", ...) and raise NetworkError(f"{path}: {attempts} attempts failed: {last}").
  7. No bytes are written to disk. No huggingface_hub import.
decisions: []
acceptance:
  tests:
    - "all tests use FakeHub (tests/helpers/fakehub.py) with endpoint=HUB, client=hub.client(), sleep=lambda s: None"
    - "test_resolve_pins_sha: resolve('org/m', None) -> sha 'a'*40; files match the fixture; exactly 1 meta fetch event, path '@api/revision'"
    - "test_unknown_revision: requested 'b'*40 on a repo with sha 'a'*40 -> FakeHub 404 -> RepoNotFoundError"
    - "test_revision_mismatch: wrap hub.transport() in an httpx.MockTransport whose handler rewrites the API JSON 'sha' to 'c'*40; requested 'a'*40 -> RevisionMismatch"
    - "test_header_ranges: read_range(shard,0,8) then set_header_len and read_range(shard,8,N): 206; header bytes == 8+N; weight 0; fakehub.cdn_reads ranges end <= 8+N"
    - "test_weight_refused_no_request: read_range(shard, 8+N, 1) raises WeightReadRefused and len(fakehub.requests) is unchanged"
    - "test_retry_mid_read: inject(shard,'reset',times=1,after_bytes=3) on the header body read -> succeeds; one retry event with bytes 3 and one fetch event; totals.header == 8+N+3"
    - "test_retry_exhausted: inject(shard,'reset',times=5,after_bytes=2) -> NetworkError; 3 retry events; 1 error event"
    - "test_503_then_ok: inject('503', times=2) -> success on attempt 3"
    - "test_range_ignored: inject('ignore_range') on read_range(shard,8,N) -> RangeNotSupported; totals count the bytes actually received (> N possible, weight > 0 allowed and visible)"
    - "test_gated: add_repo(gated=True, token='hf_x'): without a token read_file('config.json') raises GatedRepoError mentioning 'HF_TOKEN not set'; with token='hf_x' it succeeds"
    - "test_repo_not_found: RepoNotFoundError"
    - "test_env_token: monkeypatch HF_TOKEN -> the Authorization header is present on HUB requests and absent on CDN requests"
  commands:
    - pytest -q tests/test_hub_source.py
    - pytest -q
out_of_scope:
  - parallelism (T010 owns the thread pool; HubSource must simply be thread-safe to call concurrently. httpx.Client is thread-safe; keep no per-call mutable state on self except under a lock)
  - interactive download confirmation (Phase 2)
invariants_touched: [1, 2, 6]
