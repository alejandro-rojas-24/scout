id: T005
title: HubSource - pinned resolve, ranged reads with manual redirects, retries, gated handling, honest bounded counting
depends_on: [T002, T003, T004]
files:
  - scout/hub.py
  - tests/test_hub_source.py
route: opus
spec_complete: true
interface: |
  scout/hub.py:
    DEFAULT_ENDPOINT = "https://huggingface.co"
    API_PATH = "@api/revision"                 # logged path for the API call (classified meta)
    REDIRECT_PATH = "@redirect"                # logged path for 3xx bodies (classified meta)
    MAX_REDIRECTS = 5
    REDIRECT_MAX_BYTES = 64 * 1024             # per-hop cap and reservation for a 3xx body
    ERROR_PATH = "@error"                      # logged path for non-2xx response bodies (classified meta)
    ERROR_BODY_MAX_BYTES = 64 * 1024           # cap and reservation for one non-2xx body
    SHA_RE = re.compile(r"^[0-9a-f]{40}$")
    REPO_RE = re.compile(r"^[A-Za-z0-9][\w.-]*/[\w.-]+$")

    class HubSource:                           # implements scout.sources.Source
        def __init__(self, repo_id: str, revision: str | None, log: ByteLog, *,
                     client: httpx.Client | None = None,
                     endpoint: str | None = None,          # default: env HF_ENDPOINT or DEFAULT_ENDPOINT
                     token: str | None = None,             # default: env HF_TOKEN (None if unset or empty)
                     attempts: int = 3,
                     backoff_s: tuple[float, ...] = (0.5, 1.0),
                     timeout_s: float = 10.0,
                     sleep: Callable[[float], None] = time.sleep) -> None
        kind = "hub"; repo; revision_sha; revision_kind = "git"; requested_revision; local_path = None; endpoint; log
        def resolve(self) -> None
        def files(self) -> list[RepoFile]
        def read_file(self, path: str) -> bytes | None
        def read_range(self, path: str, start: int, length: int) -> bytes
        def close(self) -> None               # closes the client only if HubSource created it
behavior: |
  1. __init__ validates repo_id against REPO_RE (else ValueError). No network. If the client is None, create
     httpx.Client(timeout=timeout_s). Every request is sent with follow_redirects=False (per-request argument), because
     redirects are followed manually (step 7). Base headers: {"User-Agent": f"scout/{__version__}",
     "Accept-Encoding": "identity"}, plus "Authorization: Bearer <token>" when a token is set, but ONLY for requests
     whose host equals the endpoint host.
  2. resolve(): r = log.preflight(API_PATH, 0, META_MAX_BYTES). GET
     f"{endpoint}/api/models/{repo}/revision/{quote(rev or 'main', safe='')}" with params {"blobs": "true"}, through
     _get(logged_path=API_PATH, start=None, cap=META_MAX_BYTES, reservation=r).
     Error mapping for every non-2xx API response, applied in order:
       a. Header X-Error-Code: "RepoNotFound" or "RepositoryNotFound" -> RepoNotFoundError(f"{repo}: not found or private
          (HF_TOKEN {'set' if token else 'not set'})"); "RevisionNotFound" -> RepoNotFoundError(f"{repo}@{rev}: revision
          not found"); "GatedRepo" -> GatedRepoError.
       b. Else a case-insensitive body match: "repository not found" -> RepoNotFoundError; "revision not found" ->
          RepoNotFoundError (revision); "gated" or "restricted" -> GatedRepoError.
       c. Else by status: 401 -> RepoNotFoundError (not found or private); 403 -> GatedRepoError; 404 -> RepoNotFoundError;
          429/5xx -> retryable (step 6); any other status -> HubAPIError(f"{repo}: API status {code}").
     On 2xx: the body must be a JSON object with a str "sha" and a list "siblings", else HubAPIError (never a bare
     KeyError). revision_sha = body["sha"]. If requested_revision matches SHA_RE and differs -> RevisionMismatch.
     files = [RepoFile(s["rfilename"], s.get("size"))], sorted.
  3. File URL = f"{endpoint}/{repo}/resolve/{revision_sha}/{quote(path)}". Always the resolved sha, never the branch.
  4. read_file(path): None if path is not in files. n = size if known, else META_MAX_BYTES; r = preflight(path, 0, n).
     GET without Range, expect 200; _get(start=0, cap=n, reservation=r).
  5. read_range(path, start, length): r = preflight(path, start, start+length) BEFORE any request. GET with
     Range f"bytes={start}-{start+length-1}" (resent on every redirect hop); _get(start=start, cap=length, reservation=r).
     Expect 206; the body must be exactly `length` bytes (a short body is retryable).
     If the final status is 200 (Range ignored): read chunks from iter_raw until at least `length` bytes or EOF, then
     close. Record ALL yielded bytes with start=0 (the body begins at file offset 0, so bytes past 8+N classify as
     weight honestly). Raise RangeNotSupported. No retry.
  6. _get(url, *, logged_path, start, cap, reservation, headers) runs up to `attempts` attempts:
     for each attempt: t0 = monotonic; follow the redirect chain (step 7); then on the final response:
       - ANY non-2xx final response (API or file, including 401/403/404/429/5xx): re = preflight(ERROR_PATH, 0,
         ERROR_BODY_MAX_BYTES); read the body up to ERROR_BODY_MAX_BYTES (close beyond it); log.record(event="error",
         path=ERROR_PATH, start=None, nbytes=len(body), status=..., url=..., note=f"{status} for {logged_path}",
         release=re); release(re) in finally. Only then apply the mapping below and the step-2 API mapping (which may use
         that body). This way no body byte is ever unrecorded, and an error body on a .safetensors URL is never classified
         as header or weight. "retry" events are used only for bytes of a 2xx body cut off by a transport error.
       - 401/403 on a file URL -> GatedRepoError(f"{repo} is gated or private: accept the terms at {endpoint}/{repo}
         and set HF_TOKEN (HF_TOKEN {'set' if token else 'not set'})"). log.note("error", ...). No retry.
       - 404 on a file -> ScoutError(f"missing file {path}"). No retry.
       - 429 or >= 500 -> retryable.
       - Content-Encoding present and not "identity" -> NetworkError (no decoding branch). No retry.
       - Otherwise stream iter_raw, counting every yielded byte. If the running count exceeds `cap`, close the
         response, record the bytes received (event "fetch", note "cap exceeded") and raise ReadThresholdExceeded.
     httpx.TransportError (ConnectError, ReadError, RemoteProtocolError, TimeoutException) -> retryable.
     On a retryable failure: log.record(event="retry", start=start, nbytes=<bytes received this attempt>, status=...,
     attempt=attempt, note=str(err)); sleep(backoff_s[min(attempt-1, len-1)]) if attempts remain.
     On success: log.record(event="fetch", ..., url=str(final url), release=reservation).
     When attempts run out: log.note("error", ...) and raise NetworkError(f"{path}: {attempts} attempts failed: {last}").
     In every case, log.release(reservation) in a finally block.
  7. Manual redirects: for status in (301, 302, 303, 307, 308): rr = log.preflight(REDIRECT_PATH, 0, REDIRECT_MAX_BYTES)
     (a reservation per hop). Stream the 3xx body counting bytes; if it exceeds REDIRECT_MAX_BYTES, close, record what was
     received and raise ReadThresholdExceeded. Record it as event "fetch", path REDIRECT_PATH, start None, url=request
     url, status, note=f"-> {location host}", release=rr (meta); log.release(rr) in finally. Resolve Location relative
     to the request URL (e.g. "/api/resolve-cache/..." -> the endpoint host). Send the next hop with the
     same Range header, with Authorization only if the new host equals the endpoint host. More than MAX_REDIRECTS hops
     -> NetworkError.
  8. No bytes are written to disk. No huggingface_hub import.
decisions:
  - "_get gets two private keywords beyond the spec signature: mode ('api' | 'file' | 'range') and exact (the expected body length). The API query is built into the URL ('?blobs=true'), so _get takes no params. mode selects the status expectation (api: any 2xx; file: 200; range: 206, with 200 -> RangeNotSupported) and the non-2xx mapping (api: behavior 2 a/b/c; file/range: behavior 6)."
  - "Bodies are read through _iter_raw(resp): iter_raw() for a streaming response. httpx marks a Response built with content= (MockTransport/FakeHub) as already consumed, and iter_raw() refuses it, so for that case the re-iterable raw resp.stream is read instead. Either way the count is the raw (undecoded) bytes the transport yielded. No chunk_size is used, so no received byte sits uncounted in a rechunk buffer."
  - "Authorization is attached only when (scheme, host, port) of the request URL equals the endpoint's. This is stricter than 'host equals' so the token never goes over an http:// downgrade or to another port on the same host. Relative Locations resolve against the request URL (httpx.URL.join)."
  - "Redirects: every 3xx body is read and logged under @redirect, including the hop that exceeds MAX_REDIRECTS. The 6th 3xx in a chain -> NetworkError('more than 5 redirects'). A 3xx without Location -> NetworkError. Neither is retried. A transport error while reading a 3xx body records the partial bytes as an @redirect fetch event (note 'transport error') and then retries; the attempt's retry event then carries 0 main-body bytes, so every byte is recorded exactly once."
  - "Error bodies: read until >= ERROR_BODY_MAX_BYTES (then close; note '; truncated at cap'). All yielded bytes are recorded, even if the last chunk overshoots. A transport error mid-body records the partial bytes as the @error event and retries. 300/304/305 (not in the redirect set) are treated as non-2xx final responses."
  - "File/range non-2xx mapping beyond the spec: any status other than 401/403/404/429/5xx -> NetworkError('<path>: unexpected HTTP status N') (e.g. 416), no retry. X-Error-Code is not consulted for file URLs (behavior 6 maps by status only). API 404 without a code or body match -> RepoNotFoundError with the 'not found or private' message. The API GatedRepoError message is 'is gated: accept the terms at <endpoint>/<repo> and set HF_TOKEN (HF_TOKEN set|not set)'."
  - "Unexpected 2xx: file mode with a non-200 2xx, range mode with a 2xx other than 200/206, or a 206 whose Content-Range start differs from the requested start. The body is read (cap-bounded) and recorded as a fetch at the offset the server says it is at (Content-Range start, else the requested start), with note 'unexpected response', then NetworkError, no retry. This keeps classification honest if a server returns a different range."
  - "read_file with a known size treats a short 200 body (fewer than size bytes) as retryable, like a short 206 body. The short bytes are recorded in the retry event. A longer body hits the cap -> ReadThresholdExceeded."
  - "Cap exceeded (2xx body or 3xx body): ReadThresholdExceeded(requested=bytes received, total=current meta+header totals, threshold=log.threshold_bytes, message names the path, the cap and 'disk=0 reason=bounded read')."
  - "Range ignored (200 to a Range request): reads until >= length bytes or EOF, then closes. A transport error during that read is not retried: the received bytes are still recorded (start=0, note includes the error) and RangeNotSupported is raised. Content-Encoding is checked before this branch, so a non-identity 2xx is always NetworkError without reading the body."
  - "log.note('error', ...) is emitted for every terminal error raised by HubSource (gated, missing file, API mapping, unexpected status, Content-Encoding, redirect limit, RangeNotSupported, malformed API JSON, RevisionMismatch, exhausted attempts) with path=logged path (None for redirect-chain errors). It is not emitted for ReadThresholdExceeded (the fetch event carries note 'cap exceeded') or for WeightReadRefused (ByteLog notes 'refused'). Exhausted message uses the logged path: NetworkError(f'{logged_path}: {attempts} attempts failed: {last}')."
  - "resolve() also validates: the returned sha must match SHA_RE; each sibling must be a dict with a non-empty str rfilename; size must be None or a non-negative int (bool rejected). Anything else -> HubAPIError (invalid JSON too). The RevisionMismatch check compares requested_revision literally (only lowercase 40-hex matches SHA_RE). revision_sha/file list are set only after full validation."
  - "files(), read_file(), read_range() before resolve() -> ScoutError. read_range on a path not in files() -> ScoutError, and start < 0 or length < 1 -> ValueError, both before preflight and before any request. attempts < 1 -> ValueError in __init__. Empty backoff_s -> no sleep."
  - "endpoint: the explicit argument, else env HF_ENDPOINT (if non-empty), else DEFAULT_ENDPOINT; a trailing '/' is stripped. token: the explicit argument, else env HF_TOKEN; '' becomes None. timeout_s is used only when HubSource creates its own client; a caller-supplied client keeps its own timeout."
  - "Elapsed: fetch/retry events use monotonic time from the start of the attempt (including redirect hops); @redirect and @error events use time from when their body read started. All events carry source='hub'. The @api/revision URL is logged with its query string."
acceptance:
  tests:
    - "all tests use FakeHub (tests/helpers/fakehub.py) with endpoint=HUB, client=hub.client(), sleep=lambda s: None"
    - "test_resolve_pins_sha: resolve('org/m', None) -> sha 'a'*40; files match the fixture; exactly 1 meta fetch event with path '@api/revision'; reserved == 0 afterwards"
    - "test_unknown_revision: requested 'b'*40 on a repo with sha 'a'*40 -> FakeHub 404 -> RepoNotFoundError"
    - "test_revision_mismatch: wrap hub.transport() in an httpx.MockTransport whose handler rewrites the API JSON 'sha' to 'c'*40; requested 'a'*40 -> RevisionMismatch"
    - "test_header_ranges: read_range(shard,0,8) then set_header_len and read_range(shard,8,N): 206; header bytes == 8+N; weight 0; fakehub.cdn_reads ranges end <= 8+N; 2 '@redirect' fetch events of 18 bytes each (meta)"
    - "test_manual_redirect_auth: token='hf_x' -> the Authorization header is present on HUB requests and absent on CDN requests; the Range header is present on both hops"
    - "test_weight_refused_no_request: read_range(shard, 8+N, 1) raises WeightReadRefused and len(fakehub.requests) is unchanged"
    - "test_retry_mid_read: inject(shard,'reset',times=1,after_bytes=3) on the header body read -> succeeds; one retry event with bytes 3 and one fetch event; totals.header == 8+N+3; reserved == 0"
    - "test_retry_exhausted: inject(shard,'reset',times=5,after_bytes=2) -> NetworkError; 3 retry events; 1 error event; reserved == 0"
    - "test_503_then_ok: inject('503', times=2) -> success on attempt 3"
    - "test_range_ignored: inject('ignore_range') on read_range(shard,8,N) -> RangeNotSupported; the recorded event has range starting at 0; totals.weight > 0 when the file has data beyond 8+N"
    - "test_cap: ByteLog(threshold_bytes=64MiB); read_file('config.json') where a wrapping MockTransport drops 'size' from that sibling in the API JSON and the file body is > META_MAX_BYTES (monkeypatch scout.hub.META_MAX_BYTES and scout.bytelog.META_MAX_BYTES to 100) -> ReadThresholdExceeded; the received bytes are recorded"
    - "test_gated: add_repo(gated=True, token='hf_x'): without a token read_file('config.json') raises GatedRepoError mentioning 'HF_TOKEN not set'; with token='hf_x' it succeeds"
    - "test_repo_not_found: RepoNotFoundError"
    - "test_error_mapping: a wrapping MockTransport (1) keeps X-Error-Code RepoNotFound but changes the body to {'error':'nope'} -> RepoNotFoundError; (2) drops the header and lowercases the body to 'repository not found' -> RepoNotFoundError; (3) returns 400 with an empty body -> HubAPIError; (4) returns 200 with {'id':'x'} (no sha) -> HubAPIError. No KeyError in any case"
    - "test_relative307_meta: add_repo(meta_redirect='relative307'): read_file('config.json') returns the right bytes; one '@redirect' fetch event of 18 bytes; the second hop goes to HUB '/api/resolve-cache/...'; totals.meta == 18 + file size (+ API bytes)"
    - "test_error_body_logged: an unknown repo (401 JSON body) -> RepoNotFoundError; exactly one 'error' event with path '@error' whose bytes == len(body); totals.meta grew by that length; a 503 on a shard read logs its body under '@error', not as header"
    - "test_redirect_body_cap: a transport returns a 302 with a 70 KiB body -> ReadThresholdExceeded; the received bytes are recorded; reserved == 0"
    - "test_env_token: monkeypatch HF_TOKEN -> the Authorization header is used for HUB requests"
  commands:
    - pytest -q tests/test_hub_source.py
    - pytest -q
out_of_scope:
  - parallelism (T010 owns the thread pool). HubSource must be safe to call concurrently; httpx.Client is thread-safe; keep no per-call mutable state on self
  - interactive download confirmation (Phase 2)
  - gzip/br decoding
