id: T112
title: CLI - scan --sample/--tokenizer/--confirm-plan/--confirm-bytes/--gate-threshold-bytes (plan always printed, exact-cap confirmation); diff and suggest subcommands
depends_on: [T012, T108, T111]
files:
  - scout/cli.py
  - tests/test_cli_p2.py
route: opus
spec_complete: true
interface: |
  scout/cli.py (additions to P1 T012; main signature unchanged; client_factory still tests-only):
    scout scan TARGET [--out DIR] [--max-read-bytes INT] [--endpoint URL]
                      [--sample] [--tokenizer] [--confirm-plan PLAN_ID --confirm-bytes INT] [--gate-threshold-bytes INT]
    scout diff REF_CARD SUBJ_CARD [--json]            # paths to *.card.json
    scout suggest CARD [--out DIR] [--top INT] [--json]
    defaults: --gate-threshold-bytes = DEFAULT_GATE_THRESHOLD_BYTES; --top = 5; suggest --out = env SCOUT_CARDS_DIR or "./cards"

    def gate_display(stderr: TextIO) -> Callable[[str], None]     # writes the text + "\n" to stderr and flushes
    def format_diff(view: dict) -> str
    def format_suggest(result: dict) -> str
behavior: |
  1. There is no interactive prompt (TTY or not). The only CLI confirmation is the pair --confirm-plan PLAN_ID
     --confirm-bytes N, which T106 flag_confirmer approves only when PLAN_ID == plan.plan_id and N == plan.bytes_cap
     exactly. Both numbers are printed by the gate display of an earlier run, so the human can only confirm a plan they saw.
  2. scan: pass tokenizer=args.tokenizer, sample=args.sample, gate_threshold_bytes=..., gate_display=gate_display(sys.stderr),
     and confirmer=gate.flag_confirmer(args.confirm_plan, args.confirm_bytes) when --sample is given (else None).
     --confirm-plan without --confirm-bytes or vice versa -> argparse error (exit 2); either of them without --sample -> exit 2.
     The gate display prints format_plan to stderr BEFORE the decision on every path (T106 run_gate), including approval.
     The stdout JSON gains "gate": result.gate and "plan_bytes": plan.bytes_planned if plan else null.
     On GateDeclined e: the plan was already printed by the display; print
     f"declined: rerun with --confirm-plan {e.plan['plan_id']} --confirm-bytes {e.plan['bytes_cap']}" to stderr and return 6
     (the P1 ScoutError path already maps exit_code).
  3. diff: (ref, rt) = load_card(Path(REF)); (sub, st) = load_card(Path(SUBJ)); view = diff.build_diff(ref, rt, sub, st).
     --json -> print json.dumps(view) to stdout. Else print format_diff(view) to stdout. Return 0.
     A missing file -> "error: ..." and return 1.
  4. format_diff(view) lines:
     "REFERENCE {reference.title}" / "SUBJECT   {subject.title}"
     "config: score {score or '-'} ({compared} keys); mismatches: {comma list or 'none'}"
     "tokenizer: jaccard {jaccard:.3f}" or "tokenizer: n/a ({reason})"
     per stack pair: "stack {reference_prefix} ({reference_depth}) <-> {subject_prefix} ({subject_depth}): {kind}, mode {mode},
       location {'resolved' if location_resolved else 'UNRESOLVED'}"; then, if jumps, "  jumps: " + "; ".join(f"{s}:{f}->{t}");
       duplicated/pruned lists if non-empty; then a table header "  subj  ref  op        struct  r" and one line per layer
       f"  {subject_index:>4}  {reference_index:>3}  {op:<8}  {struct_cost:>6.2f}  {r:+.3f}" ("   n/a" for null r)
     "weight: median r {median_r:+.3f} over {n_with_r}/{n_layers} layers (roles {roles})" or "weight: n/a ({reason})";
     when available, one more line "in-run null: q10 {q10_r:+.3f}  offdiag {offdiag_median_r:+.3f}  top1 {diag_top1_frac:.2f}
     z_shift {z_shift:+.2f} ('n/a' if null)  PR ref {participation_ratio.reference:.2f} subj {participation_ratio.subject:.2f}"
     "tensors: {len(only_in_reference)} only in reference, {len(only_in_subject)} only in subject, {len(shape_changed)} shape changed"
     then "note: " + each disclaimer.
  5. suggest: (card, _) = load_card(Path(CARD)); pool = [c for _, c in suggest.list_cards(Path(out))];
     result = suggest.suggest(card, pool, top_n=args.top); --json -> json.dumps(result); else format_suggest:
     one line per suggestion f"{rank}. {title}  score {score:.3f}  tokenizer {J:.3f|n/a}  config {cs:.3f|n/a}  {'claimed base' if claimed_base_match else ''}",
     then "note: " + each of result["disclaimers"] (all three, invariant 5).
  6. No other behaviour of P1 commands changes. The disclaimers are still printed after a successful scan.
acceptance:
  tests:
    - "local repos from weights_fixtures (family seed 1 + fine-tune + independent llama-style), all with vocab"
    - "test_scan_two_step: run 1 main(['scan', dir, '--out', tmp, '--sample', '--tokenizer', '--gate-threshold-bytes', '0']) -> exit 6; stderr contains 'DOWNLOAD GATE', the plan_id and 'rerun with --confirm-plan <id> --confirm-bytes <cap>'; out dir empty. Run 2 with exactly those two values -> exit 0; stderr again contains 'DOWNLOAD GATE' (printed before the read); stdout JSON gate[0].approved True, via 'cli-flag', bytes_confirmed == cap; the card has sigma_curves"
    - "test_plan_printed_before_read: in run 2 the confirmer is wrapped by a spy that records sys.stderr's content and the FakeHub cdn_reads at call time -> 'DOWNLOAD GATE' already on stderr and no cdn_reads range starts at >= 8+N"
    - "test_confirm_blanket_number: --confirm-plan <id> --confirm-bytes 999999999999 -> exit 6 (a blanket number larger than the cap declines); --confirm-bytes cap-1 -> exit 6; --confirm-plan 0000000000000000 with the right cap -> exit 6"
    - "test_no_prompt_on_tty: a stdin double with isatty() True and readline 'yes' and no flags -> exit 6 (stdin is never read)"
    - "test_confirm_flags_pairing: --confirm-bytes alone, --confirm-plan alone, either without --sample -> exit 2"
    - "test_diff_cmd: main(['diff', base_card, finetune_card, '--json']) == 0 and the JSON weight.median_r equals build_diff's; the text mode contains 'kind' words 'same', 'median r', 'in-run null' and the 3 disclaimers"
    - "test_suggest_cmd: main(['suggest', finetune_card, '--out', tmp]) lists the base first and prints all 3 disclaimers; --json parses and has disclaimers == list(DISCLAIMERS)"
    - "P1 tests/test_cli.py passes unchanged"
  commands:
    - pytest -q tests/test_cli_p2.py tests/test_cli.py
    - pytest -q
out_of_scope:
  - server/UI (T113, T114)
  - any new subcommand beyond diff/suggest
invariants_touched: [1, 2, 5]
decisions: []
