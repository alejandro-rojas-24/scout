id: T108
title: Scan integration - tokenizer fetch (META), gated SAMPLED_READ, COMPUTE with purge, Card v1 stats fill, PURGE stage
depends_on: [T010, T102, T104, T106, T107]
files:
  - scout/scan.py
  - tests/test_scan_p2.py
route: opus
spec_complete: true
interface: |
  scout/scan.py (changes to P1 T010):
    @dataclass(frozen=True)
    class ScanResult:
        cards: list[CardPaths]; totals: dict[str, int]; elapsed_s: float; revision_sha: str; repo: str
        gate: list[dict] = field(default_factory=list)        # NEW: log.gate_decisions
        plan: dict | None = None                               # NEW: SamplePlan.to_dict() when sample=True

    def scan(target: str, out_dir: pathlib.Path, log: ByteLog, *, client: httpx.Client | None = None,
             endpoint: str | None = None, token: str | None = None, max_workers: int = 8,
             tokenizer: bool = False, sample: bool = False, confirmer: Confirmer | None = None,
             gate_threshold_bytes: int = DEFAULT_GATE_THRESHOLD_BYTES) -> ScanResult
behavior: |
  P1 steps 1-6 are unchanged. Additions, in order:
  A. (META, right after the P1 config reads) if tokenizer:
     for each unit (subdir = component name or ""), cands = tokenizer_candidates(set(files), subdir, component).
     If cands is empty: tok[unit] = None; notes.append(f"tokenizer: no tokenizer file for {component or 'model'}").
     Else path = cands[0]; read it once per distinct path (cache raw bytes by path) with source.read_file(path);
     try tok[unit] = tokenizer_stat(path, raw) except ValueError as e: tok[unit] = None;
     notes.append(f"tokenizer: {path}: {e}").
  B. (after P1 step 6, structure) if sample:
     plan = plan_sample(source.repo, source.revision_sha, [UnitInput(component, structure_u, headers_u) ...],
     gate_threshold_bytes). For each skipped entry: notes.append(f"sigma: {component or 'model'}: {reason}").
     If plan.reads is empty: notes.append("sigma: nothing sampleable"); skip C-E (no SAMPLED_READ/COMPUTE stages).
  C. log.stage(SAMPLED_READ); d = run_gate(plan, log, confirmer).
     If not d.approved: raise GateDeclined(f"weight sample declined ({d.via}); rerun with --confirm-bytes {plan.bytes_cap}",
     plan=plan.to_dict()). This goes through the P1 error path: error note, no Card, re-raise.
     log.grant(plan.plan_id, [(r.path, r.start, r.end_exclusive) for r in plan.reads], plan.bytes_cap).
     buffers = SampleBuffers(). Use ThreadPoolExecutor(max_workers) and submit, per read,
     lambda: buffers.put(r.tensor, source.read_range(r.path, r.start, r.end_exclusive - r.start)).
     On the first exception: cancel the pending futures, wait for the running ones, buffers.clear(), re-raise.
     finally: log.revoke_grant().
  D. log.stage(COMPUTE); sigma, released = compute_all(buffers, [(r.tensor, r.dtype, r.shape) for r in plan.reads]);
     log.note("purge", f"released {released} weight bytes; resident={buffers.resident_bytes}"). compute_all guarantees
     resident 0 on exit, and on exceptions it clears the buffers (T107).
  E. Per unit with reads: sigma_curves_u = {"version": SIGMA_PARAMS["version"], "method": "full-tensor-svd",
     "svd_dtype": "float64", "stack_prefix", "roles": unit_plan.role_rel, "plan_id": plan.plan_id,
     "bytes_read": sum(end-start of that unit's reads), "tensors": [{"name", "role", "block_index", "file": r.path,
     "range": [r.start, r.end_exclusive], "dtype", "shape": list(r.shape), "n_sigma": len(s), "sigma_max": s[0],
     "sigma_sum_sq": sum(x*x for x in s)} for r in the unit's reads in plan order]} and
     sigma_by_tensor_u = {r.tensor: sigma[r.tensor]}.
  F. (REPORT) build_card(..., options={"sample": sample, "tokenizer": tokenizer}, notes=list(notes),
     sigma_curves=sigma_curves_u or None, sigma_by_tensor=sigma_by_tensor_u or None, tokenizer_minhash=tok.get(unit)).
     The P1 write/rollback logic is unchanged.
  G. After all Cards are written, if C-E ran: log.stage(PURGE); log.note("purge", "resident=0 verified").
  H. Return ScanResult(..., gate=log.gate_decisions, plan=plan.to_dict() if sample else None).
  I. Invariants: weight bytes exist only inside SampleBuffers; nothing is written except Cards; an exception at any
     point after C leaves resident_bytes == 0 and out_dir empty.
acceptance:
  tests:
    - "all hub tests use FakeHub (endpoint=HUB, client=hub.client()) with repos from tests/helpers/weights_fixtures.write_family_repo(FamilySpec(seed=1), vocab=family_vocab(1))"
    - "test_sample_approved_hub: scan(sample=True, tokenizer=True, gate_threshold_bytes=0, confirmer=flag_confirmer(10**9)) -> 1 card; stats.sigma_curves.tensors has 32 entries; parquet stat_sigma_curve non-null for exactly those 32 rows, each of length 64 (min(64,128)); totals.weight == plan.bytes_planned; every fakehub.cdn_reads entry whose range starts >= 8+N equals 'bytes={start}-{end-1}' of a planned read, and each planned read appears once; stage_start order RESOLVE,HEADERS,META,SAMPLED_READ,COMPUTE,REPORT,PURGE; a purge event (COMPUTE, note contains 'resident=0') precedes REPORT; card fetch_log.gate == [1 approved decision via cli-flag]"
    - "test_sigma_matches_local_svd: the stored sigma of one tensor equals sigma_values(decode(bytes read directly from the fixture file)) within 1e-12"
    - "test_sample_declined: confirmer=flag_confirmer(None), gate_threshold_bytes=0 -> GateDeclined whose .plan has bytes_planned > 0; out_dir empty; totals.weight == 0; no cdn_reads range starts at >= 8+N; the log has a declined gate decision"
    - "test_sample_below_threshold: default threshold (64 MiB) and confirmer=None -> approved via below-threshold (the fixture cap is about 16.5 MiB)"
    - "test_sample_local: the same repo as a local folder -> sigma equal (1e-12) to the hub scan's; revision_kind local-stat-hash"
    - "test_sample_pipeline: write_pipeline_repo(root), replace root/text_encoder with write_family_repo(FamilySpec(seed=1)) (no tokenizer there) and write root/tokenizer/tokenizer.json -> 3 cards; text_encoder has sigma_curves and tokenizer_minhash (source_file 'tokenizer/tokenizer.json'); transformer and vae have both null and notes mention 'sigma:'"
    - "test_sample_retry_ok: the confirmer calls hub.inject(<a shard with planned reads>, 'reset', times=1, after_bytes=100) and then approves -> success; 1 retry event; totals.weight == bytes_planned + 100"
    - "test_sample_retry_over_cap: monkeypatch scout.bytelog.RETRY_SLACK_BYTES = 10; the confirmer injects reset after 50 bytes -> WeightReadRefused; out_dir empty; no card; the SampleBuffers resident is 0 (spy via monkeypatched SampleBuffers subclass recording the last instance)"
    - "test_sample_range_ignored: the confirmer injects 'ignore_range' -> RangeNotSupported; totals.weight > 0 (honest); no card"
    - "test_tokenizer_only: tokenizer=True, sample=False -> tokenizer_minhash present, meta totals include len(tokenizer.json), weight 0, no SAMPLED_READ stage"
    - "test_plain_unchanged: default flags -> the P1 stage order, all stats null, options both False, gate []"
    - "test_nothing_sampleable: P1 write_dense_repo (hidden 8) with sample=True -> the card is written, sigma null, notes contain 'sigma:', no SAMPLED_READ stage"
    - "test_no_extra_files_sampled: HOME and TMPDIR monkeypatched to empty dirs stay empty after an approved sampled scan; out_dir holds only *.card.json/*.tensors.parquet"
    - "P1 tests/test_scan.py passes unchanged"
  commands:
    - pytest -q tests/test_scan_p2.py tests/test_scan.py
    - pytest -q
