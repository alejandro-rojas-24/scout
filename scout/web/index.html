<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scout</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --fg: #1d1f21;
    --muted: #6a6f75;
    --border: #d6d8db;
    --accent: #2f6fb3;
    --on-accent: #ffffff;
    --ok: #1f8a3b;
    --ok-bg: #e3f4e7;
    --bad: #c62828;
    --bad-bg: #fbe4e4;
    --warn: #a35f00;
    --warn-bg: #fdf0d9;
    --note-bg: #fff6dc;
    --note-border: #e0c060;
    --neutral: #b9bcc0;
    --stack: #2f6fb3;
    --expert: #9c4fb0;
    --edge: #aab0b6;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b;
      --panel: #1e2125;
      --fg: #e4e6e8;
      --muted: #9aa0a6;
      --border: #363a40;
      --accent: #6aa8e8;
      --on-accent: #0d1b2a;
      --ok: #5fd07c;
      --ok-bg: #173322;
      --bad: #ff7a7a;
      --bad-bg: #3a1c1c;
      --warn: #f0b048;
      --warn-bg: #3a2c12;
      --note-bg: #2e2915;
      --note-border: #7a6626;
      --neutral: #5d6268;
      --stack: #6aa8e8;
      --expert: #c78be0;
      --edge: #555b62;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
  body { overflow-x: hidden; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 8px 0 0; letter-spacing: .02em; }
  h2 { font-size: 16px; margin: 0 0 8px; font-family: var(--mono); word-break: break-all; }
  h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; min-width: 0; }

  /* scan bar */
  #scan-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  #target { flex: 1 1 320px; min-width: 0; padding: 6px 8px; font: 13px var(--mono); color: var(--fg);
            background: var(--panel); border: 1px solid var(--border); border-radius: 4px; }
  #scan { padding: 6px 16px; font: inherit; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 4px; cursor: pointer; }
  #scan:disabled { opacity: .5; cursor: default; }
  #status { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  #status.running { color: var(--accent); }
  #status.done { color: var(--ok); }
  #status.error { color: var(--bad); }

  /* byte counter + log */
  .counters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .counter { font: 13px var(--mono); padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px; }
  #counter-weight.zero { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); font-weight: 600; }
  #counter-weight.unknown { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); font-weight: 600; }
  #counter-weight.nonzero { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); font-weight: 600; }
  #log { list-style: none; margin: 0; padding: 6px 8px; height: 13rem; overflow: auto; resize: vertical;
         font: 12px/1.5 var(--mono); white-space: pre; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; }
  #log li.bad { color: var(--bad); }
  #log li.stage { color: var(--accent); }
  #log:empty::before { content: "no events yet"; color: var(--muted); }

  /* views */
  #cards { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
  .view { min-width: 0; }
  .disclaimers { margin: 0 0 12px; padding: 8px 12px 8px 28px; background: var(--note-bg);
                 border: 1px solid var(--note-border); border-radius: 4px; font-size: 13px; }
  .disclaimers li { margin: 2px 0; }
  .claims { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0;
            padding: 8px 12px; border: 1px dashed var(--border); border-radius: 4px; font-size: 13px; }
  .claims dt { color: var(--muted); }
  .claims dd { margin: 0; font-family: var(--mono); word-break: break-all; }
  .claims .caption { grid-column: 1 / -1; font-weight: 600; }
  .summary { margin: 10px 0 0; font-family: var(--mono); font-size: 13px; }
  .summary .zero { color: var(--ok); font-weight: 600; }
  .summary .nonzero { color: var(--bad); font-weight: 600; }
  .summary .unknown { color: var(--warn); font-weight: 600; }
  .disclaimers li.missing { color: var(--bad); font-weight: 600; }
  .muted { color: var(--muted); }

  .strip { margin: 6px 0 10px; }
  .strip-label { font: 12px var(--mono); margin-bottom: 2px; }
  .strip-svg { overflow-x: auto; max-width: 100%; }
  .strip-svg svg { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 11px var(--mono); color: var(--muted); margin-top: 3px; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; border-radius: 2px; }

  .graph-tools { font-size: 13px; margin-bottom: 4px; display: flex; gap: 16px; flex-wrap: wrap; }
  .graph-wrap { overflow: auto; max-width: 100%; max-height: 36rem; border: 1px solid var(--border);
                border-radius: 4px; background: var(--bg); }
  .graph-wrap svg { display: block; }
  svg text { fill: var(--fg); font: 11px var(--mono); }
  svg .edge { fill: none; stroke: var(--edge); stroke-width: 1; }
  svg .box { fill: var(--panel); stroke: var(--border); }
  svg .root .box { stroke: var(--fg); }
  svg .root text { font-weight: 700; }
  svg .stack .box { stroke: var(--stack); stroke-width: 1.5; }
  svg .expert_group .box { stroke: var(--expert); stroke-width: 1.5; }
  svg .tensor .box { fill: var(--bg); stroke-dasharray: 2 2; }
  svg .tensor text { fill: var(--muted); }
  svg .clickable { cursor: pointer; }
  svg .collapsed .box { stroke-dasharray: 4 2; }
  svg .hatch-line { stroke: var(--fg); stroke-width: 1.2; opacity: .55; }
</style>
</head>
<body>
<main>
  <form id="scan-form" autocomplete="off">
    <h1>scout</h1>
    <input id="target" type="text" spellcheck="false" placeholder="org/model[@revision] or /path/to/local/folder" aria-label="scan target">
    <button id="scan" type="submit">Scan</button>
    <span id="status" role="status">idle</span>
  </form>

  <section class="panel" aria-label="byte log">
    <div class="counters" aria-live="polite">
      <span id="counter-meta" class="counter">meta 0 B</span>
      <span id="counter-header" class="counter">header 0 B</span>
      <span id="counter-weight" class="counter zero">weight 0 B</span>
    </div>
    <ol id="log"></ol>
  </section>

  <div id="cards"></div>
</main>
<script src="app.js"></script>
</body>
</html>
